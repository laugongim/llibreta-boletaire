osas y coníferas, claros y taludes, a menudo en grupos. En las zonas cálidas sale hasta el invierno.", "tox": "Síndrome gastrointestinal: vómitos, diarrea y dolor de tripa al cabo de unas horas. La Societat Catalana de Micologia lo incluye entre las setas a desechar; la mayoría de guías lo consideran tóxico.", "cur": "Cuando hay humedad, las láminas «lloran» gotitas de agua. De ahí su nombre en castellano.", "note": "Olor a RÁBANO, láminas que lloran, esporada marrón.", "conf": [{"t": "Sale en primavera, tiene olor a harina, láminas blancas y esporada blanca."}, {"t": "Sombrero de tacto de gamuza, olor a harina y esporada rosa."}, {"t": "En catalán también se llama «carlet bord». Tiene láminas amarillentas que se vuelven rosadas y esporada rosa. Tóxico."}, {"name": "Hebeloma sinapizans", "t": "Más grande y robusto, sin gotitas en las láminas. También tóxico."}]}, "mycena-pura": {"nom": "Micena pura", "alt": [], "q": null, "f": {"barret": "2–5 cm, lila rosado (también rosa, blanquecino o gris), acampanado y después plano con un pequeño mamelón. Con humedad, el margen tiene estrías.", "himeni": "Láminas blanquecinas a lila pálido.", "peu": "Delgado, hueco y frágil, del color del sombrero. Sin anillo.", "carn": "Delgada, con olor fuerte a rábano.", "espora": "Blanca"}, "hab": "Hojarasca de bosques de coníferas y frondosas.", "tox": "Contiene muscarina en poca cantidad. Puede causar síndrome muscarínico: sudor, salivación y lágrimas poco después de comerla.", "cur": "Es pequeña y común. El olor a rábano al aplastarla es la mejor pista para reconocerla.", "note": "Lila, pequeña, olor a RÁBANO.", "conf": [{"t": "Mucho más grande y carnoso, con olor afrutado y esporada rosa pálido. Comestible bien cocinado."}, {"name": "Laccaria amethystina (lacaria amatista)", "t": "Toda lila intenso, sin olor a rábano y con el pie fibroso y tenaz."}, {"name": "Cortinarius violáceos", "t": "Tienen cortina (telillas finas) en el pie y esporada marrón óxido."}]}, "parasola-plicatilis": {"nom": "Coprino plisado", "alt": [], "q": null, "f": {"barret": "1–3 cm, fino como el papel y lleno de pliegues desde el margen hasta cerca del centro, como un paraguas. Gris pálido, con el centro liso y pardo anaranjado. De joven tiene forma de huevo; después se abre del todo y queda plano.", "himeni": "Láminas pocas y espaciadas, blancas, después grises y negras. Nacen de un collar alrededor del pie, sin tocarlo.", "peu": "Largo (3–8 cm) y muy delgado, blanco, hueco y frágil. Sin anillo.", "carn": "Casi no tiene.", "espora": "Negra"}, "hab": "Céspedes, prados y bordes de caminos, sobre todo en tierra abonada. Sale solo o en grupos pequeños después de la lluvia.", "tox": "Sin interés culinario: es diminuto y no tiene carne. No se debe comer. En el césped puede crecer junto a setas pequeñas mortales.", "cur": "Sale de noche y dura una sola mañana: hacia el mediodía ya se ha arrugado. No gotea tinta como otros coprinos, solo se seca.", "note": "Paraguas plisado con el centro pardo. Dura una mañana.", "conf": [{"t": "Sale en grupos apretados sobre tocones, tiene gránulos brillantes en el sombrero joven y se deshace en tinta."}, {"t": "Más grande y carnoso, gris, en grupos cerca de tocones. Se deshace en tinta. Tóxico con alcohol."}, {"t": "Sombrero cónico blanco crema, sin pliegues, y esporada marrón óxido. También sale en el césped y dura una mañana."}, {"t": "Sombrero pardo anaranjado sin pliegues, un anillo pequeño en el pie y esporada marrón óxido. Mortal."}, {"name": "Parasola leiocephala", "t": "Casi idéntica: solo se puede separar con microscopio. Tampoco tiene ningún interés."}]}, "coprinopsis-lagopus": {"nom": "Coprino pie de liebre", "alt": [], "q": null, "f": {"barret": "1–4 cm, en forma de huevo alargado y después de cono. Gris, cubierto de pelos blancos y finos, como de algodón. Al abrirse, los pelos caen y el margen se enrolla hacia arriba y se rasga.", "himeni": "Láminas apretadas y libres, blancas y después negras. De viejas se deshacen en parte en un líquido oscuro.", "peu": "Largo (4–10 cm) y delgado, blanco, hueco y frágil, cubierto de pelos blancos. Sin anillo.", "carn": "Muy delgada y frágil.", "espora": "Negra"}, "hab": "Tierra rica en humus, hojarasca y, sobre todo, astillas de madera en bosques, parques, jardines y bordes de caminos. A menudo en grupos.", "tox": "Sin interés culinario: es pequeño, frágil y dura pocas horas. No se debe comer.", "cur": "Vive menos de un día: nace de noche, se abre por la mañana y por la tarde ya se ha deshecho. «Lagopus» significa pie de liebre, por los pelos blancos de la seta joven.", "note": "Peludo y blanco, como un pie de liebre.", "conf": [{"t": "Más carnoso y sin pelos blancos. Sale en grupos cerca de tocones. Tóxico con alcohol."}, {"t": "Mucho más grande y robusto, blanco, con escamas lanosas y un anillo en el pie. Comestible de joven."}, {"t": "Sin pelos blancos: sombrero gris plisado con el centro pardo. Sale en el césped."}, {"name": "Coprinopsis nivea (coprino níveo)", "t": "Todo blanco y harinoso, no peludo, y sale sobre estiércol de vaca o de caballo."}]}, "coprinellus-micaceus": {"nom": "Coprino micáceo", "alt": [], "q": null, "f": {"barret": "1–4 cm, en forma de huevo y después de campana. Pardo ocre o pardo miel, con rayas finas desde el margen hacia el centro. De joven está cubierto de gránulos blancos que brillan como la sal; la lluvia los hace caer.", "himeni": "Láminas apretadas, blancas, después pardo púrpura y negras. Al final se deshacen en tinta.", "peu": "3–10 cm, delgado, blanco, hueco y frágil. Sin anillo.", "carn": "Delgada y frágil, blanquecina.", "espora": "Pardo oscuro a negra"}, "hab": "En grupos apretados sobre tocones y madera muerta de planifolios, o en el suelo sobre raíces enterradas. También en parques, jardines y bordes de carreteras.", "tox": "La Societat Catalana de Micologia lo incluye entre las setas a rechazar. Se deshace en tinta en pocas horas y, cerca de carreteras, acumula metales pesados (plomo y cadmio). Además, se confunde con otras setas pequeñas y pardas, algunas mortales.", "cur": "«Micáceo» significa que brilla como la mica, un mineral. Los gránulos del sombrero joven producen ese brillo.", "note": "Grupos sobre tocones, gránulos BRILLANTES.", "conf": [{"t": "Gris, más carnoso y sin gránulos brillantes. Tóxico con alcohol."}, {"t": "También en grupos sobre madera, pero tiene un anillo pequeño, láminas y esporada marrón óxido, y no se deshace en tinta. Mortal."}, {"t": "Sombrero crema con restos blancos de velo en el margen. No tiene gránulos ni se deshace en tinta."}, {"name": "Coprinellus disseminatus (coprino diseminado)", "t": "Mucho más pequeño (menos de 1,5 cm), en cientos sobre tocones. No tiene gránulos brillantes y no se deshace en tinta."}]}, "panaeolina-foenisecii": {"nom": "Paneolo del heno", "alt": [], "q": null, "f": {"barret": "1–3 cm, cónico o de campana y después convexo. Pardo oscuro con humedad. Al secarse se aclara desde el centro a pardo claro o crema, y a menudo deja una franja oscura en el margen.", "himeni": "Láminas adheridas, pardo claro y después pardo oscuro MOTEADO, como jaspeado, con el borde más claro.", "peu": "4–8 cm, delgado, hueco y frágil, crema arriba y pardo hacia la base. Sin anillo.", "carn": "Muy delgada, sin olor especial.", "espora": "Pardo oscuro a pardo púrpura"}, "hab": "Céspedes, jardines, campos de deporte y prados segados, disperso o en grupos. Es una de las setas más comunes del césped.", "tox": "No es comestible: se considera tóxico. Ha hecho enfermar a niños que lo han comido en el césped (vómitos y malestar). Algunos análisis han encontrado rastros de psilocibina, demasiado pequeños para hacer efecto. El gran peligro es confundirlo con setas pequeñas y pardas mortales. Si un niño lo ha comido, llama al 112 o al Servicio de Información Toxicológica (91 562 04 20).", "cur": "«Foenisecii» significa «de los que siegan el heno»: sale en los prados cuando se siegan.", "note": "En el césped, láminas MOTEADAS. No es para comer.", "conf": [{"t": "Sombrero pardo anaranjado, un anillo pequeño y frágil en el pie y esporada marrón óxido, no pardo oscuro. Mortal."}, {"t": "Tiene anillo y esporada marrón óxido. Sale sobre madera, y otras galerinas salen entre el musgo de los prados. Mortal."}, {"t": "Sombrero blanco crema, muy frágil, y esporada marrón óxido. Se marchita en pocas horas."}, {"t": "Esporada NEGRA, faja oscura en el margen del sombrero y sale sobre estiércol o tierra muy abonada. Alucinógeno."}, {"t": "Pie muy tenaz que no se rompe, láminas espaciadas y crema, y esporada blanca. Comestible."}]}, "panaeolus-cinctulus": {"nom": "Paneolo ceñido", "alt": [], "q": null, "f": {"barret": "1,5–5 cm, de campana y después plano con un mamelón ancho. Liso, pardo canela; con humedad es más oscuro. Al secarse se aclara y deja una FAJA oscura en el margen.", "himeni": "Láminas apretadas y adheridas, gris pardo y después negras MOTEADAS, con el borde blanco.", "peu": "4–10 cm, delgado, hueco y frágil, pardo rojizo, más claro y harinoso arriba. Sin anillo.", "carn": "Delgada y parda, sin olor especial.", "espora": "Negra"}, "hab": "Estiércol viejo, compost, montones de paja y céspedes o prados muy abonados. Sale en grupos, a veces unidos por la base.", "tox": "Tóxico y alucinógeno: contiene psilocibina en cantidad muy variable. Entre 15 minutos y 1 hora después provoca alucinaciones, ansiedad, crisis de pánico, confusión, corazón acelerado y pupilas dilatadas, que duran unas horas. Puede llevar a accidentes y conductas peligrosas. En niños puede causar fiebre y convulsiones. La psilocibina es una sustancia controlada: poseerla o venderla es ilegal. El riesgo más grave es confundirlo con setas pequeñas y pardas mortales. Ve a urgencias.", "cur": "«Cinctulus» significa con un cinturón pequeño, por la faja oscura del sombrero cuando se seca.", "note": "Faja oscura, esporada NEGRA, sobre estiércol.", "conf": [{"t": "Más pequeño, en el césped y no sobre estiércol. Esporada pardo oscuro, no negra, y sin faja oscura en el margen. Tóxico."}, {"t": "Sombrero gris claro, con dientes blancos colgando del margen y sin faja oscura. Sobre estiércol de caballo o vaca."}, {"t": "Tiene un anillo pequeño en el pie y esporada marrón óxido, no negra. Mortal."}, {"t": "Tiene anillo y esporada marrón óxido. Mortal: es la confusión más peligrosa de las setas pequeñas y pardas."}, {"t": "Sombrero crema con restos blancos de velo en el margen, cerca de tocones, y láminas no moteadas."}]}, "panaeolus-papilionaceus": {"nom": "Paneolo de campana", "alt": [], "q": null, "f": {"barret": "1,5–4 cm, en forma de campana que no se abre del todo. Pardo grisáceo o pardo claro, seco y liso. Del borde cuelgan unos dientecillos blancos, restos del velo.", "himeni": "Láminas grises que se van manchando de negro a medida que maduran las esporas, con la arista blanca.", "peu": "Largo (6–12 cm) y muy delgado, frágil y hueco, pardo grisáceo, con una pruina blanca. Sin anillo.", "carn": "Muy delgada, sin olor especial.", "espora": "Negra"}, "hab": "Sobre estiércol de vaca y de caballo, y en prados y pastos abonados, sola o en grupitos.", "tox": "No es comestible y no tiene ningún interés culinario. Los análisis modernos no han encontrado psilocibina, pero su pariente Panaeolus cinctulus, muy parecido y que sale en los mismos prados, sí la tiene y es tóxico.", "cur": "Antes se distinguían tres especies: Panaeolus sphinctrinus, P. campanulatus y P. retirugis. Hoy se sabe que son la misma. Las manchas negras de las láminas aparecen porque las esporas no maduran todas a la vez.", "note": "Campana gris, DIENTES blancos en el borde, láminas manchadas.", "conf": [{"t": "Sombrero pardo oscuro que se aclara al secarse, a menudo con una banda oscura en el borde, y sin dientes blancos. Tiene psilocibina. Tóxico."}, {"t": "Sale en el césped, no en el estiércol. Las láminas están manchadas de marrón chocolate, no de negro."}, {"t": "Sombrero ocre pálido que se vuelve blanquecino, pie blanco y láminas sin manchas. Sale cerca de tocones, no en el estiércol."}, {"t": "Pequeña y parda como esta, pero con un anillo en el pie y esporada marrón óxido. Mortal."}]}, "psathyrella-candolleana": {"nom": "Psatirela pálida", "alt": [], "q": null, "f": {"barret": "3–8 cm, cónico y después plano. Ocre claro de joven y pronto casi blanco al secarse. En el borde tiene restos blancos del velo, como una puntilla, que caen pronto.", "himeni": "Láminas apretadas, blanquecinas de jóvenes, después gris lila y al final pardo oscuro.", "peu": "Blanco, hueco y muy frágil: se rompe limpio, como si fuera de cristal. Sin anillo.", "carn": "Muy delgada y frágil, sin olor especial.", "espora": "Pardo púrpura oscuro"}, "hab": "En grupitos en céspedes de parques y jardines, bordes de caminos y claros, cerca de tocones o raíces que se pudren.", "tox": "Sin interés culinario. Algunas guías la dan como comestible, pero es muy delgada y se puede confundir con setas pequeñas tóxicas o mortales. No la recojas.", "cur": "Es una seta muy común y no tiene ningún nombre popular. Desde 2020 algunos autores la ponen en un género nuevo: Candolleomyces candolleanus.", "note": "Pálida, PUNTILLA blanca en el borde, pie de cristal.", "conf": [{"t": "Sale en el estiércol y en los pastos. Tiene las láminas manchadas de negro y la esporada negra."}, {"t": "Sombrero blanco, cónico como un dedal, más pequeño y frágil, que se marchita antes del mediodía. Esporada marrón óxido."}, {"t": "Sombrero ocre con granitos brillantes y láminas que se vuelven negras. Sale en matas sobre tocones."}, {"t": "Sombrero blanco sedoso con un mamelón puntiagudo, olor a tierra y esporada marrón tabaco. Sale en los bosques. Tóxico."}, {"t": "Más pequeño, pardo anaranjado, con un anillo en el pie y esporada marrón óxido. Mortal."}]}, "conocybe-apala": {"nom": "Conocibe blanco", "alt": [], "q": null, "f": {"barret": "1–3 cm, cónico y alargado, como un dedal. Blanco lechoso a crema, algo ocre en el centro.", "himeni": "Láminas ocre pálido que se vuelven marrón óxido.", "peu": "Largo (4–10 cm) y muy delgado, blanco, hueco y frágil. Sin anillo.", "carn": "Muy delgada, sin olor ni sabor especial.", "espora": "Marrón óxido"}, "hab": "Céspedes, prados de hierba corta y pastos abonados, después de las lluvias. Sale por la mañana y se marchita antes del mediodía.", "tox": "Toxicidad poco conocida. Un estudio encontró faloidina, una toxina de la misma familia que las de la oronja verde, en poca cantidad. Trátalo como tóxico.", "cur": "Dura solo unas horas: con el sol del mediodía el pie cae y el sombrero se arruga. Antes se llamaba Conocybe lactea o C. albipes.", "note": "Dedal BLANCO en el césped, solo por la mañana.", "conf": [{"t": "Sombrero pardo anaranjado, no blanco, y un anillo en el pie. Mortal."}, {"t": "Más grande, con restos blancos del velo en el borde del sombrero y esporada pardo púrpura oscuro."}, {"t": "Sombrero delgado y plegado como un paraguas, con surcos, y esporada negra."}, {"t": "También blanco y sedoso, pero más robusto, con olor a tierra. Sale en los bosques, no en el césped. Tóxico."}, {"t": "Sombrero color cuero, láminas blancas y espaciadas y pie tenaz que no se rompe. Esporada blanca."}]}, "conocybe-rugosa": {"nom": "Conocibe anillado", "alt": [], "q": null, "f": {"barret": "1–3 cm, cónico y después convexo o plano, con un pequeño mamelón. Pardo anaranjado o pardo miel, con estrías en el borde cuando está húmedo. Al secarse se aclara a color crema.", "himeni": "Láminas crema de jóvenes, después marrón óxido.", "peu": "Muy delgado (1–3 mm) y de 1,5 a 6 cm, claro. En la parte de arriba tiene un anillo pequeño que se mueve y que con la edad puede desaparecer.", "carn": "Muy delgada, sin olor especial.", "espora": "Marrón óxido"}, "hab": "Jardines, parterres con astillas o corteza, compost, céspedes y bordes de caminos. También en el suelo de los bosques, cerca de restos de madera.", "tox": "Amatoxinas (alfa-amanitina), las mismas que la oronja verde. Síndrome faloidiano: los primeros síntomas (vómitos, diarrea) aparecen entre 6 y 24 horas después; hay una falsa mejoría y después una lesión grave del hígado. Mortal. Ve a urgencias aunque te encuentres bien.", "cur": "Mide pocos centímetros y sale en los jardines de las casas y en los parques, donde pueden jugar niños y perros. Antes se llamaba Conocybe filaris; hoy también Pholiotina rugosa.", "note": "Pequeño, PARDO, con ANILLO, en el césped o en las astillas = MORTAL.", "conf": [{"t": "No son parientes cercanos, pero se parecen mucho y tienen el mismo veneno: pequeños, pardos, con anillo y esporada marrón óxido. La galerina sale sobre madera podrida. Mortal."}, {"t": "Sale en los mismos céspedes. La senderuela tiene las láminas blancas y espaciadas, no tiene anillo y el pie es tenaz. Si recoges senderuelas, revísalas una a una."}, {"t": "Muy común en el césped, sin anillo, con láminas manchadas de pardo oscuro. No es comestible."}, {"t": "Sin anillo, con láminas manchadas de negro y esporada negra. Quien busca setas psicoactivas en el césped puede coger por error esta seta mortal."}, {"t": "Sombrero blanco crema y sin anillo. Toxicidad poco conocida."}]}, "cogomina-blanca": {"nom": "Lepiota blanca", "alt": [], "q": null, "f": {"barret": "4–10 cm, primero redondeado y después plano. Blanco o crema, liso y sedoso; de viejo, el centro se vuelve ocre grisáceo.", "himeni": "Láminas libres (no tocan el pie), apretadas y blancas. De viejas se vuelven crema rosado, pero nunca marrones.", "peu": "Blanco, delgado y largo, con la base engrosada en forma de maza. Anillo estrecho y blanco que se puede mover arriba y abajo. No tiene volva. Se mancha de amarillo pardo al tocarlo.", "carn": "Blanca y blanda, con olor suave a seta, como un champiñón.", "espora": "Blanca"}, "hab": "Céspedes, prados, jardines, parques, huertos y bordes de caminos. También sale dentro de los invernaderos. Sola o en grupos pequeños.", "tox": "Se considera comestible, pero no se recomienda: a algunas personas les causa trastornos digestivos y, sobre todo, se confunde con las amanitas blancas mortales. Si no has desenterrado la base entera ni has hecho la esporada, no te la comas.", "cur": "Antes se llamaba Lepiota naucina, y algunos autores la llaman ahora Leucocoprinus leucothites. Huele a champiñón, pero las láminas nunca se vuelven marrones: es la diferencia más fácil con los champiñones.", "note": "Toda BLANCA + anillo + SIN volva. ¡Desentierra la base!", "conf": [{"t": "Toda blanca, con un anillo en forma de falda y una volva en forma de saco en la base, a menudo enterrada. Las láminas son siempre blancas. Mortal."}, {"t": "Sin anillo, con volva en la base y láminas que se vuelven rosa salmón. Esporada rosa."}, {"t": "Láminas rosadas que se vuelven pardo chocolate, y esporada parda. Comestible."}, {"t": "Champiñón blanco y robusto de los caminos, con anillo doble y láminas rosadas y después pardas. Comestible."}, {"t": "Más pequeñas, con escamas vinosas o pardas en el sombrero. Mortales."}]}, "terrerol": {"nom": "Champiñón de acera", "alt": [], "q": "Bueno", "f": {"barret": "5–15 cm, blanco o crema, liso, grueso y muy firme. A menudo sale con tierra encima. El borde queda enrollado hacia dentro.", "himeni": "Láminas libres, rosa pálido de jóvenes y después pardo chocolate.", "peu": "Corto y grueso, blanco. Tiene un anillo doble: uno arriba y otro más abajo, como una vaina.", "carn": "Blanca y muy firme, que se vuelve algo rosada al cortarla. Olor agradable.", "espora": "Pardo chocolate"}, "hab": "Tierra dura y pisada: caminos, bordes de carreteras, alcorques de los árboles, plazas y jardines. Sale medio enterrado y puede levantar la tierra e incluso el asfalto.", "tox": "No lo recojas en bordes de carreteras ni en las calles: las setas acumulan metales pesados y otros contaminantes.", "cur": "Es tan fuerte que puede levantar el asfalto de las aceras. Por eso en castellano se le llama «champiñón de acera».", "note": "Champiñón de los CAMINOS: anillo DOBLE. Lejos de los coches.", "conf": [{"t": "Si rascas la base del pie, se vuelve amarillo intenso, y huele a tinta o a yodo. Tóxico."}, {"t": "Láminas siempre blancas y una volva en forma de saco en la base. Mortal."}, {"t": "Más delgada, con láminas blancas y esporada blanca. No se recomienda."}, {"t": "Más delgado, con un anillo sencillo y frágil. Sale en prados y pastos. Comestible."}]}, "volvaria": {"nom": "Volvaria vistosa", "alt": [], "q": null, "f": {"barret": "5–15 cm, primero en forma de huevo y después plano, con un mamelón bajo. Blanquecino a gris, a veces gris oliva, liso y pegajoso cuando está húmedo.", "himeni": "Láminas libres, blancas de jóvenes y después rosa salmón.", "peu": "Largo, delgado y blanco, sin anillo. En la base tiene una volva blanca grande en forma de saco.", "carn": "Blanca y blanda, sin olor ni sabor especial.", "espora": "Rosa"}, "hab": "Campos abonados, huertos, jardines, compost, montones de paja y terrenos removidos. Sale sobre todo en otoño e invierno, sola o en grupos.", "tox": "Se considera comestible pero sin valor, y no se recomienda: de joven tiene las láminas blancas y es muy fácil confundirla con las amanitas mortales, que también tienen volva.", "cur": "Es una de las pocas setas con volva que no es una amanita. La diferencia más segura es la esporada: rosa en la volvaria, blanca en las amanitas.", "note": "VOLVA pero SIN anillo, láminas ROSAS. Esporada rosa.", "conf": [{"t": "Tiene anillo en el pie, las láminas son siempre blancas y la esporada es blanca. Mortal."}, {"t": "Sombrero verde oliva, con anillo y láminas blancas. Esporada blanca. Mortal."}, {"t": "Tiene anillo y no tiene volva. Esporada blanca. No se recomienda."}]}, "cogomina-groga": {"nom": "Seta amarilla de las macetas", "alt": ["lepiota amarilla"], "q": null, "f": {"barret": "2–6 cm, primero en forma de huevo y después de campana. Amarillo limón o amarillo azufre intenso, cubierto de escamas como polvo, con el borde estriado.", "himeni": "Láminas libres, apretadas, amarillo pálido.", "peu": "Delgado y amarillo, con la base engrosada y un anillo pequeño y frágil que a veces desaparece.", "carn": "Muy delgada y amarillenta.", "espora": "Blanca"}, "hab": "Macetas y jardineras, sobre todo con tierra de turba o compost comprada, e invernaderos. Dentro de casa o de un invernadero puede salir cualquier mes; fuera, en verano y otoño.", "tox": "Tóxica: causa trastornos digestivos. No es peligroso tocarla, pero quítala de las macetas si hay niños o animales en casa. No daña la planta.", "cur": "Llega con la tierra de las macetas desde zonas cálidas. Es la seta más habitual dentro de las casas y en los invernaderos.", "note": "AMARILLO LIMÓN en las macetas. Tóxica.", "conf": [{"t": "También amarilla, en céspedes y estiércol, pero sin anillo, con el sombrero pegajoso y esporada marrón óxido."}]}, "gita-de-bruixa": {"nom": "Clatro rojo", "alt": ["jaula roja"], "q": null, "f": {"barret": "No tiene sombrero. Nace como un huevo blanco de 3–6 cm, medio enterrado, que se abre en una bola hueca de 5–20 cm hecha de rejilla, rojo anaranjado, como una jaula.", "himeni": "No tiene láminas. Las esporas están dentro de una pasta verde oliva pegajosa, en la cara interior de la rejilla.", "peu": "No tiene pie. En la base quedan los restos del huevo, como una volva.", "carn": "Esponjosa y frágil. Huele muy fuerte a carne podrida, lo que atrae a las moscas.", "espora": "Verde oliva, en una pasta pegajosa"}, "hab": "Jardines y parques con corteza o astillas, parterres y lugares con mucho humus, en las zonas bajas y cálidas. Sale sobre todo en primavera y otoño.", "tox": "No es comestible. El olor ya avisa: no lo toques mucho y lávate las manos después.", "cur": "El olor atrae a las moscas, que se llevan las esporas pegadas a las patas. En muchas zonas de Cataluña se le llama «cranc» (cangrejo).", "note": "Jaula ROJA que huele mal. No se come.", "conf": [{"t": "El huevo de una amanita, cortado de arriba abajo, muestra el dibujo de un sombrero, láminas y pie. El huevo del clatro es gelatinoso por dentro y se ve la rejilla plegada. Mortal."}, {"t": "Del mismo grupo, pero se abre en brazos rojos como tentáculos. También sale en los jardines."}]}, "cortinarius-mucosus": {"nom": "Cortinario viscoso", "alt": [], "q": null, "f": {"barret": "4–10 cm, de campana y después plano. Naranja pardo a pardo rojizo, más oscuro en el centro y más claro en el borde. Muy viscoso cuando está húmedo, con el borde enrollado.", "himeni": "Láminas apretadas, escotadas, crema de jóvenes y después marrón canela oxidado.", "peu": "Blanco y cilíndrico, envuelto en una capa viscosa bajo una cortina también pegajosa, que deja una zona de anillo oxidada.", "carn": "Blanca, casi sin olor, de sabor suave.", "espora": "Marrón óxido"}, "hab": "Pinares de pino silvestre y de pino negro de montaña, a menudo entre musgo, a partir de 1.000 m. En el Berguedà se ha encontrado en el Ensija, Peguera, Gresolet, Gisclareny y la Nou.", "tox": "No es comestible. No se conoce ninguna toxina concreta, pero no se debe comer ningún cortinario: algunos son mortales y cuesta mucho distinguirlos.", "cur": "El nombre científico de su grupo, Myxacium, viene del griego myxa, «moco», por la capa viscosa. Representa todos los cortinarios viscosos de pinar que se parecen a las babosas.", "note": "Babosa con CORTINA y esporada OXIDADA. No.", "conf": [{"t": "Láminas blancas, gruesas, espaciadas y que bajan por el pie, esporada blanca y sin cortina. Excelente."}, {"t": "Láminas que bajan por el pie, grises y después negras, esporada negra y carne amarilla en la base del pie."}, {"t": "Sombrero pálido y láminas blancas que bajan por el pie."}, {"t": "Sombrero seco y fibroso, pardo anaranjado. Mortal. Por eso no se debe comer nunca ningún cortinario de esporada oxidada."}]}, "cortinarius-caerulescens": {"nom": "Cortinario azulado", "alt": [], "q": null, "f": {"barret": "Hasta 8 cm, redondeado y después convexo. Azul violeta a gris violeta, que con la edad se vuelve ocre. Pegajoso y brillante cuando está húmedo.", "himeni": "Láminas apretadas y escotadas, violetas, después gris violeta y finalmente marrón óxido.", "peu": "Gris azul, con un bulbo grande en la base que tiene un borde marcado. De joven tiene una cortina pálida que dura poco.", "carn": "Blanca violácea en el sombrero, azul violeta en el pie y crema en el bulbo. Olor a tierra y sabor dulce.", "espora": "Marrón óxido"}, "hab": "Hayedos y robledales, también bosques mixtos de pino silvestre y haya, en terreno calcáreo. En el Berguedà, en Gréixer, Gresolet, Malanyeu, Cercs, Peguera, Berga y Castellar del Riu.", "tox": "No es comestible. No se sabe que sea tóxico, pero es un cortinario y no se debe comer ninguno.", "cur": "Representa los cortinarios violetas que se confunden con el pie azul. El azul se pierde con la edad y los ejemplares viejos parecen otra seta. Hay otros, como C. violaceus, más raro en el Berguedà.", "note": "Violeta con CORTINA y BULBO con borde = cortinario.", "conf": [{"t": "Sin cortina ni bulbo con borde, láminas que se mantienen lilas y esporada rosada. Comestible con precaución."}, {"t": "Pequeña (2–5 cm), frágil, con olor a rábano y esporada blanca. Tóxica."}, {"t": "Láminas blancas y quebradizas y esporada blanca. Excelente."}, {"t": "Cortinario pardo anaranjado y seco. Mortal: por eso no se debe comer ningún cortinario."}]}, "amanita-spissa": {"nom": "Oronja de pie grueso", "alt": ["amanita gris"], "q": "Aceptable", "f": {"barret": "6–15 cm, gris pardo (más ocre bajo coníferas), con placas harinosas gris blanco que la lluvia se lleva. El borde no es estriado.", "himeni": "Láminas blancas y apretadas.", "peu": "Grueso, blanco grisáceo, con un anillo alto, grande y blanco, estriado por encima. La base es un nabo hinchado, sin volva en forma de saco, solo con anillos escamosos grises.", "carn": "Blanca, que no enrojece. Olor leve a patata cruda o a rábano.", "espora": "Blanca"}, "hab": "Abetales, pinares y hayedos de montaña, a partir de 500 m. En el Berguedà se ha encontrado en el hayedo de Gréixer.", "tox": "La Sociedad Catalana de Micología la considera aceptable, pero cruda es tóxica y se confunde mucho con la amanita pantera, que es tóxica. No se recomienda a quien empieza.", "cur": "Spissa quiere decir «gruesa» en latín, por el pie tan robusto.", "note": "Gris, sin rojo en la carne. Cuidado con la PANTERA.", "conf": [{"t": "Verrugas blancas puras, borde del sombrero estriado, anillo liso más bajo y bulbo con un borde limpio o anillos. Tóxica."}, {"t": "La carne y los agujeros de los gusanos se vuelven rojo vino, y la base tiene manchas rojizas. Comestible con precaución."}]}, "amanita-citrina": {"nom": "Oronja limón", "alt": ["amanita citrina"], "q": null, "f": {"barret": "4–10 cm, amarillo limón pálido a amarillo verdoso, o blanco en una variedad. Placas blanquecinas u ocre. Borde no estriado.", "himeni": "Láminas libres, blancas o amarillentas.", "peu": "Blanco amarillento, con un anillo que dura. En la base, un bulbo grande y redondo con un borde afilado, como un surco, no un saco libre.", "carn": "Blanca, con un olor fuerte a patata cruda.", "espora": "Blanca"}, "hab": "Robledales, encinares, pinares, hayedos y abedulares, sobre todo en terreno ácido. En el Berguedà, en Gréixer, Castellar de n’Hug y l’Espunyola.", "tox": "A rechazar. Contiene bufotenina, una sustancia parecida a la de la piel de los sapos, de efecto suave. El peligro de verdad es confundirla con la oronja verde.", "cur": "La bufotenina recibe el nombre de los sapos (Bufo), que tienen el mismo compuesto en la piel.", "note": "Amarillo pálido + olor a PATATA CRUDA + bulbo con surco.", "conf": [{"t": "Sombrero amarillo ocre con el borde estriado, anillo frágil o ausente y una volva pequeña como un collar. Sin olor a patata."}, {"t": "Sombrero verde oliva con fibras radiales, normalmente limpio, y una volva grande en forma de saco libre. Mortal."}, {"t": "La forma blanca de la oronja limón se le parece: la oronja primaveral es blanca pura, con volva de saco y sale en primavera. Mortal."}]}, "hebeloma-sinapizans": {"nom": "Hebeloma con olor a rábano", "alt": [], "q": null, "f": {"barret": "4–16 cm, convexo y después plano con un mamelón bajo. Ocre tostado a pardo rojizo, satinado y grasiento cuando está húmedo, con el borde enrollado.", "himeni": "Láminas escotadas y apretadas, blanquecinas y después color arcilla, con el filo blanquecino y aserrado.", "peu": "Robusto y blanquecino, con bandas de escamas. Base algo engrosada. Se vuelve hueco, y si lo cortas, dentro cuelga una cuña de carne en forma de triángulo. Sin anillo.", "carn": "Blanca y gruesa. Olor fuerte a rábano y sabor amargo.", "espora": "Color arcilla"}, "hab": "Bosques de planifolios y de coníferas: robledales, encinares con pino carrasco, hayedos, pinares y abetales. A menudo en grupos o corros. En el Berguedà, en Gréixer, Gisclareny, Gresolet, Saldes, Gósol, Castellar de n’Hug, la Pobla de Lillet y Queralt.", "tox": "Tóxico: síndrome digestivo (vómitos y diarrea) pocas horas después de comerlo.", "cur": "Sinapizans quiere decir «que huele a mostaza», aunque la mayoría de la gente le encuentra olor a rábano.", "note": "Olor a RÁBANO + cuña dentro del pie. Tóxico.", "conf": [{"t": "Más pequeño (3–8 cm) y blanco crema. Las láminas hacen gotitas que se secan como manchas pardas. Sin cuña dentro del pie."}, {"t": "Esporada rosa, láminas amarillentas de jóvenes y olor a harina. Tóxico."}, {"t": "Sale en primavera, tiene la esporada blanca y huele a harina. Excelente."}]}, "pet-de-llop": {"nom": "Pedo de lobo", "alt": ["cuesco de lobo", "bejín perlado"], "q": "Aceptable", "f": {"barret": "No tiene sombrero: es una pera o una maza de 2–6 cm de ancho y 3–9 cm de alto. Blanco, después pardo, cubierto de pinchos y gránulos que caen y dejan una red de marcas. De maduro se abre un agujero arriba.", "himeni": "Dentro. De joven es blanco, firme y uniforme; después se vuelve amarillo oliva y acaba siendo un polvo pardo oliva.", "peu": "Un falso pie ancho y esponjoso, sin esporas, con cordones blancos en la base.", "carn": "Blanca y blanda de joven, de olor y sabor suaves.", "espora": "Pardo oliva"}, "hab": "Hojarasca de todo tipo de bosques, claros, bordes herbosos y márgenes de caminos. Muy común en todo el Berguedà. Los pedos de lobo grandes (Calvatia) salen en los prados de montaña.", "tox": "Solo se puede comer muy joven, cuando por dentro es blanco, firme y uniforme. Córtalo siempre de arriba abajo: si se ve el dibujo de un sombrero y un pie, es un huevo de amanita, que puede ser mortal. De viejo, respirar mucho polvo irrita los pulmones.", "cur": "Cuando una gota de lluvia toca un pedo de lobo maduro, sale una nube de esporas por el agujero de arriba: de ahí le viene el nombre.", "note": "Cortado: BLANCO y uniforme. Si no, no.", "conf": [{"t": "Un huevo de amanita, cortado de arriba abajo, muestra el dibujo de un sombrero, láminas y pie, y a menudo una volva. El pedo de lobo es blanco y uniforme por dentro. Mortal."}, {"t": "Dura, con una piel gruesa amarillenta y escamas grandes. Por dentro se vuelve púrpura negro muy pronto y no tiene agujero arriba. Tóxica."}, {"t": "Piel fina con escamas, pie con surcos e interior oscuro y jaspeado. Tóxica."}, {"t": "El huevo del clatro tiene una capa gelatinosa dentro."}]}, "tofona-negra": {"nom": "Trufa negra", "alt": ["trufa de invierno"], "q": "Excelente", "f": {"barret": "No tiene sombrero: es un tubérculo de 2–8 cm, irregular como una patata, negro o negro rojizo, cubierto de verrugas pequeñas en forma de pirámide.", "himeni": "Dentro. Gris blanquecino de joven y después negro violáceo, jaspeado de venas blancas finas.", "peu": "No tiene. Está unida a las raíces del árbol por micelio.", "carn": "Firme y dura, con un aroma fuerte y muy característico.", "espora": "Pardo oscuro (no hace esporada)"}, "hab": "Enterrada a 5–50 cm, bajo encinas, robles, coscojas y avellanos, en tierra calcárea suelta. A menudo alrededor del árbol hay una calva sin hierba, el «quemado». El Berguedà es una de las comarcas truferas de la Cataluña central. La trufa de invierno (Tuber brumale), también excelente, se le parece: tiene las venas blancas más anchas.", "tox": "Para recogerla en Cataluña hace falta la licencia del Departamento de Agricultura (se pide del 1 de septiembre al 15 de noviembre) y la autorización escrita de la propiedad. Solo se puede buscar con perro adiestrado y del 15 de noviembre al 15 de marzo.", "cur": "Alrededor de la encina trufera la hierba no crece: es el «quemado», la señal que buscan los truferos.", "note": "Enterrada, negra, verrugas en PIRÁMIDE y venas blancas.", "conf": [{"t": "Sale a ras de suelo, no enterrada. Piel lisa o escamosa, nunca con verrugas en pirámide. Cortada, tiene una corteza amarillenta y un interior púrpura negro sin venas blancas, con olor a goma. Tóxica."}, {"t": "Sale en la superficie, con un pie con surcos, y huele mal. Tóxica."}]}, "pota-de-cavall-verrucosa": {"nom": "Escleroderma parda", "alt": [], "q": null, "f": {"barret": "No tiene sombrero: es una bola o una pera de 3–8 cm, ocre a pardo rojizo. La piel es fina (menos de 1 mm) y se rompe en escamas pequeñas; de vieja se rasga arriba.", "himeni": "Dentro. Crema de joven y después pardo púrpura a negruzco con vetas blancas; al final, polvo pardo.", "peu": "Un falso pie bien formado y con surcos de arriba abajo, con cordones en la base.", "carn": "Firme, de olor y sabor desagradables.", "espora": "Pardo oscuro"}, "hab": "Robledales y hayedos, bordes de parques, márgenes de caminos y bordes herbosos de los bosques, en suelo bien drenado o arenoso. En el Berguedà se ha encontrado en Berga y en el valle de Gréixer.", "tox": "Tóxica: causa trastornos digestivos, como la escleroderma común.", "cur": "El pie largo y con surcos es el mejor rasgo para separarla de las otras esclerodermas.", "note": "Bola con PIE con surcos e interior oscuro. Tóxica.", "conf": [{"t": "Piel más gruesa (2–4 mm), amarillenta y con escamas grandes, y casi sin pie."}, {"t": "Blando, con pinchos en la piel, un agujero arriba y blanco por dentro."}, {"t": "Enterrada, negra y con verrugas en pirámide. Excelente."}, {"t": "Corta de arriba abajo cualquier «bola»: si se ve un sombrero y un pie, es un huevo de amanita. Mortal."}]}, "pota-de-cavall-estrellada": {"nom": "Escleroderma estrellado", "alt": [], "q": null, "f": {"barret": "No tiene sombrero: es una bola de 4–12 cm, redonda o aplanada, medio enterrada, crema a ocre y áspera. La piel, muy gruesa y dura, se abre en 4 a 8 puntas como una estrella.", "himeni": "Dentro. Blanco de joven, después pardo oscuro o negruzco con vetas blanquecinas, y al final en polvo.", "peu": "No tiene. En la base, muchos cordones como raíces.", "carn": "La piel es dura y coriácea; sabor agrio y desagradable.", "espora": "Pardo oscuro"}, "hab": "Medio enterrada en tierra pelada, compactada, arenosa o arcillosa, gravas y bordes de caminos, bajo pinos y robles. En el Berguedà se ha citado en Bagà (2023, validada por un experto de Observation.org).", "tox": "Tóxica, como las otras esclerodermas: causa trastornos digestivos.", "cur": "Nace enterrada del todo y aparta la tierra cuando se abre en una estrella que puede medir 15 cm. Las estrellas de tierra (Geastrum) se le parecen, pero tienen las puntas finas y flexibles y un saco de esporas con un agujero.", "note": "Bola dura que se abre en ESTRELLA. Tóxica.", "conf": [{"t": "Antes de abrirse se le parece, pero tiene la piel más fina y las escamas más grandes."}, {"t": "Blanco y uniforme por dentro."}]}, "clathrus-archeri": {"nom": "Dedos del diablo", "alt": ["estrella roja"], "q": null, "f": {"barret": "No tiene sombrero. Nace como un huevo blanquecino de 3–4 cm, gelatinoso por dentro, que se abre en 4 a 8 brazos rojos libres de hasta 10 cm, extendidos como una estrella de mar.", "himeni": "No tiene láminas. Las esporas van en una pasta pardo oliva pegajosa, a manchas, en la cara interior de los brazos.", "peu": "Una base corta, blanquecina y esponjosa, dentro de los restos del huevo.", "carn": "Esponjosa y frágil. Huele a carne podrida.", "espora": "Verde oliva, en una pasta pegajosa"}, "hab": "Hojarasca de bosques húmedos de planifolios (castaños, robles), parques y astillas. Es una especie llegada de fuera que se extiende por las zonas húmedas del nordeste de Cataluña. Todavía no se ha citado en el Berguedà.", "tox": "No es comestible: huele a carne podrida.", "cur": "Llegó a Europa hacia 1914, probablemente con mercancías de Australia o Nueva Zelanda. Las moscas, atraídas por el olor, se llevan las esporas.", "note": "Brazos ROJOS como tentáculos. Mal olor.", "conf": [{"t": "Una bola cerrada de rejilla roja, no brazos libres."}, {"t": "El huevo de una amanita, cortado de arriba abajo, muestra un sombrero, láminas y pie. El huevo de los dedos del diablo es gelatinoso y se ven los brazos plegados. Mortal."}, {"t": "Blanco y uniforme por dentro, sin gelatina."}]}, "laccaria-amethystina": {"nom": "Lacaria amatista", "alt": [], "q": "Aceptable", "f": {"barret": "1–5 cm, convexo y después plano, a menudo hundido en el centro, con el borde ondulado. Violeta intenso cuando está húmedo, que al secarse pasa a lila grisáceo o blanquecino.", "himeni": "Láminas gruesas y muy espaciadas, violetas, unidas al pie o que bajan un poco por él.", "peu": "4–10 cm, delgado, fibroso y tenaz, violeta con fibras blanquecinas y una pelusa lila en la base.", "carn": "Delgada y violeta, de olor y sabor suaves.", "espora": "Blanca"}, "hab": "Hayedos sobre todo, también abetales, robledales y bosques húmedos de coníferas, entre musgo y hojarasca, en suelo ácido. En el Berguedà no hay citas; podría salir en hayedos y abetales de zonas ácidas.", "tox": "La Sociedad Catalana de Micología la considera aceptable, pero acumula arsénico del suelo: no la comas a menudo ni en cantidad. El mayor peligro es confundirla con inocibes y micenas tóxicas.", "cur": "En inglés se le llama «la engañadora amatista» porque, cuando se seca, pierde el violeta y ya no parece la misma.", "note": "Toda VIOLETA, láminas GRUESAS y espaciadas.", "conf": [{"t": "La forma lila: sombrero sedoso y fibroso con un mamelón, láminas apretadas que se vuelven color arcilla y esporada parda. Olor a tierra. Tóxico."}, {"t": "Olor a rábano, pie frágil y hueco, láminas más pálidas y sombrero más cónico. Tóxica."}, {"t": "Más grande y carnoso, con láminas apretadas y esporada rosada."}, {"t": "Cortina como telaraña en el pie, bulbo con borde y esporada marrón óxido."}]}, "paloma-borda": {"nom": "Lepiota de jardín", "alt": ["parasol de jardín"], "q": null, "f": {"barret": "8–20 cm, primero como una bola y después plano. Centro pardo y liso; el resto, con escamas gruesas pardo oscuro, como tejas, sobre un fondo blanco y fibroso.", "himeni": "Láminas libres, blancas o crema, que se manchan de pardo.", "peu": "Liso y blanquecino, sin dibujo de piel de serpiente. En la base tiene un bulbo brusco con un borde marcado, como un escalón. Anillo más sencillo que el de la apagador menor.", "carn": "Blanca; al cortarla se vuelve naranja rojiza y después parda. Olor suave.", "espora": "Blanca"}, "hab": "Jardines, montones de compost, tierra abonada o removida y entre ortigas, cerca de las casas. En el Berguedà no hay citas seguras, pero puede salir en jardines y huertos de las zonas bajas.", "tox": "Se desaconseja: a algunas personas les causa trastornos digestivos, y como crece en compost y jardines puede acumular contaminantes. Trátala como tóxica.", "cur": "Durante mucho tiempo se consideró una variedad de jardín de la apagador menor. El ADN demostró que es pariente de la lepiota de láminas verdes, que es tóxica.", "note": "Parasol de JARDÍN con BULBO con borde. No.", "conf": [{"t": "La base es engrosada pero redondeada, sin borde, y el anillo es doble. Es la diferencia más fiable."}, {"t": "Pie con dibujo de piel de serpiente, carne que no enrojece y más alta y delgada. Sale en los bosques."}, {"t": "Láminas que se vuelven verde grisáceo y esporada verde. Tóxica."}, {"t": "Lepiotas de menos de 10 cm, con escamas vinosas. Mortales: cualquier parasol pequeño es peligroso."}]}, "cogomella-verdejant": {"nom": "Falso parasol", "alt": ["lepiota de esporas verdes"], "q": null, "f": {"barret": "8–25 cm, blanco, con escamas pardo claro y un disco pardo liso en el centro.", "himeni": "Láminas libres, blancas de jóvenes y después verde grisáceo u oliva. Es el rasgo que la delata.", "peu": "Liso, blanquecino, que se vuelve pardo, sin dibujo de piel de serpiente. Anillo doble que se mueve. Base algo engrosada, sin borde.", "carn": "Blanca; al cortarla, como mucho, enrojece un poco. Olor suave.", "espora": "Verde grisáceo"}, "hab": "Céspedes regados, parques y bordes de caminos, a menudo en corros. Es una especie de clima cálido que se está extendiendo por la costa catalana (Maresme, Barcelona, Vallès, Girona). Todavía no se ha citado en el Berguedà, pero podría aparecer en los céspedes regados de las zonas bajas.", "tox": "Tóxica. Síndrome digestivo fuerte entre media hora y 3 horas después: vómitos, diarrea abundante y calambres, a veces con deshidratación, sobre todo en niños. Raramente es mortal. Ha habido intoxicaciones en Cataluña (Mataró, 2016).", "cur": "Es la seta tóxica que más se come por error en América del Norte, y el único parasol común con la esporada verde. Si encuentras un parasol grande en un césped, haz la esporada antes que nada.", "note": "Parasol de CÉSPED: esporada VERDE = tóxica.", "conf": [{"t": "Pie con dibujo de piel de serpiente, láminas siempre blancas y esporada blanca. Sale en los bosques."}, {"t": "Esporada blanca y carne que se vuelve naranja azafrán al cortarla."}, {"t": "Esporada blanca y bulbo con borde en la base."}, {"t": "Más pequeña, con el sombrero blanco y liso, sin escamas."}, {"t": "Láminas rosadas y después pardo chocolate. Comestible."}]}, "parasola-leiocephala": {"nom": "Coprino plisado calvo", "alt": [], "q": null, "f": {"barret": "1–2,5 cm, primero como un huevo y después plano, muy fino y lleno de pliegues. Gris pálido, con un «ojo» pardo anaranjado en el centro.", "himeni": "Láminas blancas, después grises y negras. Libres: no se unen a ningún collar alrededor del pie.", "peu": "Hasta 6 cm, blanco, hueco y muy frágil. Sin anillo.", "carn": "Casi no tiene.", "espora": "Negra"}, "hab": "Hierba corta en los bordes de los bosques, parques, céspedes y astillas. Sale de noche o al alba y dura unas horas.", "tox": "Sin interés culinario: es minúsculo y casi no tiene carne. No se debe comer.", "cur": "Leiocephala quiere decir «cabeza lisa»: el centro del sombrero no tiene los gránulos de otros coprinos. Como el coprino plisado, se arruga en lugar de deshacerse en tinta.", "note": "Paraguas plisado y pequeño. Dura unas horas.", "conf": [{"t": "Casi idéntico. En el coprino plisado, las láminas se unen a un collar alrededor del pie. Para separarlos con seguridad hace falta microscopio."}, {"t": "Sombrero pardo, sin pliegues, y láminas manchadas de marrón oscuro."}, {"t": "Pardo anaranjado, con anillo, sin pliegues y esporada marrón óxido. Mortal."}]}, "coprinopsis-nivea": {"nom": "Coprino níveo", "alt": ["coprino blanco de nieve"], "q": null, "f": {"barret": "1,5–4 cm, primero en forma de huevo y después de campana. Blanco puro, cubierto de un polvo o copos como tiza que se pegan a los dedos. De viejo, el borde se rasga y se levanta.", "himeni": "Láminas apretadas y libres, blancas, después grises y negras. Se deshacen en tinta.", "peu": "Blanco y harinoso, con la base algo engrosada. Sin anillo.", "carn": "Delgada, sin olor especial.", "espora": "Negra"}, "hab": "Estiércol de vaca y de caballo en los pastos, desde el valle hasta los prados de alta montaña. En el Berguedà se ha encontrado en Bagà, Saldes, Fígols, Castellar del Riu, Cercs y la Pobla de Lillet.", "tox": "No es comestible: es pequeño y se deshace en tinta en pocas horas.", "cur": "El polvo blanco son restos del velo que lo envolvía de joven: salen como polvo de tiza al tocarlo.", "note": "Coprino BLANCO de tiza, sobre ESTIÉRCOL.", "conf": [{"t": "Sombrero gris con fibras plateadas como pelos y pie muy peludo. Sale en restos de madera de los bosques, no en el estiércol."}, {"t": "Más grande, gris y en grupos apretados. Tóxico con alcohol."}, {"t": "Grande, con escamas como plumas y anillo en el pie."}, {"t": "También en el estiércol, pero gris pardo, con láminas manchadas que no se deshacen."}]}, "coprinellus-disseminatus": {"nom": "Coprino diseminado", "alt": [], "q": null, "f": {"barret": "0,5–1,5 cm, en forma de huevo y después de campana. Crema o beige con el centro ocre, que se vuelve gris. Tiene surcos marcados y, con lupa, es finamente aterciopelado.", "himeni": "Láminas unidas al pie, blancas, después grises y negras. No se deshacen en tinta.", "peu": "1–4 cm, blanco, muy frágil. Sin anillo.", "carn": "Casi no tiene. Sin olor especial.", "espora": "Pardo oscuro a negra"}, "hab": "En grupos de cientos sobre y alrededor de tocones y madera enterrada de planifolios. Puede salir casi todo el año.", "tox": "Sin interés culinario: es minúsculo y sin carne. No se debe comer.", "cur": "A diferencia de la mayoría de coprinos, no se deshace en tinta. Un solo tocón puede tener miles, como si alguien los hubiera sembrado.", "note": "CIENTOS de sombreros pequeños en el tocón.", "conf": [{"t": "Más grande (2–5 cm), pardo claro, con gránulos brillantes como mica y en matas de decenas."}, {"t": "También sale sobre tocones, pero es pardo, sin surcos, con una zona de anillo y esporada marrón óxido. Mortal."}, {"t": "Matas amarillo azufre sobre tocones. Tóxico."}]}, "bolbitius-titubans": {"nom": "Bolbicio amarillo", "alt": ["bolbicio bamboleante"], "q": null, "f": {"barret": "1,5–5 cm, amarillo yema de huevo, viscoso, con el borde estriado. Se aclara desde el borde hacia beige gris, pero el centro queda amarillo.", "himeni": "Láminas casi libres, amarillo pálido y después marrón canela.", "peu": "Amarillo pálido, harinoso y muy frágil. Sin anillo.", "carn": "Muy delgada.", "espora": "Marrón óxido"}, "hab": "Estiércol, hierba abonada, céspedes ricos y paja, desde el valle hasta la alta montaña. En el Berguedà, en Berga, Bagà, Fígols, el Ensija, Castellar de n’Hug y Puig-reig. Dura un día.", "tox": "No es comestible: es pequeño, blando y dura pocas horas.", "cur": "Titubans quiere decir «que se tambalea»: el pie, tan frágil, apenas aguanta el sombrero.", "note": "AMARILLO yema de huevo y viscoso, en el estiércol.", "conf": [{"t": "Sombrero empolvado y no viscoso, con anillo y esporada blanca. Sale en macetas e invernaderos. Tóxica."}, {"t": "Pardo anaranjado y con anillo. Mortal."}, {"t": "Sombrero blanquecino en forma de dedal."}, {"t": "Sombrero pardo y láminas manchadas de marrón oscuro."}]}}, "cats": {"exc": {"label": "Comestible", "short": "Comestible"}, "com": {"label": "Comestible", "short": "Comestible"}, "pre": {"label": "Comestible con precaución", "short": "Precaución"}, "reb": {"label": "No comestible · a descartar", "short": "A descartar"}, "tox": {"label": "Tóxica", "short": "Tóxica"}, "mor": {"label": "Mortal", "short": "Mortal"}}, "zones": {"1": {"name": "Cadí y Moixeró", "alt": "900–2.600 m", "bosc": "Pino negro, pino silvestre, abetales y hayedos; prados alpinos en lo alto.", "note": "Alta montaña calcárea. En lo alto del Moixeró, suelos descalcificados con rododendro y arándano. Boletos de pino, marzuelos con el deshielo."}, "2": {"name": "Pedraforca", "alt": "1.000–2.500 m", "bosc": "Pino silvestre y pino negro, prados de montaña.", "note": "Calizas y margas. Perrechicos en los prados en primavera y setas de pino silvestre en otoño."}, "3": {"name": "Ensija y Rasos de Peguera", "alt": "700–2.300 m", "bosc": "Pino silvestre, pino laricio, hayedos y prados de alta montaña.", "note": "Calizas y margas con capas de lignito (Vallcebre, Fígols, Cercs). En la cima de los Rasos, prados y pino negro sobre suelo ácido."}, "4": {"name": "Catllaràs y Alto Llobregat", "alt": "700–2.000 m", "bosc": "Pino silvestre, hayedos del Catllaràs, robledales y prados.", "note": "Suelos calcáreos, con terrenos silíceos en Castellar de n’Hug. Hayedos y pinares húmedos: boletos, trompetas amarillas y níscalos."}, "5": {"name": "Sierras de Borredà y Vilada", "alt": "700–1.500 m", "bosc": "Pino silvestre, roble pubescente y hayedos en la umbría.", "note": "Areniscas, conglomerados y calizas. Media montaña húmeda, buena para rebozuelos y boletos."}, "6": {"name": "Berga y Queralt", "alt": "450–1.200 m", "bosc": "Pino laricio, pino silvestre, encina y roble.", "note": "Calizas de Queralt y conglomerados del Picancel y la Quar. Rebollones, negrillas y llanegas."}, "7": {"name": "Sierras de poniente", "alt": "500–1.300 m", "bosc": "Pino laricio, pino silvestre, roble y encina.", "note": "Conglomerados y areniscas de Capolat a Montmajor. Pinares calcáreos con rebollones y llanegas."}, "8": {"name": "Valle del Llobregat y Merlès", "alt": "400–900 m", "bosc": "Pino carrasco y pino laricio, encinares, robledales, cultivos y rieras.", "note": "Areniscas, lutitas y calizas. Entre Sagàs y Berga, manchas descarbonatadas con brezo blanco. En verano, oronjas."}}, "habitats": {"pi": "Pinares", "alzina": "Encinares", "roure": "Robledales", "faig": "Hayedos", "avet": "Abetales", "prat": "Prados", "jardi": "Jardines e invernaderos", "fusta": "Sobre madera", "cremat": "Zonas quemadas", "ribera": "Bosques de ribera", "bedoll": "Abedulares"}, "reagents": [{"id": "espora", "name": "Esporada", "formula": "sin reactivo", "what": "El color de las esporas es la primera prueba y la más útil. Separa grupos enteros: blanca, rosa, marrón óxido, pardo púrpura o negra.", "how": ["Corta el pie y pon el sombrero con las láminas o los poros hacia abajo.", "Hazlo sobre un papel mitad blanco y mitad negro.", "Tápalo con un vaso para que no se seque.", "Espera entre 4 y 12 horas y mira el color del polvo."], "read": "Esporada rosa: Entoloma, como la pérfida (Entoloma sinuatum). Marrón óxido: Cortinarius. Blanca: rebollón, negrilla, perrechico, amanitas.", "safety": "Lávate las manos después de tocar setas desconocidas."}, {"id": "koh", "name": "Hidróxido de potasio", "formula": "KOH al 3–10 %", "what": "Base fuerte. Una gota cambia el color de muchos pigmentos.", "how": ["Aplica una gota sobre la cutícula del sombrero o la carne cortada.", "Mira el cambio durante el primer minuto."], "read": "Agaricus xanthodermus (champiñón tóxico) se vuelve amarillo intenso. La bola de nieve también puede amarillear: mira sobre todo la base del pie. También ayuda con Cortinarius y setas con poros.", "safety": "Corrosivo. Usa guantes y gafas. Si te toca la piel o los ojos, lava con mucha agua. Dura unos 12 meses; después cristaliza."}, {"id": "nh4oh", "name": "Amoníaco", "formula": "NH₄OH al 5–10 %", "what": "Amoníaco doméstico o de laboratorio.", "how": ["Pon un par de gotas sobre la carne."], "read": "Algunas setas con poros dan un azul verdoso fugaz (por ejemplo Boletus spadiceus).", "safety": "Los vapores irritan. Úsalo al aire libre y no lo mezcles nunca con lejía."}, {"id": "feso4", "name": "Sulfato de hierro", "formula": "FeSO₄ al 10 % o un cristal", "what": "Sal de hierro. Es el reactivo más útil para las rúsulas.", "how": ["Frota un cristal o pon una gota sobre la carne del pie, bien limpia.", "Mira el color a los 2–3 minutos y vuelve a mirarlo al cabo de un rato."], "read": "Sin cambio, verde oliva o de rosa a naranja según la especie. La carbonera casi no cambia; la rúsula verde se vuelve rosa anaranjado débil; la rúsula emética, rosa claro.", "safety": "Nocivo si se ingiere: guárdalo lejos de los niños. La disolución dura pocos meses."}, {"id": "guaiac", "name": "Tintura de guayaco", "formula": "resina de guayaco saturada en etanol al 70 %", "what": "Detecta enzimas oxidantes de la carne.", "how": ["Pon una gota en la carne del pie.", "Lee el color entre 5 y 30 segundos."], "read": "En las rúsulas da azul o verde más o menos intenso: azul verdoso en la carbonera, verde en la rúsula verde, débil en la rúsula emética.", "safety": "Inflamable. Lejos del fuego. Dura un año."}], "keyq": [{"k": "lloc", "q": "¿Dónde crece?", "help": "Mira si sale del suelo, de un prado, de un jardín o de un tocón o rama.", "o": [["terra", "En el suelo, dentro del bosque"], ["prat", "En un prado o un margen"], ["jardi", "En un jardín, una maceta o un invernadero"], ["fusta", "Sobre madera o tocones"]]}, {"k": "sub", "q": "¿Qué hay debajo del sombrero?", "help": "Dale la vuelta y mira la cara de abajo.", "o": [["lam", "Láminas (hojas finas)"], ["por", "Poros, como una esponja"], ["plecs", "Pliegues gruesos que bajan por el pie"], ["agulles", "Pequeños aguijones"], ["trompeta", "Es una trompeta o embudo hueco"], ["coral", "Es un ramo de ramas, como un coral"], ["alveols", "Sombrero con huecos de panal"], ["cervell", "Sombrero arrugado como un cerebro"], ["bola", "Es una bola, sin sombrero ni pie"]]}, {"k": "col", "q": "¿De qué color es el sombrero?", "help": null, "o": [["blanc", "Blanco o crema"], ["groc", "Amarillo"], ["taronja", "Naranja"], ["vermell", "Rojo o granate"], ["bru", "Pardo"], ["gris", "Gris o negro"], ["verd", "Verdoso"], ["lila", "Lila o violeta"]]}, {"k": "hc", "q": "¿De qué color son las láminas o los poros?", "help": null, "o": [["blanc", "Blancos o crema"], ["groc", "Amarillos"], ["taronja", "Naranjas"], ["rosa", "Rosados"], ["vermell", "Rojos"], ["lila", "Lilas"], ["rovell", "Marrón óxido"], ["verd", "Verdosos"], ["gris", "Grises"], ["negre", "Negras o manchadas de negro"]]}, {"k": "lat", "q": "Si cortas una lámina, ¿sale látex (un líquido)?", "help": "Córtala y espera unos segundos.", "o": [["no", "No sale"], ["vi", "Sí, rojo vino"], ["taronja", "Sí, naranja zanahoria"], ["blanc", "Sí, blanco y no cambia"], ["groc", "Sí, blanco que se vuelve amarillo"]]}, {"k": "anell", "q": "¿Tiene anillo en el pie?", "help": null, "o": [["si", "Sí"], ["no", "No"]]}, {"k": "volva", "q": "¿Tiene volva, un saco en la base?", "help": "Arráncala entera: a menudo queda enterrada.", "o": [["si", "Sí"], ["no", "No"]]}, {"k": "olor", "q": "¿A qué huele?", "help": "Huele las láminas y la carne cortada.", "o": [["farina", "Harina fresca"], ["afruitada", "Afrutado (albaricoque, fruta)"], ["ametlla", "Almendra amarga"], ["anis", "Anís"], ["rave", "Rábano"], ["desagradable", "Desagradable o podrido"], ["cap", "Nada especial (olor normal de seta o de champiñón)"]]}, {"k": "tall", "q": "Si cortas la carne, ¿cambia de color?", "help": null, "o": [["no", "No cambia"], ["blau", "Azulea"], ["vermell", "Enrojece"]]}, {"k": "sol", "q": "¿Cómo es el terreno?", "help": "Si no lo sabes, déjalo en blanco. En Conocimientos, «Las piedras y el suelo» explica cómo saberlo.", "o": [["calcari", "Calcáreo: la piedra hace burbujas con vinagre, hay boj"], ["acid", "Ácido: brezo, castaño o helecho; la piedra no hace burbujas"]]}, {"k": "esp", "q": "¿De qué color es la esporada?", "help": "Deja el sombrero unas horas sobre papel blanco y negro.", "o": [["clara", "Blanca o crema"], ["rosa", "Rosa"], ["rovell", "Marrón óxido"], ["oliva", "Pardo oliva"], ["porpra", "Pardo púrpura, oscura o negra"]]}, {"k": "feso4", "q": "Sulfato de hierro en la carne del pie", "help": "Solo para rúsulas (láminas blancas y frágiles, sin látex).", "o": [["no", "No cambia, o muy poco"], ["rosa", "Rosa o naranja rosado"]]}, {"k": "guaiac", "q": "Tintura de guayaco en la carne del pie", "help": "Solo para rúsulas.", "o": [["blau", "Azul verdoso"], ["verd", "Verde"], ["feble", "Débil o amarillento"]]}, {"k": "tinta", "q": "¿Se deshace en tinta negra?", "help": "De vieja, las láminas se vuelven negras y gotean un líquido como tinta.", "o": [["si", "Sí, se deshace"], ["no", "No"]]}], "know": [{"id": "anatomia", "title": "Las partes de una seta", "sub": "Para empezar: cómo se llama cada cosa", "body": "${ANATOMY_SVG}\n   <p>La seta es solo el «fruto» de un hongo. El hongo de verdad es el <b>micelio</b>: una red de hilos blancos muy finos que vive bajo tierra o dentro de la madera, a veces durante muchos años.</p>\n   <p>No todas las setas tienen todas las partes. El <b>anillo</b> y la <b>volva</b>, por ejemplo, son restos de los velos que protegían la seta joven, y solo los tienen algunos grupos, como las amanitas.</p>\n   <h3>Qué hay debajo del sombrero</h3>\n   ${UNDER_SVG}\n   <p>Es lo primero que hay que mirar: separa grupos enteros. Las <b>láminas</b> son hojas finas; los <b>poros</b> son agujeros pequeños como una esponja (boletos y babosos); los <b>pliegues</b> son arrugas gruesas que bajan por el pie (rebozuelo); los <b>aguijones</b> cuelgan como pinchitos (lengua de vaca).</p>"}, {"id": "paraules", "title": "Palabras que salen en las fichas", "sub": "Carne, látex, esporada, volva…", "body": "<dl class=\"gloss\">\n    <dt>Carne</dt><dd>El interior de la seta cuando la cortas. Se mira el color, si cambia con el aire (azulea, enrojece), si es firme, fibrosa o quebradiza como la tiza (rúsulas) y el olor.</dd>\n    <dt>Látex</dt><dd>Un líquido que sale al cortar algunas setas, sobre todo los <i>Lactarius</i> (rebollón, níscalo). Su color y si cambia al cabo de unos segundos son clave para distinguirlos.</dd>\n    <dt>Esporada</dt><dd>El polvo de esporas que suelta el sombrero si lo pones unas horas sobre un papel. Su color separa grupos enteros.</dd>\n    <dt>Himenio</dt><dd>La parte donde se forman las esporas: las láminas, los poros, los pliegues o los aguijones.</dd>\n    <dt>Cutícula</dt><dd>La piel del sombrero. En algunas setas se pela fácilmente, como en las llanegas.</dd>\n    <dt>Láminas libres, adheridas o decurrentes</dt><dd>Libres si no tocan el pie, adheridas si se unen a él, y decurrentes si bajan por el pie.</dd>\n    <dt>Anillo</dt><dd>Una especie de falda en el pie: es lo que queda del velo que tapaba las láminas de la seta joven.</dd>\n    <dt>Volva</dt><dd>Un saco o unos anillos en la base del pie, restos del velo que envolvía toda la seta joven. A menudo queda enterrada: por eso hay que arrancar la seta entera. Muchas amanitas mortales la tienen.</dd>\n    <dt>Cortina</dt><dd>Hilos como de telaraña entre el margen del sombrero y el pie. Es típica de los cortinarios.</dd>\n    <dt>Mamelón</dt><dd>Un bulto en el centro del sombrero.</dd>\n    <dt>Escrobículos</dt><dd>Hoyitos de color más oscuro en el pie, como los del rebollón.</dd>\n    <dt>Viscoso</dt><dd>Pegajoso cuando está húmedo, como las llanegas y los babosos.</dd>\n    <dt>Micorriza</dt><dd>La unión entre el hongo y las raíces de un árbol. Por eso cada seta sale con unos árboles concretos.</dd>\n    <dt>Saprofito</dt><dd>Un hongo que se alimenta de materia muerta: madera, hojarasca o estiércol.</dd>\n    <dt>Corro</dt><dd>Setas que salen en círculo porque el micelio crece hacia fuera desde un punto. También se llama corro de brujas.</dd>\n   </dl>"}, {"id": "sol", "title": "Las piedras y el suelo", "sub": "Por qué cada seta sale donde sale", "body": "<p>La roca de debajo decide cómo es el suelo, y el suelo decide qué árboles y qué setas viven en él. Hay dos grandes tipos de suelo:</p>\n   <div class=\"soilcmp\">\n    <div class=\"sc-calc\"><h4>Suelo calcáreo (básico)</h4><p>Viene de la piedra caliza y de las margas. Tiene un pH de más de 7 y a menudo es delgado, pedregoso y de color claro. En el Berguedà es el más común.</p></div>\n    <div class=\"sc-acid\"><h4>Suelo ácido (silíceo)</h4><p>Viene de rocas como el granito, la pizarra o algunas areniscas, o de suelos de los que la lluvia se ha llevado la cal. Tiene un pH de menos de 6,5 y es pobre en calcio.</p></div>\n   </div>\n   <h3>Por qué importa a las setas</h3>\n   <p>Muchas setas viven unidas a las raíces de un árbol (micorriza), y cada árbol prefiere un suelo. Además, cada hongo tiene un intervalo de pH donde vive bien. En un estudio de 42 pinares de Cataluña, el pH fue el factor del suelo que más explicaba qué hongos había.</p>\n   <ul class=\"tools\">\n    <li><b>Calcícolas</b>: prefieren suelo calcáreo. Por ejemplo, el rebollón.</li>\n    <li><b>Acidófilas o calcífugas</b>: prefieren suelo ácido. Por ejemplo, el níscalo, que tiende a suelos arenosos y silíceos.</li>\n    <li><b>Indiferentes</b>: salen en los dos.</li>\n    <li><b>Descomponedoras</b>: viven de madera u hojarasca muerta; la roca de debajo les afecta poco.</li>\n   </ul>\n   <h3>Cómo saber qué suelo pisas</h3>\n   <ul class=\"tools\">\n    <li><b>La prueba del vinagre.</b> Pon unas gotas de vinagre sobre una piedra limpia: si hace burbujas, es caliza. La dolomía casi no hace. Lleva gafas y guantes, y si te cae en un ojo, lávalo con agua 15 minutos.</li>\n    <li><b>Plantas que indican suelo calcáreo:</b> boj, romero, brezo de invierno, pino laricio y pino carrasco.</li>\n    <li><b>Plantas que indican suelo ácido:</b> brecina, brezo blanco, rododendro, arándano, castaño, jara negra y jaguarzo morisco.</li>\n    <li><b>Ni una cosa ni la otra:</b> la encina y el pino silvestre salen en los dos suelos. En el Berguedà, el pino silvestre forma grandes pinares sobre calcáreo.</li>\n   </ul>\n   <h3>El suelo del Berguedà</h3>\n   <p>El Berguedà es, sobre todo, de piedra caliza. Las manchas de suelo ácido son pocas y pequeñas.</p>\n   <dl class=\"gloss\">\n    <dt>1 · Cadí y Moixeró</dt><dd>Calizas y margas del Cretácico y el Jurásico. En el Moixeró hay esquistos, y en lo alto el suelo se ha descalcificado: viven pino negro, rododendro y arándano.</dd>\n    <dt>2 · Pedraforca</dt><dd>Calizas y margas del Mesozoico, con fósiles. Suelos calcáreos.</dd>\n    <dt>3 · Ensija y Rasos de Peguera</dt><dd>Calizas y margas con capas de lignito en Vallcebre, Fígols y Cercs. En la cima de los Rasos hay prados y pino negro sobre suelo ácido.</dd>\n    <dt>4 · Catllaràs y Alto Llobregat</dt><dd>Sustrato calcáreo, con pino silvestre y haya con boj. En Castellar de n’Hug afloran terrenos silíceos.</dd>\n    <dt>5 · Sierras de Borredà y Vilada</dt><dd>Areniscas y conglomerados entre les Llosses y Borredà, y calizas. Suelos mayoritariamente calcáreos.</dd>\n    <dt>6 · Berga y Queralt</dt><dd>Calizas de Queralt y conglomerados del Picancel y la Quar. Suelos calcáreos.</dd>\n    <dt>7 · Sierras de poniente</dt><dd>Conglomerados y areniscas de Canalda a Capolat y Montmajor. Suelos calcáreos.</dd>\n    <dt>8 · Valle del Llobregat y Merlès</dt><dd>Areniscas, lutitas y calizas de relieve llano. Sobre arenisca, la lluvia se ha llevado la cal en algunos sitios: entre Sagàs y Berga hay brezo blanco y jaguarzo morisco.</dd>\n   </dl>\n   <p class=\"muted\" style=\"font-size:.85rem\">Fuentes: <a href=\"https://eforown.ctfc.cat/pdf/10_Sols_et_especes_en_Mediterrannee.pdf\" target=\"_blank\" rel=\"noopener\">CTFC, suelos y especies</a> · <a href=\"https://eforown.ctfc.cat/pdf/R54_Techniques_production_champignons_forestiers_cat_FINAL.pdf\" target=\"_blank\" rel=\"noopener\">CTFC, producción de setas</a> · <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC8538088/\" target=\"_blank\" rel=\"noopener\">pH y hongos en pinares de Cataluña</a> · <a href=\"https://www.miteco.gob.es/content/dam/miteco/es/biodiversidad/temas/inventarios-nacionales/iect_lactarius_deliciosus_tcm30-164130.pdf\" target=\"_blank\" rel=\"noopener\">MITECO, Lactarius deliciosus</a> · <a href=\"https://www.enciclopedia.cat/historia-natural-dels-paisos-catalans/les-ericacies\" target=\"_blank\" rel=\"noopener\">Las ericáceas</a> · <a href=\"https://www.enciclopedia.cat/historia-natural-dels-paisos-catalans/les-buxacies\" target=\"_blank\" rel=\"noopener\">Las buxáceas</a> · <a href=\"https://www.enciclopedia.cat/catalunya-romanica/el-marc-geografic-del-romanic-del-bergueda\" target=\"_blank\" rel=\"noopener\">El marco geográfico del Berguedà</a> · <a href=\"https://www.enciclopedia.cat/historia-natural-dels-paisos-catalans/les-serres-de-cadi-moixero-i-mogrony\" target=\"_blank\" rel=\"noopener\">Cadí-Moixeró</a> · <a href=\"https://www.enciclopedia.cat/historia-natural-dels-paisos-catalans/la-serra-del-catllaras\" target=\"_blank\" rel=\"noopener\">El Catllaràs</a> · <a href=\"https://diposit.ub.edu/dspace/handle/2445/193342\" target=\"_blank\" rel=\"noopener\">Mapas de vegetación (UB)</a> · <a href=\"https://geology.com/minerals/acid-test.shtml\" target=\"_blank\" rel=\"noopener\">La prueba del ácido</a></p>"}, {"id": "estris", "title": "Qué llevar al bosque", "sub": "Los utensilios del setero", "body": "<ul class=\"tools\">\n    <li><b>Cesta o caja rígida.</b> Nunca bolsas de plástico: las setas se aplastan, se estropean y no sueltan las esporas.</li>\n    <li><b>Navaja setera</b>, con cepillo para limpiarlas en el bosque.</li>\n    <li><b>Bolsas de papel o papel de aluminio</b> para llevar aparte las setas que no conoces.</li>\n    <li><b>Lupa de 10 aumentos</b> para ver las láminas, los poros y las escamas.</li>\n    <li><b>Móvil cargado y batería externa</b>, con esta app y un mapa que funcione sin cobertura.</li>\n    <li><b>Libreta y lápiz</b> para apuntar el lugar, los árboles de alrededor y el olor.</li>\n    <li><b>Guantes finos</b> para tocar setas que no conoces.</li>\n    <li><b>Papel blanco y negro y un vaso</b>, para hacer la esporada en casa.</li>\n    <li><b>Ropa y calzado de montaña, agua y un silbato.</b> Avisa a alguien de adónde vas.</li>\n    <li><b>Kit de reactivos</b> (opcional). Mira el tema «El kit de reactivos».</li>\n   </ul>"}, {"id": "regles", "title": "Las reglas de oro", "sub": "Lo que no hay que olvidar nunca", "body": "<ol class=\"rules\">\n    <li><b>Si no estás seguro del todo, no te la comas.</b> Ni un trozo para probar.</li>\n    <li><b>Los dichos populares no sirven.</b> Que se ennegrezca una cuchara de plata, que se la coman los caracoles o que huela bien no quiere decir nada.</li>\n    <li><b>Cógela entera, con la base</b>, y lleva aparte las que no conoces.</li>\n    <li><b>Solo ejemplares jóvenes y sanos.</b> Nada de viejos, enmohecidos, helados o llenos de gusanos.</li>\n    <li><b>Cocínalas siempre.</b> Muchas setas comestibles son tóxicas o indigestas en crudo.</li>\n    <li><b>La primera vez, poca cantidad</b>, y guarda un ejemplar en la nevera por si te encuentras mal.</li>\n    <li><b>Si te encuentras mal, ve a urgencias</b> aunque hayan pasado horas. Los teléfonos están en la pestaña Berguedà.</li>\n   </ol>"}, {"id": "foto", "title": "Cómo hacer la foto", "sub": "Para que sirva para identificarla", "body": null}, {"id": "reactius", "title": "El kit de reactivos", "sub": "Los frasquitos de los micólogos", "body": null}], "anatomy_labels": {"Barret": "Sombrero", "Làmines": "Láminas", "Anell": "Anillo", "Peu": "Pie", "Volva": "Volva", "Micel·li": "Micelio"}, "under_labels": {"Làmines": "Láminas", "Porus": "Poros", "Plecs": "Pliegues", "Agulles": "Aguijones"}, "anatomy_aria": "Partes de una seta: sombrero, láminas, anillo, pie, volva y micelio", "soils": {"calcari": {"label": "Suelo calcáreo", "short": "Calcáreo"}, "acid": {"label": "Suelo ácido (silíceo)", "short": "Ácido"}, "indiferent": {"label": "Calcáreo o ácido", "short": "Indiferente"}, "fusta": {"label": "Sobre madera", "short": "Madera"}, "nitrogenat": {"label": "Suelos ricos en nitrógeno", "short": "Nitrogenado"}}, "soil": {"rovello": "Vive con el pino laricio y el pino carrasco sobre suelos calcáreos: es la seta de suelo calcáreo por excelencia.", "pinetell": "Las fuentes no coinciden: muchas lo sitúan en suelos arenosos y ácidos, pero también sale en pinares calcáreos.", "cep": "Prefiere terrenos silíceos, con suelos ácidos o poco ácidos (arenisca, cuarcita, granito). Tolera suelos poco ácidos.", "cep-de-pi": "Bajo pino silvestre en suelos ácidos, a menudo arenosos, con brezo y musgo.", "rossinyol": "Terrenos silíceos bastante ácidos (pH 4,5–5,5), con robles, hayas, pinos y jaras.", "fredolic": "Prefiere suelos calcáreos o neutros bajo pinos, pero sale en pinares de todo tipo.", "llenega-negra": "Pinares de pino laricio y pino carrasco sobre terreno calcáreo. A menudo sale con el rebollón.", "moixerno": "Prados, márgenes y zarzales sobre suelos calcáreos ricos en humus.", "camagroc": "Lugares húmedos y musgosos de pinares, normalmente sobre suelos calcáreos.", "trompeta": "Las fuentes no coinciden: unas hablan de suelos calcáreos pesados y otras de suelos arenosos pobres. Vive bajo hayas y robles, en lugares húmedos.", "ou-de-reig": "Silicícola: encinares, robledales y castañares claros con brezo y jaras, en suelos de pH 4–6.", "cama-sec": "Depende más de la hierba y de los prados pastoreados que de la roca.", "pimpinella-morada": "Descompone hojarasca y humus en lugares ricos en nutrientes: bordes de bosque, prados y montones de hojas.", "apagallums": "Sale en suelos silíceos y calcáreos, con cierta preferencia por los ácidos. Prados y claros poco abonados.", "murgola": "Suelos calcáreos, con olmos, fresnos y bosques de ribera. También en lugares removidos o quemados.", "llengua-de-bou": "Prefiere suelos ligeramente ácidos, pero también sale en terrenos calcáreos.", "carbonera": "Bajo frondosas y coníferas, en suelos tanto ácidos como calcáreos.", "llora-verda": "Robledales, hayedos y castañares en suelos poco calcáreos. Es una preferencia, no una regla.", "marcot": "Bajo abetos, pinos y hayas de montaña, en terrenos ácidos y pobres.", "farinera-borda": "Bajo robles y otras frondosas, en suelos de ácidos a neutros y también calcáreos. Puede salir en cualquier sitio.", "reig-bord": "Con abedules y pinos en suelos ácidos, arenosos o turbosos.", "pixaca": "Con frondosas y coníferas. Las fuentes no dicen claramente su tipo de suelo.", "fals-carlet": "Robledales y hayedos, a menudo sobre suelos arcillosos o calcáreos.", "bolet-doliu": "En grupos sobre tocones, raíces enterradas y bases de encinas, robles y olivos.", "bolet-de-cabra": "Vive solo con el abedul, un árbol de suelos ácidos.", "pinetell-bord": "Bajo robles en suelos pobres, arenosos o limosos.", "fredolic-metzinos": "Sobre suelo calcáreo, con hayas y abetos de montaña.", "cortinari-metzinos": "Las fuentes no coinciden: unas lo sitúan en suelos ácidos y otras en suelos arcillosos calcáreos. Vive con robles, castaños y avellanos.", "lepiota-petita": "Lugares herbosos removidos: campos, parques, jardines y bordes de caminos.", "escaldabecs": "Bajo coníferas y abedules en suelos húmedos y ácidos, a menudo con musgo.", "matagent": "Bajo robles y hayas viejos, casi solo en zonas calcáreas.", "falsa-murgola": "Pinares de primavera en suelos arenosos y pobres.", "galerina": "Sobre ramas, troncos y tocones muy podridos.", "clitocibe-blanc": "Prados, márgenes de camino y parques, a menudo arenosos, sin preferencia clara de suelo.", "bolet-de-pi": "En grupos sobre madera muerta de coníferas y frondosas.", "sureny-fosc": "Terrenos silíceos y pobres (pH 4–6), con robles, castaños, encinares y jaras.", "llenega-blanca": "En otoño, en suelos básicos, con coníferas.", "carlet": "Muy común en los encinares y carrascales calcáreos, bajo la hojarasca.", "fredolic-gros": "Pinares de pino silvestre sobre suelos arenosos, secos, pobres y ácidos.", "pollancro": "Sobre tocones, raíces y troncos viejos de chopos, álamos blancos, olmos y sauces.", "girgola-panical": "Vive sobre las raíces del cardo corredor en eriales y pastos, sobre todo en terrenos calcáreos.", "orellana": "Sobre troncos y tocones de chopos, álamos blancos, fresnos y otras frondosas.", "camperol": "Prados pastoreados y abonados con estiércol, cerca de corrales y caminos de ganado.", "bola-de-neu": "Pastos, márgenes de camino, parques y jardines en suelos ricos en humus.", "moixerno-blanc": "Claros, bordes de bosque y pastos. No hemos encontrado ninguna fuente fiable sobre el tipo de suelo.", "molleric": "Muy común con todo tipo de pinos, en suelos silíceos y calcáreos.", "peu-de-rata-groc": "Hayedos y abetales de montaña. Hay pocos datos sobre el suelo.", "cama-de-perdiu": "Solo con pinos, porque depende de los babosos (Suillus). Sale en arena seca y también en terreno calcáreo.", "bolet-de-tinta": "Prados, jardines, cunetas, márgenes de camino y tierras removidas.", "cogomassa": "En primavera, con encinas, robles y pino piñonero, en suelos de ácidos a básicos.", "bola-de-neu-pudent": "Parques, jardines y bosques jóvenes, en suelos ricos y a menudo calcáreos.", "bolet-de-femer": "En grupos sobre madera, raíces y tocones enterrados, a menudo en jardines y lugares removidos.", "peu-de-rata-bord": "Bajo hayas y robles en suelos calcáreos pobres.", "groguet": "Con pinos en suelos arenosos, secos y pobres.", "inocibe": "Bajo hayas y carpes, casi siempre en suelos básicos o neutros.", "bolet-amarg": "Vive en suelos ácidos y pobres, arenosos o de arenisca, con robles, hayas, castaños o pinos. En Cataluña solo sale en terrenos silíceos.", "fals-rossinyol": "Descompone la hojarasca y la madera de coníferas, sobre todo en bosques y matorrales de suelo ácido.", "camagroc-tardor": "Prefiere suelos pobres y silíceos, entre musgo y madera podrida, pero también puede salir en terreno calcáreo.", "apagallums-rogenc": "Saprófita de suelos ricos: hojarasca gruesa, márgenes, parques, huertos y jardines.", "reig-vinos": "Vive con muchos árboles, planifolios y coníferas, sin una preferencia de suelo marcada.", "kuehneromyces": "Sobre tocones y troncos muertos de planifolios, sobre todo abedul y haya.", "bolet-de-soca": "Parásita de árboles vivos y descomponedora de tocones y raíces de muchos árboles.", "fredolic-amargant": "Las fuentes solo dicen que vive con coníferas y a veces con planifolios; no hay datos claros del suelo.", "suillus-luteus": "Solo con pinos. Prefiere suelos arenosos y secos, pero sale en terrenos diversos.", "pebreta": "Con pinos, abedules y robles en suelos pobres, arenosos o arcillosos.", "groguet-pudent": "Con robles y hayas, en suelos arcillosos o arenosos ricos; las fuentes no indican preferencia por la cal.", "gomphidius-glutinosus": "Con coníferas (pícea, pino, abeto) en lugares húmedos; las fuentes no precisan el tipo de suelo.", "paxil": "Bajo abedules y otros árboles, sobre todo donde el suelo es ácido; en Cataluña, en los bosques de la Cataluña húmeda.", "amanita-proxima": "Comparte la ecología de la Amanita ovoidea, que prefiere los suelos calcáreos mediterráneos; no hay datos propios suficientemente claros.", "farinera": "Prefiere los suelos calcáreos de los encinares y de los pinares cálidos mediterráneos.", "amanita-gemmata": "Con pinos, sobre todo en suelos arenosos y pobres.", "lepiota-cristata": "Saprófita de tierra rica o removida: bordes de caminos, jardines, parques y restos de jardinería.", "escleroderma": "Suelos arenosos y bien drenados, brezales y bosques de suelo ácido.", "inocybe-geophylla": "Bosques de planifolios y coníferas, a menudo en tierra desnuda de márgenes y caminos, sin preferencia clara de suelo.", "hebeloma": "Con planifolios y coníferas en bosques abiertos y brezales; la especie hermana H. sinapizans es la que prefiere suelos calcáreos.", "mycena-pura": "Saprófita de la hojarasca de bosques de coníferas y planifolios, sin preferencia de suelo.", "parasola-plicatilis": "Sale en céspedes, prados y bordes de caminos, sobre todo en tierra abonada.", "coprinopsis-lagopus": "Vive en tierra rica en humus y sobre astillas de madera, en bosques, parques y bordes de caminos.", "coprinellus-micaceus": "Sobre tocones, madera muerta y raíces enterradas de planifolios.", "panaeolina-foenisecii": "Sale en céspedes y prados segados; las fuentes no indican ninguna preferencia de suelo.", "panaeolus-cinctulus": "Vive sobre estiércol, compost y céspedes muy abonados.", "panaeolus-papilionaceus": "Vive sobre estiércol y en prados y pastos abonados, en suelos ricos en nitrógeno.", "psathyrella-candolleana": "Se alimenta de madera enterrada y raíces que se pudren; por eso sale en céspedes y caminos cerca de tocones.", "conocybe-apala": "Sale en el césped y en prados de hierba corta con tierra rica y abonada.", "conocybe-rugosa": "Vive en tierra muy rica en materia orgánica: compost, astillas de madera y parterres de jardín.", "cogomina-blanca": "Céspedes, prados y huertos ricos en materia orgánica, tanto en terreno calcáreo como ácido.", "terrerol": "Tierra dura y pisada, calcárea o ácida: lo que cuenta es que esté compactada.", "volvaria": "Tierras abonadas, compost y paja, muy ricas en nitrógeno.", "cogomina-groga": "Tierra de macetas con turba o compost, en lugares cálidos.", "gita-de-bruixa": "Corteza, astillas y humus de los parterres, en lugares cálidos.", "cortinarius-mucosus": "Pinares de montaña en suelos ácidos y arenosos.", "cortinarius-caerulescens": "Hayedos y robledales sobre terreno calcáreo.", "amanita-spissa": "Sale tanto en terreno calcáreo como ácido.", "amanita-citrina": "Prefiere suelos ácidos y silíceos; es rara sobre caliza.", "hebeloma-sinapizans": "Sale en bosques de terreno calcáreo y ácido.", "pet-de-llop": "Sale en todo tipo de terrenos, sobre hojarasca.", "tofona-negra": "Tierra calcárea suelta, de pH entre 7,5 y 8,5.", "pota-de-cavall-verrucosa": "Prefiere suelos arenosos o bien drenados.", "pota-de-cavall-estrellada": "Tierra pelada y pobre, arenosa o arcillosa.", "clathrus-archeri": "Huye de la caliza: humus de bosques húmedos.", "laccaria-amethystina": "Hayedos y abetales de suelo ácido.", "paloma-borda": "Compost, tierra abonada y lugares con ortigas, cerca de las casas.", "cogomella-verdejant": "Céspedes regados y abonados, en terreno calcáreo o ácido.", "parasola-leiocephala": "Hierba corta y astillas; no depende del tipo de roca.", "coprinopsis-nivea": "Crece sobre estiércol de vaca y de caballo.", "coprinellus-disseminatus": "Tocones y madera enterrada de planifolios.", "bolbitius-titubans": "Estiércol, paja y hierba muy abonada."}, "demo": [{"seen": ["Sombrero grande, pardo avellana y liso", "Poros claros bajo el sombrero, sin láminas", "Pie ventrudo y claro"], "cands": [["cep", "alta", "Sombrero pardo, poros claros y pie grueso."], ["cep-de-pi", "baixa", "El sombrero no es granate."], ["matagent", "molt baixa", "Los poros no son rojos."]], "missing": ["Si la carne azulea al cortarla", "La red del pie", "El color de la esporada"]}, {"seen": ["Color amarillo yema", "Forma de embudo con el margen ondulado", "Pliegues gruesos que bajan p
