<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Aprèn a reconèixer els bolets del Berguedà. Funciona sense cobertura.">
<meta name="theme-color" content="#2e5a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Boletaire">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Boletaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;700&family=Kalam:wght@300;400;700&family=Special+Elite&display=swap">
<style>
/* Layout: app de mòbil amb barra inferior; la fitxa s'obre a pantalla completa. A pantalla gran, menú lateral i columnes (al final).
   Xassís estàndard (accessible) + dues pells de fitxa: llibreta de camp i estàndard. */
:root{
  --bg:#f2f3ee; --surface:#ffffff; --fg:#1b2119; --muted:#58614f; --line:#d5d9cc; --accent:#2e5a3a; --accent-fg:#ffffff;
  --chip:#e5e8de; --focus:#1f6feb;
  --ok:#2c7a37; --warn:#9a6511; --acrid:#b4561a; --tox:#bb2630; --mortal:#b3121c; --toxcat:#7b3fa6;
  --ok-bg:#e3f1e3; --warn-bg:#fbf0d9; --acrid-bg:#fbe6d6; --tox-bg:#fadfe0; --mortal-bg:#fbdcdc; --toxcat-bg:#f0e5f8;
  --sk-ink:#2a2f27;
  --z1:#5b86c5; --z2:#9a7fc4; --z3:#3fa59a; --z4:#6aa84f; --z5:#c4b23e; --z6:#e0a040; --z7:#c96f8f; --z8:#c0583c; --map-line:#ffffff; --map-muni:rgba(255,255,255,.55);
  --f-ui:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --f-note:"Kalam", "Segoe Print", "Comic Sans MS", cursive;
  --f-type:"Special Elite", "Courier New", monospace;
  /* Paper de la llibreta: aspecte fix en tots dos temes, escollit expressament */
  --paper:#efe5c9; --paper-2:#e6d9b6; --ink:#24263a; --pencil:#5b5043; --red-ink:#a3302a; --rule:rgba(70,105,150,.22); --margin:rgba(170,50,45,.45); --sticky:#f6e27c; --tape:rgba(214,196,150,.75);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121611; --surface:#1b2019; --fg:#e4e9dc; --muted:#a3ad98; --line:#2f362c; --accent:#8cc49a; --accent-fg:#0f1a12;
  --chip:#252b22; --focus:#79a8ff;
  --ok:#7fcf88; --warn:#e3b45a; --acrid:#ef9a5c; --tox:#f2777e; --mortal:#ff7a7a; --toxcat:#cfa6f2;
  --ok-bg:#1d2e1f; --warn-bg:#33291a; --acrid-bg:#36241a; --tox-bg:#3a1c1f; --mortal-bg:#3d1719; --toxcat-bg:#2b1f38;
  --sk-ink:#dfe4d6; --z1:#4f78b3; --z2:#8a70b5; --z3:#33948a; --z4:#5f9746; --z5:#b0a035; --z6:#c98f38; --z7:#b5637f; --z8:#ad4f36; --map-line:#121611; --map-muni:rgba(18,22,17,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121611; --surface:#1b2019; --fg:#e4e9dc; --muted:#a3ad98; --line:#2f362c; --accent:#8cc49a; --accent-fg:#0f1a12;
  --chip:#252b22; --focus:#79a8ff;
  --ok:#7fcf88; --warn:#e3b45a; --acrid:#ef9a5c; --tox:#f2777e; --mortal:#ff7a7a; --toxcat:#cfa6f2;
  --ok-bg:#1d2e1f; --warn-bg:#33291a; --acrid-bg:#36241a; --tox-bg:#3a1c1f; --mortal-bg:#3d1719; --toxcat-bg:#2b1f38;
  --sk-ink:#dfe4d6; --z1:#4f78b3; --z2:#8a70b5; --z3:#33948a; --z4:#5f9746; --z5:#b0a035; --z6:#c98f38; --z7:#b5637f; --z8:#ad4f36; --map-line:#121611; --map-muni:rgba(18,22,17,.5); color-scheme:dark }
html[data-size="gran"]{ font-size:118% }
html,body{ height:100% }
body{ background:var(--bg); color:var(--fg); font-family:var(--f-ui); font-size:1rem; line-height:1.5; -webkit-font-smoothing:antialiased }
*{ box-sizing:border-box }
button,input,select,textarea{ font:inherit; color:inherit }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; border-radius:6px }
a{ color:var(--accent) }
h1,h2,h3{ text-wrap:balance; margin:0 }
.wrap{ max-width:44rem; margin:0 auto; padding-inline:16px; padding-block:0 6.5rem }

/* Capçalera */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); border-bottom:1px solid var(--line) }
.top .in{ max-width:44rem; margin:0 auto; padding:.7rem 16px; display:flex; align-items:baseline; gap:.6rem; justify-content:space-between }
.brand{ font-family:var(--f-hand); font-size:1.9rem; font-weight:700; line-height:1; color:var(--accent); display:inline-flex; align-items:center; gap:.45rem }
.brand .mono{ width:2rem; height:2rem; flex:0 0 auto }

/* Barra inferior */
.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px) }
.tabs .in{ max-width:44rem; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr) }
.tab{ background:none; border:0; padding:.55rem .25rem .6rem; display:flex; flex-direction:column; align-items:center; gap:.15rem; font-size:.78rem; color:var(--muted); cursor:pointer; min-height:3.4rem }
.tab svg{ width:1.45rem; height:1.45rem; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round }
.tab[aria-current="page"]{ color:var(--accent); font-weight:700 }

.view{ padding-top:1rem; display:grid; gap:1rem }
.lead{ color:var(--muted); margin:0 }
.safety{ display:flex; gap:.7rem; align-items:flex-start; background:var(--tox-bg); color:var(--fg); border:1px solid color-mix(in srgb,var(--tox) 35%,transparent); border-radius:12px; padding:.75rem .9rem; font-size:.93rem }
.safety b{ color:var(--tox) }
.safety .ic{ flex:0 0 auto; width:1.6rem; height:1.6rem; border-radius:50%; background:var(--tox); color:var(--surface); display:grid; place-items:center; font-weight:700 }

/* Filtres */
.search{ display:flex; align-items:center; gap:.5rem; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:.15rem .8rem }
.search input{ border:0; background:none; padding:.65rem 0; width:100%; min-width:0; outline:none }
.search svg{ width:1.2rem; height:1.2rem; stroke:var(--muted); fill:none; stroke-width:2 }
.chips{ display:flex; gap:.45rem; overflow-x:auto; padding-bottom:.2rem; scrollbar-width:none }
.chip{ flex:0 0 auto; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:.42rem .8rem; font-size:.9rem; cursor:pointer; white-space:nowrap }
.chip[aria-pressed="true"]{ background:var(--accent); color:var(--accent-fg); border-color:var(--accent) }
.row{ display:flex; gap:.6rem; flex-wrap:wrap; align-items:center }
.row select{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:.45rem .6rem; min-width:0; flex:1 1 9rem }
.toggle{ display:flex; align-items:center; gap:.45rem; font-size:.92rem; cursor:pointer; flex:1 1 9rem }
.toggle input{ width:1.15rem; height:1.15rem; accent-color:var(--accent) }
.count{ font-size:.85rem; color:var(--muted); margin:0 }

/* Llista d'espècies */
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr)); gap:.8rem }
.card{ text-align:left; cursor:pointer; border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:.6rem .6rem .75rem; display:grid; gap:.35rem; min-width:0 }
.card .sk{ width:100%; height:auto; aspect-ratio:200/210; max-width:100% }
.card .nm{ font-weight:700; font-size:1.02rem; line-height:1.2 }
.card .sc{ font-style:italic; font-size:.82rem; color:var(--muted); line-height:1.25 }
.pill{ justify-self:start; display:inline-flex; align-items:center; gap:.3rem; border-radius:999px; padding:.12rem .55rem; font-size:.78rem; font-weight:700 }
.pill i{ font-style:normal }
.c-exc,.c-com{ background:var(--ok-bg); color:var(--ok) } .c-pre{ background:var(--warn-bg); color:var(--warn) }
.c-reb{ background:var(--acrid-bg); color:var(--acrid) } .c-tox{ background:var(--toxcat-bg); color:var(--toxcat) } .c-mor{ background:var(--mortal-bg); color:var(--mortal) }
.empty{ text-align:center; padding:2rem 1rem; color:var(--muted) }

/* Targetes en mode llibreta: etiquetes d'herbari */
body[data-skin="llibreta"] .card{ background:var(--paper); color:var(--ink); border:0; border-radius:3px; box-shadow:0 1px 0 rgba(0,0,0,.08), 0 6px 14px -8px rgba(40,30,10,.45); background-image:radial-gradient(circle at 85% 12%, rgba(150,110,60,.10) 0 18%, transparent 19%) }
body[data-skin="llibreta"] .card:nth-child(3n+1){ transform:rotate(-.6deg) } body[data-skin="llibreta"] .card:nth-child(3n+2){ transform:rotate(.5deg) }
body[data-skin="llibreta"] .card .nm{ font-family:var(--f-hand); font-size:1.5rem; font-weight:700; color:var(--ink) }
body[data-skin="llibreta"] .card .sc{ font-family:var(--f-type); font-style:normal; color:var(--pencil); font-size:.76rem }
body[data-skin="llibreta"] .card .pill{ background:transparent; border:2px solid currentColor; border-radius:3px; font-family:var(--f-type); text-transform:uppercase; letter-spacing:.06em; transform:rotate(-2deg) }
body[data-skin="llibreta"] .card .pill.c-exc,body[data-skin="llibreta"] .card .pill.c-com{ color:#2f6a33 }
body[data-skin="llibreta"] .card .pill.c-pre{ color:#8a5a0c } body[data-skin="llibreta"] .card .pill.c-reb{ color:#a0501a }
body[data-skin="llibreta"] .card .pill.c-tox{ color:#6a2f8f } body[data-skin="llibreta"] .card .pill.c-mor{ color:#a3121c }

/* Fitxa (pantalla completa) */
.sheet{ position:fixed; inset:0; z-index:8; overflow-y:auto; background:var(--bg); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); -webkit-overflow-scrolling:touch }
.sheet .bar{ position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:.5rem; padding:.55rem 12px; background:var(--bg); border-bottom:1px solid var(--line) }
.back{ display:inline-flex; align-items:center; gap:.3rem; background:none; border:0; padding:.45rem .5rem; cursor:pointer; color:var(--accent); font-weight:700 }
.back svg{ width:1.2rem; height:1.2rem; stroke:currentColor; fill:none; stroke-width:2.2 }
.skin-sw{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; font-size:.8rem }
.skin-sw button{ background:var(--surface); border:0; padding:.35rem .7rem; cursor:pointer }
.skin-sw button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-fg) }
.sheet .body{ max-width:44rem; margin:0 auto; padding:1rem 16px 3rem }

/* ---------- Fitxa estàndard ---------- */
.std{ display:grid; gap:1.1rem; font-size:1.0625rem; line-height:1.6 }
.std .banner{ display:flex; align-items:center; gap:.6rem; border-radius:12px; padding:.7rem .9rem; font-weight:700; font-size:1.05rem }
.std .banner .ic{ width:2rem; height:2rem; border-radius:50%; display:grid; place-items:center; background:currentColor }
.std .banner .ic span{ color:var(--surface); font-size:1.05rem }
.std .hd{ display:grid; grid-template-columns:minmax(0,1fr) 8.5rem; gap:1rem; align-items:center }
.std .hd h1{ font-size:1.9rem; line-height:1.15 }
.std .hd .sci{ font-style:italic; color:var(--muted); margin:.1rem 0 0 }
.std .hd .oth{ font-size:.92rem; color:var(--muted); margin:.3rem 0 0 }
.std .hd .sk{ width:100%; height:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px }
.std section{ display:grid; gap:.5rem }
.std h2{ font-size:1.05rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted) }
.std dl{ margin:0; display:grid; gap:.55rem }
.std dt{ font-weight:700 }
.std dd{ margin:0 }
.std .box{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:.8rem .95rem }
.std .alert{ border-left:6px solid var(--tox); background:var(--tox-bg) }
.std .alert.care{ border-left-color:var(--warn); background:var(--warn-bg) }
.std .conf{ display:grid; gap:.55rem }
.std .conf a,.std .conf div{ display:block; text-decoration:none; color:var(--fg); background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:.65rem .85rem }
.std .conf b{ display:block }
.std .tags{ display:flex; flex-wrap:wrap; gap:.4rem }
.std .tags span{ background:var(--chip); border-radius:999px; padding:.15rem .6rem; font-size:.88rem }
.std table{ width:100%; border-collapse:collapse; font-size:.95rem }
.std th,.std td{ text-align:left; padding:.45rem .4rem; border-bottom:1px solid var(--line); vertical-align:top }
.std textarea{ width:100%; min-height:6rem; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:.6rem .7rem; resize:vertical }
.links{ display:flex; flex-wrap:wrap; gap:.5rem }
.btn{ display:inline-flex; align-items:center; gap:.4rem; border:1px solid var(--accent); color:var(--accent); background:transparent; border-radius:999px; padding:.45rem .9rem; font-weight:700; text-decoration:none; font-size:.92rem; cursor:pointer }

/* ---------- Fitxa llibreta de camp ---------- */
.nb{ position:relative; background-color:var(--paper); color:var(--ink); font-family:var(--f-note); font-size:1.08rem; line-height:1.9rem;
  background-image:
   radial-gradient(ellipse 120px 110px at 92% 6%, transparent 62%, rgba(120,80,30,.13) 64%, rgba(120,80,30,.06) 70%, transparent 72%),
   radial-gradient(ellipse at 10% 95%, rgba(140,100,40,.10), transparent 40%),
   linear-gradient(to bottom, transparent calc(1.9rem - 1px), var(--rule) 1.9rem);
  background-size:100% 100%, 100% 100%, 100% 1.9rem;
  border-radius:4px 10px 10px 4px; box-shadow:0 1px 0 rgba(0,0,0,.06), 0 18px 40px -22px rgba(40,25,5,.55), inset 14px 0 18px -14px rgba(70,45,10,.35);
  padding:1.9rem 1rem 2rem 2.6rem; overflow:hidden }
.nb::before{ content:""; position:absolute; top:0; bottom:0; left:1.9rem; width:2px; background:var(--margin) }
.nb h1{ font-family:var(--f-hand); font-size:2.7rem; line-height:2.2rem; font-weight:700; color:var(--ink); padding-right:5.5rem; margin-top:.2rem; text-decoration:underline wavy var(--red-ink) 2px; text-underline-offset:.45rem }
.nb .label{ display:inline-block; margin:.9rem 0 .2rem; font-family:var(--f-type); font-size:.86rem; line-height:1.3; background:#f8f2e2; color:#2b2b2b; padding:.25rem .55rem; transform:rotate(-1deg); box-shadow:0 1px 2px rgba(0,0,0,.18); position:relative }
.nb .label::after{ content:""; position:absolute; width:2.2rem; height:.8rem; background:var(--tape); top:-.4rem; left:40%; transform:rotate(4deg) }
.nb .oth{ font-family:var(--f-hand); font-size:1.35rem; color:var(--pencil); margin:0 }
.stamp{ position:absolute; top:1.5rem; right:.7rem; z-index:1; font-family:var(--f-type); text-transform:uppercase; letter-spacing:.03em; font-size:.8rem; line-height:1.15; text-align:center; padding:.35rem .45rem; border:3px double currentColor; border-radius:6px; transform:rotate(9deg); opacity:.85; max-width:7.4rem; mix-blend-mode:multiply;
  -webkit-mask-image:radial-gradient(circle at 30% 40%, #000 55%, rgba(0,0,0,.65) 56%, #000 70%); mask-image:radial-gradient(circle at 30% 40%, #000 55%, rgba(0,0,0,.65) 56%, #000 70%) }
.stamp.s-exc,.stamp.s-com{ color:#2f6a33 } .stamp.s-pre{ color:#8a5a0c } .stamp.s-reb{ color:#a0501a } .stamp.s-tox{ color:#6a2f8f } .stamp.s-mor{ color:#a3121c; font-size:1.05rem; border-width:4px }
.nb .plate{ position:relative; margin:1.3rem auto .6rem; width:min(15rem,82%); background:#faf5e8; padding:.6rem .6rem 1.9rem; box-shadow:0 2px 6px rgba(0,0,0,.18); transform:rotate(-2deg) }
.nb .plate::before,.nb .plate::after{ content:""; position:absolute; width:4rem; height:1.2rem; background:var(--tape); top:-.55rem }
.nb .plate::before{ left:-.8rem; transform:rotate(-28deg) } .nb .plate::after{ right:-.8rem; transform:rotate(26deg) }
.nb .plate .sk{ width:100%; height:auto; display:block }
.nb .plate figcaption{ position:absolute; bottom:.25rem; left:0; right:0; text-align:center; font-family:var(--f-hand); font-size:1.15rem; color:var(--pencil); line-height:1.5rem }
.nb .margin-note{ font-family:var(--f-hand); font-size:1.45rem; line-height:1.6rem; color:var(--red-ink); transform:rotate(-2.5deg); margin:.5rem 0 1rem .2rem; display:flex; gap:.4rem; align-items:flex-start }
.nb .margin-note svg{ flex:0 0 auto; width:2rem; height:1.6rem; stroke:var(--red-ink); fill:none; stroke-width:2; stroke-linecap:round }
.nb h2{ font-family:var(--f-hand); font-size:1.75rem; line-height:1.9rem; color:var(--red-ink); font-weight:700; margin-top:1.9rem }
.nb dl{ margin:0 }
.nb dt{ display:inline; font-family:var(--f-hand); font-size:1.35rem; color:var(--red-ink); font-weight:700 }
.nb dt::after{ content:" —" }
.nb dd{ display:inline; margin:0 } .nb dd::after{ content:""; display:block }
.nb .calkey{ font-family:var(--f-hand); font-size:1.1rem; color:var(--pencil) }
.nb .calkey .k.on::before{ background:rgba(246,208,40,.8); border-radius:1px }
.nb .sticky{ position:relative; background:var(--sticky); color:#2a2618; padding:1rem 1rem 1.1rem; margin:1.6rem .2rem 1rem; transform:rotate(-1.2deg); box-shadow:0 10px 18px -12px rgba(60,40,0,.55); line-height:1.6rem }
.nb .sticky h3{ font-family:var(--f-hand); font-size:1.6rem; line-height:1.8rem; margin-bottom:.4rem }
.nb .sticky ul{ margin:0; padding-left:1.1rem } .nb .sticky li{ margin:.35rem 0 }
.nb .sticky a{ color:#2a2618; font-weight:700; text-decoration:underline 1.5px; text-underline-offset:3px }
.nb .danger{ border:2.5px solid var(--red-ink); border-radius:12px 4px 14px 6px / 6px 14px 4px 12px; padding:.6rem .8rem; margin:1.2rem 0; color:#5c1a14; line-height:1.65rem; background:rgba(163,48,42,.05) }
.nb .danger b{ font-family:var(--f-type); text-transform:uppercase; letter-spacing:.08em; color:var(--red-ink); display:block; font-size:.95rem }
.nb .care{ border-color:#8a5a0c; color:#4f3507; background:rgba(160,110,20,.06) } .nb .care b{ color:#8a5a0c }
.nb .pencil{ color:var(--pencil); font-family:var(--f-hand); font-size:1.4rem; line-height:1.9rem }
.nb .card-idx{ background:#fbf8ef; color:#2b2b2b; font-family:var(--f-type); font-size:.86rem; line-height:1.45; padding:.7rem .8rem; margin:.8rem 0; border-top:3px solid #c76a6a; box-shadow:0 2px 5px rgba(0,0,0,.15) }
.nb .card-idx p{ margin:.25rem 0 }
.nb textarea{ width:100%; min-height:7.6rem; border:0; resize:vertical; background:linear-gradient(to bottom, transparent calc(1.9rem - 1px), var(--rule) 1.9rem) 0 0/100% 1.9rem; font-family:var(--f-hand); font-size:1.45rem; line-height:1.9rem; color:#1d3a8a; padding:0 }
.nb a{ color:#1d3a8a }
.nb .nlinks{ display:flex; flex-wrap:wrap; gap:.4rem 1rem; font-family:var(--f-hand); font-size:1.35rem }

/* Seccions informatives */
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:1rem; display:grid; gap:.6rem; min-width:0 }
.panel h2{ font-size:1.15rem }
.panel p{ margin:0 }
.panel ul{ margin:0; padding-left:1.15rem; display:grid; gap:.35rem }
/* Telèfons d'urgència: etiqueta a sobre i número sencer a sota, perquè no es parteixi al mòbil */
.kv{ display:grid; gap:.7rem }
.kv .tel{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.1rem .8rem; align-items:center }
.kv .lb{ grid-column:1/-1; font-size:.9rem; color:var(--muted) }
.kv .n{ font-size:1.35rem; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.02em; white-space:nowrap; color:var(--fg); text-decoration:none }
.copy{ border:1px solid var(--line); background:var(--chip); border-radius:8px; padding:.3rem .6rem; font-size:.85rem; cursor:pointer }
details.rg{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:.2rem 1rem }
details.rg summary{ cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; gap:.6rem; padding:.75rem 0 }
details.rg summary::-webkit-details-marker{ display:none }
details.rg summary b{ font-size:1.05rem }
details.rg summary small{ display:block; color:var(--muted); font-size:.85rem }
details.rg summary::after{ content:"+"; font-size:1.4rem; color:var(--muted) }
details.rg[open] summary::after{ content:"–" }
details.rg .in{ display:grid; gap:.6rem; padding-bottom:1rem }

// Il·lustració del kit de reactius: ampolletes de vidre amb comptagotes
const BOTTLES = (()=>{
  const B=[
    {x:22,  w:52, h:88, glass:'#7a3f12', liq:'#c9b98e', lab:'KOH',   sub:'5 %'},
    {x:88,  w:46, h:74, glass:'#2f5a4a', liq:'#d8e6e0', lab:'NH₃',   sub:'amoníac'},
    {x:148, w:56, h:96, glass:'#7a3f12', liq:'#b5c48a', lab:'FeSO₄', sub:'10 %'},
    {x:218, w:48, h:80, glass:'#6b3410', liq:'#c58b54', lab:'Guaiac',sub:'tintura'},
  ];
  const base=150;
  let s=`<svg viewBox="0 0 340 172" role="img" aria-label="Quatre ampolletes de vidre amb comptagotes, etiquetades KOH, NH₃, FeSO₄ i Guaiac, i un paper amb una esporada">`;
  s+=`<defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset=".18" stop-color="#fff" stop-opacity=".45"/><stop offset=".3" stop-color="#fff" stop-opacity=".05"/><stop offset=".85" stop-color="#000" stop-opacity=".0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient></defs>`;
  s+=`<rect x="0" y="${base}" width="340" height="22" rx="3" fill="#a77b4f"/><rect x="0" y="${base}" width="340" height="4" fill="#c79a6a"/>`;
  // paper amb esporada
  s+=`<g transform="translate(280 ${base-6}) rotate(-6)"><rect x="0" y="-38" width="52" height="40" fill="#f7f3ea" stroke="#d8d0bf"/><rect x="26" y="-38" width="26" height="40" fill="#2a2522"/><ellipse cx="26" cy="-18" rx="17" ry="13" fill="#7b5a3a" opacity=".55"/><ellipse cx="26" cy="-18" rx="9" ry="7" fill="#7b5a3a" opacity=".35"/></g>`;
  for(const b of B){
    const top=base-b.h, cx=b.x+b.w/2, nw=b.w*.38;
    // ombra
    s+=`<ellipse cx="${cx}" cy="${base+1}" rx="${b.w*.55}" ry="3" fill="#000" opacity=".18"/>`;
    // cos
    s+=`<path d="M${b.x},${base-4} Q${b.x},${base} ${b.x+4},${base} L${b.x+b.w-4},${base} Q${b.x+b.w},${base} ${b.x+b.w},${base-4} L${b.x+b.w},${top+22} Q${b.x+b.w},${top+12} ${cx+nw/2},${top+8} L${cx-nw/2},${top+8} Q${b.x},${top+12} ${b.x},${top+22} Z" fill="${b.glass}"/>`;
    // líquid
    s+=`<rect x="${b.x+3}" y="${top+b.h*.45}" width="${b.w-6}" height="${b.h*.55-6}" rx="3" fill="${b.liq}" opacity=".35"/>`;
    // reflex
    s+=`<path d="M${b.x},${base-4} L${b.x},${top+22} Q${b.x},${top+12} ${cx-nw/2},${top+8} L${cx+nw/2},${top+8} Q${b.x+b.w},${top+12} ${b.x+b.w},${top+22} L${b.x+b.w},${base-4} Z" fill="url(#gl)"/>`;
    // etiqueta
    const ly=top+b.h*.42, lh=b.h*.36;
    s+=`<rect x="${b.x+5}" y="${ly}" width="${b.w-10}" height="${lh}" rx="2" fill="#f4ecd8"/><rect x="${b.x+5}" y="${ly}" width="${b.w-10}" height="4" fill="#b8473a"/>`;
    s+=`<text x="${cx}" y="${ly+lh*.6}" text-anchor="middle" font-family="'Special Elite','Courier New',monospace" font-size="${b.lab.length>4?9.5:12}" fill="#2b2b2b">${b.lab}</text>`;
    s+=`<text x="${cx}" y="${ly+lh*.6+10}" text-anchor="middle" font-family="'Special Elite','Courier New',monospace" font-size="7" fill="#5b5043">${b.sub}</text>`;
    // anell i comptagotes
    s+=`<rect x="${cx-nw/2-2}" y="${top}" width="${nw+4}" height="10" rx="2" fill="#1f1b18"/>`;
    s+=`<path d="M${cx-nw/2+1},${top} L${cx-nw/2+1},${top-14} Q${cx-nw/2+1},${top-30} ${cx},${top-30} Q${cx+nw/2-1},${top-30} ${cx+nw/2-1},${top-14} L${cx+nw/2-1},${top} Z" fill="#2a2522"/>`;
    s+=`<path d="M${cx-nw/2+4},${top-12} Q${cx-nw/2+4},${top-24} ${cx-2},${top-26}" stroke="#fff" stroke-opacity=".3" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  }
  return s+`</svg>`;
})();

const KNOW = [
 { id:'anatomia', title:'Les parts d’un bolet', sub:'Per començar: com es diu cada cosa',
   body:`${ANATOMY_SVG}
   <p>El bolet és només la «fruita» d’un fong. El fong de debò és el <b>micel·li</b>: una xarxa de fils blancs molt fins que viu sota terra o dins la fusta, a vegades durant molts anys.</p>
   <p>No tots els bolets tenen totes les parts. L’<b>anell</b> i la <b>volva</b>, per exemple, són restes dels vels que protegien el bolet jove, i només en tenen alguns grups, com les amanites.</p>
   <h3>Què hi ha sota el barret</h3>
   ${UNDER_SVG}
   <p>És el primer que cal mirar: separa grups sencers. Les <b>làmines</b> són fulles fines; els <b>porus</b> són forats petits com una esponja (ceps i mollerics); els <b>plecs</b> són arrugues gruixudes que baixen pel peu (rossinyol); les <b>agulles</b> pengen com punxetes (llengua de bou).</p>` },

 { id:'paraules', title:'Paraules que surten a les fitxes', sub:'Carn, làtex, esporada, volva…',
   body:`<dl class="gloss">
    <dt>Carn</dt><dd>L’interior del bolet quan el talles. Es mira el color, si canvia en l’aire (blaveja, enrogeix), si és ferma, fibrosa o trencadissa com el guix (rússules) i l’olor.</dd>
    <dt>Làtex</dt><dd>Un líquid que surt en tallar alguns bolets, sobretot els <i>Lactarius</i> (rovelló, pinetell). El color i si canvia al cap d’uns segons és clau per distingir-los.</dd>
    <dt>Esporada</dt><dd>La pols d’espores que deixa caure el barret si el poses unes hores sobre un paper. El seu color separa grups sencers.</dd>
    <dt>Himeni</dt><dd>La part on es fan les espores: les làmines, els porus, els plecs o les agulles.</dd>
    <dt>Cutícula</dt><dd>La pell del barret. En alguns bolets es pela fàcilment, com a les llenegues.</dd>
    <dt>Làmines lliures, enganxades o decurrents</dt><dd>Lliures si no toquen el peu, enganxades si s’hi uneixen, i decurrents si baixen pel peu.</dd>
    <dt>Anell</dt><dd>Una mena de faldilla al peu: és el que queda del vel que tapava les làmines del bolet jove.</dd>
    <dt>Volva</dt><dd>Un sac o uns anells a la base del peu, restes del vel que embolicava tot el bolet jove. Sovint queda colgada: per això cal arrencar el bolet sencer. Moltes amanites mortals en tenen.</dd>
    <dt>Cortina</dt><dd>Fils com de teranyina entre el marge del barret i el peu. És típica dels cortinaris.</dd>
    <dt>Mamelló</dt><dd>Un bony al centre del barret.</dd>
    <dt>Escrobícules</dt><dd>Clotets de color més fosc al peu, com els del rovelló.</dd>
    <dt>Viscós</dt><dd>Enganxós quan és humit, com les llenegues i els mollerics.</dd>
    <dt>Micorriza</dt><dd>La unió entre el fong i les arrels d’un arbre. Per això cada bolet surt amb uns arbres concrets.</dd>
    <dt>Sapròfit</dt><dd>Un fong que s’alimenta de matèria morta: fusta, fullaraca o fems.</dd>
    <dt>Rotllana</dt><dd>Bolets que surten en cercle perquè el micel·li creix cap a fora des d’un punt. També en diuen cercle de bruixa.</dd>
   </dl>` },

 { id:'sol', title:'Les pedres i el sòl', sub:'Per què cada bolet surt on surt',
   body:`<p>La roca de sota decideix com és el sòl, i el sòl decideix quins arbres i quins bolets hi viuen. Hi ha dos grans tipus de sòl:</p>
   <div class="soilcmp">
    <div class="sc-calc"><h4>Sòl calcari (bàsic)</h4><p>Ve de la pedra calcària i de les margues. Té un pH de més de 7 i sovint és prim, pedregós i de color clar. Al Berguedà és el més comú.</p></div>
    <div class="sc-acid"><h4>Sòl àcid (silícic)</h4><p>Ve de roques com el granit, la pissarra o alguns gresos, o de sòls on la pluja s’ha endut la calç. Té un pH de menys de 6,5 i és pobre en calci.</p></div>
   </div>
   <h3>Per què importa als bolets</h3>
   <p>Molts bolets viuen units a les arrels d’un arbre (micorriza), i cada arbre prefereix un sòl. A més, cada fong té un interval de pH on viu bé. En un estudi de 42 pinedes de Catalunya, el pH va ser el factor del sòl que més explicava quins fongs hi havia.</p>
   <ul class="tools">
    <li><b>Calcícoles</b>: prefereixen sòl calcari. Per exemple, el rovelló.</li>
    <li><b>Acidòfils o calcífugs</b>: prefereixen sòl àcid. Per exemple, el pinetell, que tendeix a sòls sorrencs i silícics.</li>
    <li><b>Indiferents</b>: surten en tots dos.</li>
    <li><b>Descomponedors</b>: viuen de fusta o fullaraca morta; la roca de sota els afecta poc.</li>
   </ul>
   <h3>Com saber quin sòl trepitges</h3>
   <ul class="tools">
    <li><b>La prova del vinagre.</b> Posa unes gotes de vinagre sobre una pedra neta: si fa bombolles, és calcària. La dolomia gairebé no en fa. Porta ulleres i guants, i si te’n cau a l’ull, renta’l amb aigua 15 minuts.</li>
    <li><b>Plantes que indiquen sòl calcari:</b> boix, romaní, bruc d’hivern, pinassa i pi blanc.</li>
    <li><b>Plantes que indiquen sòl àcid:</b> bruguerola, bruc boal, neret, nabiu, castanyer, estepa negra i estepa borrera.</li>
    <li><b>Ni una cosa ni l’altra:</b> l’alzina i el pi roig surten en tots dos sòls. Al Berguedà, el pi roig fa grans pinedes sobre calcari.</li>
   </ul>
   <h3>El sòl del Berguedà</h3>
   <p>El Berguedà és, sobretot, de pedra calcària. Les clapes de sòl àcid són poques i petites.</p>
   <dl class="gloss">
    <dt>1 · Cadí i Moixeró</dt><dd>Calcàries i margues del Cretaci i el Juràssic. Al Moixeró hi ha esquistos, i a dalt el sòl s’ha descalcificat: hi viuen pi negre, neret i nabiu.</dd>
    <dt>2 · Pedraforca</dt><dd>Calcàries i margues del Mesozoic, amb fòssils. Sòls calcaris.</dd>
    <dt>3 · Ensija i Rasos de Peguera</dt><dd>Calcàries i margues amb capes de lignit a Vallcebre, Fígols i Cercs. Al cim dels Rasos hi ha prats i pi negre sobre sòl àcid.</dd>
    <dt>4 · Catllaràs i Alt Llobregat</dt><dd>Substrat calcari, amb pi roig i faig amb boix. A Castellar de n’Hug hi afloren terrenys silícics.</dd>
    <dt>5 · Serres de Borredà i Vilada</dt><dd>Gresos i conglomerats entre les Llosses i Borredà, i calcàries. Sòls majoritàriament calcaris.</dd>
    <dt>6 · Berga i Queralt</dt><dd>Calcàries de Queralt i conglomerats del Picancel i la Quar. Sòls calcaris.</dd>
    <dt>7 · Serres de ponent</dt><dd>Conglomerats i gresos de Canalda a Capolat i Montmajor. Sòls calcaris.</dd>
    <dt>8 · Vall del Llobregat i Merlès</dt><dd>Gresos, lutites i calcàries de relleu pla. Sobre gres la pluja n’ha tret la calç en alguns llocs: entre Sagàs i Berga hi ha bruc boal i estepa borrera.</dd>
   </dl>
   <p class="muted" style="font-size:.85rem">Fonts: <a href="https://eforown.ctfc.cat/pdf/10_Sols_et_especes_en_Mediterrannee.pdf" target="_blank" rel="noopener">CTFC, sòls i espècies</a> · <a href="https://eforown.ctfc.cat/pdf/R54_Techniques_production_champignons_forestiers_cat_FINAL.pdf" target="_blank" rel="noopener">CTFC, producció de bolets</a> · <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8538088/" target="_blank" rel="noopener">pH i fongs en pinedes de Catalunya</a> · <a href="https://www.miteco.gob.es/content/dam/miteco/es/biodiversidad/temas/inventarios-nacionales/iect_lactarius_deliciosus_tcm30-164130.pdf" target="_blank" rel="noopener">MITECO, Lactarius deliciosus</a> · <a href="https://www.enciclopedia.cat/historia-natural-dels-paisos-catalans/les-ericacies" target="_blank" rel="noopener">Les ericàcies</a> · <a href="https://www.enciclopedia.cat/historia-natural-dels-paisos-catalans/les-buxacies" target="_blank" rel="noopener">Les buxàcies</a> · <a href="https://www.enciclopedia.cat/catalunya-romanica/el-marc-geografic-del-romanic-del-bergueda" target="_blank" rel="noopener">El marc geogràfic del Berguedà</a> · <a href="https://www.enciclopedia.cat/historia-natural-dels-paisos-catalans/les-serres-de-cadi-moixero-i-mogrony" target="_blank" rel="noopener">Cadí-Moixeró</a> · <a href="https://www.enciclopedia.cat/historia-natural-dels-paisos-catalans/la-serra-del-catllaras" target="_blank" rel="noopener">El Catllaràs</a> · <a href="https://diposit.ub.edu/dspace/handle/2445/193342" target="_blank" rel="noopener">Mapes de vegetació (UB)</a> · <a href="https://geology.com/minerals/acid-test.shtml" target="_blank" rel="noopener">La prova de l’àcid</a></p>` },

 { id:'estris', title:'Què cal portar al bosc', sub:'Els estris del boletaire',
   body:`<ul class="tools">
    <li><b>Cistell o caixa rígida.</b> Mai bosses de plàstic: els bolets s’aixafen, es fan malbé i no deixen caure les espores.</li>
    <li><b>Ganivet boletaire</b>, amb raspall per netejar-los al bosc.</li>
    <li><b>Bosses de paper o paper d’alumini</b> per portar a part els bolets que no coneixes.</li>
    <li><b>Lupa de 10 augments</b> per veure les làmines, els porus i les esquames.</li>
    <li><b>Mòbil carregat i bateria externa</b>, amb aquesta app i un mapa que funcioni sense cobertura.</li>
    <li><b>Llibreta i llapis</b> per apuntar el lloc, els arbres del voltant i l’olor.</li>
    <li><b>Guants fins</b> per tocar bolets que no coneixes.</li>
    <li><b>Paper blanc i negre i un got</b>, per fer l’esporada a casa.</li>
    <li><b>Roba i calçat de muntanya, aigua i un xiulet.</b> Avisa algú d’on vas.</li>
    <li><b>Kit de reactius</b> (opcional). Mira el tema «El kit de reactius».</li>
   </ul>` },

    <li><b>Les dites populars no serveixen.</b> Que s’ennegreixi una cullera de plata, que se’l mengin els cargols o que faci bona olor no vol dir res.</li>
    <li><b>Cull-lo sencer, amb la base</b>, i porta els que no coneixes a part.</li>
    <li><b>Només exemplars joves i sans.</b> Res de vells, florits, gelats o plens de cucs.</li>
    <li><b>Cuina’ls sempre.</b> Molts bolets comestibles són tòxics o indigestos crus.</li>
    <li><b>La primera vegada, poca quantitat</b>, i guarda’n un exemplar a la nevera per si et trobes malament.</li>
    <li><b>Si et trobes malament, ves a urgències</b> encara que hagin passat hores. Els telèfons són a la pestanya Berguedà.</li>

, "himeni": "Láminas rosadas.", "peu": "Rosado, hueco.", "carn": "Látex BLANCO, muy picante.", "espora": "Crema"}, "hab": "Bajo abedules, en la montaña.", "tox": "Síndrome gastrointestinal, sobre todo si se come crudo o poco cocinado.", "cur": "En el norte de Europa lo consumen después de hervirlo y salarlo, pero aquí se considera tóxico.", "note": "Margen PELUDO, látex blanco.", "conf": [{"t": "El níscalo de sangre tiene látex rojo vino y el margen no peludo."}, {"t": "El níscalo tiene látex naranja."}]}, "pinetell-bord": {"nom": "Níscalo falso", "alt": [], "q": null, "f": {"barret": "3–8 cm, naranja pálido con manchas en zonas.", "himeni": "Láminas crema.", "peu": "Claro, hueco.", "carn": "Látex blanco que se vuelve amarillo azufre en pocos segundos. Muy picante.", "espora": "Crema"}, "hab": "Robledales, encinares y castañares de suelo ácido.", "tox": "Picante e indigesto. Puede causar trastornos digestivos.", "cur": "Corta una lámina y espera diez segundos: el cambio de blanco a amarillo es su firma.", "note": "Látex blanco → AMARILLO.", "conf": [{"t": "Látex rojo vino."}, {"t": "Látex naranja."}]}, "fredolic-metzinos": {"nom": "Tigrino", "alt": [], "q": null, "f": {"barret": "6–15 cm, gris con escamas oscuras en círculos, carnoso.", "himeni": "Láminas blanquecinas con reflejos amarillentos.", "peu": "Grueso, blanco.", "carn": "Blanca, con olor a harina.", "espora": "Blanca"}, "hab": "Hayedos y abetales de montaña en suelos calizos.", "tox": "Síndrome gastrointestinal grave, con vómitos y diarrea fuertes durante horas.", "cur": "Es un buen ejemplo de por qué el tamaño y el olor importan: de lejos, parece una negrilla gigante.", "note": "Grande, escamas oscuras, olor a harina.", "conf": [{"t": "La negrilla es pequeña, delgada y sin olor a harina."}, {"t": "La capuchina tiene fibras negras radiales, no escamas."}]}, "cortinari-metzinos": {"nom": "Cortinario de montaña", "alt": [], "q": null, "f": {"barret": "3–8 cm, naranja óxido, afieltrado, seco.", "himeni": "Láminas espaciadas y gruesas, color óxido.", "peu": "Fibroso, amarillento, con restos finos de cortina.", "carn": "Amarillenta, olor suave a rábano.", "espora": "Marrón óxido"}, "hab": "Robledales y castañares de suelo ácido.", "tox": "Orellanina. Síndrome orellánico: los síntomas llegan entre 2 y 17 días después y destruyen los riñones. Avisa al médico de cualquier seta que hayas comido las semanas anteriores.", "cur": "Bajo luz ultravioleta la orellanina emite una fluorescencia azul, pero no es un método fiable para identificarlo.", "note": "Latencia de DÍAS. Esporada marrón óxido.", "conf": [{"t": "El rebozuelo tiene pliegues y esporada blanca."}]}, "lepiota-petita": {"nom": "Lepiotas pequeñas", "alt": [], "q": null, "f": {"barret": "2–5 cm, blanquecino con escamas pardo vinosas concentradas en el centro.", "himeni": "Láminas blancas y libres.", "peu": "Delgado, con un anillo débil y bandas vinosas.", "carn": "Blanca, olor afrutado.", "espora": "Blanca"}, "hab": "Prados, jardines, bordes de caminos y lindes de bosque.", "tox": "Amatoxinas, como la oronja verde. Mortal.", "cur": "Por eso la norma de la parasol es tan estricta: cualquier “paloma” pequeña puede ser una lepiota.", "note": "Pequeña con escamas = NO.", "conf": [{"t": "Una parasol adulta mide más de 10 cm y tiene anillo móvil."}, {"t": "La senderuela no tiene escamas ni anillo."}]}, "escaldabecs": {"nom": "Rúsula emética", "alt": [], "q": null, "f": {"barret": "3–8 cm, rojo intenso, brillante con la humedad.", "himeni": "Láminas blancas, frágiles.", "peu": "Blanco, frágil.", "carn": "Blanca, muy picante.", "espora": "Blanca"}, "hab": "Pinares húmedos, entre musgo y turbera.", "tox": "Síndrome gastrointestinal con vómitos.", "cur": "Su nombre popular en catalán dice lo que pasa si la pruebas: “escalda el pico”.", "note": "Roja y picante.", "conf": [{"t": "Colores violáceos y láminas flexibles. Comestible."}], "re": [{"tissue": "Carne del pie", "res": "Rosa claro."}, {"tissue": "Carne del pie", "res": "Débil, entre amarillo y pardo."}]}, "matagent": {"nom": "Boleto de Satanás", "alt": [], "q": null, "f": {"barret": "10–30 cm, blanco grisáceo a crema, grueso.", "himeni": "Poros rojos que azulean al tocarlos.", "peu": "Muy ventrudo, amarillo arriba y rojo abajo, con retículo rojo.", "carn": "Amarillenta, azulea al cortarla. Los ejemplares viejos huelen mal.", "espora": "Pardo oliva"}, "hab": "Robledales y encinares de suelo calizo, en zonas cálidas.", "tox": "Síndrome gastrointestinal grave, sobre todo si se come crudo o poco hecho.", "cur": "A pesar del nombre, no mata: pero es de los tóxicos más potentes entre las setas con poros.", "note": "Poros ROJOS + azulea.", "conf": [{"t": "El boleto tiene poros blancos a amarillo verdosos y no azulea."}]}, "falsa-murgola": {"nom": "Falsa colmenilla", "alt": [], "q": null, "f": {"barret": "5–10 cm, pardo rojizo, lobulado y arrugado como un cerebro.", "himeni": "En la superficie del sombrero.", "peu": "Blanquecino, hueco con cámaras irregulares.", "carn": "Por dentro tiene varias cámaras llenas de fibras algodonosas.", "espora": "Blanquecina"}, "hab": "Primavera, pinares de suelos arenosos en la montaña.", "tox": "Giromitrina, que se transforma en monometilhidrazina. Afecta al hígado y al sistema nervioso. Puede ser mortal y los vapores al cocinarla también intoxican.", "cur": "Durante mucho tiempo se comió después de hervirla, hasta que se demostró que el tóxico se acumula.", "note": "Cerebro, no panal. Cámaras dentro.", "conf": [{"t": "La colmenilla tiene alveolos y es toda hueca por dentro."}]}, "galerina": {"nom": "Galerina", "alt": [], "q": null, "f": {"barret": "1–5 cm, pardo miel, que se aclara al secarse.", "himeni": "Láminas pardo ocre.", "peu": "Delgado, con un anillo pequeño, oscuro por debajo.", "carn": "Delgada, olor a harina.", "espora": "Marrón óxido"}, "hab": "En grupos sobre madera muerta, sobre todo de coníferas.", "tox": "Amatoxinas, las mismas que la oronja verde. Mortal.", "cur": "Es una de las setas más pequeñas que pueden matar. Nunca recojas para comer setas pequeñas y pardas sobre madera.", "note": "Pequeña, parda, sobre madera, anillo = NO.", "conf": [{"t": "También crece en grupos sobre madera y es comestible. Tan parecida que no se recomienda recogerla."}, {"t": "La seta de chopo es más grande y sale sobre chopos, no sobre coníferas."}]}, "clitocibe-blanc": {"nom": "Clitocibe blanco", "alt": [], "q": null, "f": {"barret": "2–5 cm, blanco, de aspecto harinoso, plano o algo hundido.", "himeni": "Láminas apretadas y decurrentes, blanquecinas.", "peu": "Corto, blanco, se rompe.", "carn": "Delgada, blanca.", "espora": "Blanca"}, "hab": "Prados y céspedes, a menudo en corros junto a la senderuela.", "tox": "Muscarina. Síndrome muscarínico: sudor, salivación y lágrimas abundantes, entre 15 minutos y 2 horas. Grave en personas vulnerables.", "cur": "Puede crecer mezclado con la senderuela en el mismo corro. Revísalas una a una.", "note": "Blanco de prado: cuidado con la senderuela.", "conf": [{"t": "La senderuela tiene las láminas espaciadas y el pie no se rompe."}, {"t": "La seta de San Jorge es más grande y carnosa, de primavera."}, {"t": "La molinera tiene esporada rosa y olor a harina."}]}, "bolet-de-pi": {"nom": "Hifoloma de láminas verdes", "alt": [], "q": null, "f": {"barret": "2–7 cm, amarillo azufre con el centro naranja.", "himeni": "Láminas verde amarillentas, después oscuras.", "peu": "Amarillo, en grupos.", "carn": "Amarilla, muy amarga.", "espora": "Pardo púrpura"}, "hab": "En grupos sobre tocones y madera de pinos y planifolios.", "tox": "Síndrome gastrointestinal.", "cur": "Sale casi todo el año. Las láminas verdosas lo delatan.", "note": "Amarillo azufre + láminas verdes.", "conf": [{"t": "Tiene anillo y esporada blanca; hay que saber cocinarla."}]}, "sureny-fosc": {"nom": "Boleto negro", "alt": [], "q": "Excelente", "f": {"barret": "8–20 cm, pardo muy oscuro, casi negro, seco y algo aterciopelado.", "himeni": "Poros blancos de joven, después amarillo verdosos. No azulean.", "peu": "Robusto, pardo avellana, con un retículo fino de color pardo.", "carn": "Blanca y firme, no cambia de color al cortarla.", "espora": "Pardo oliva"}, "hab": "Encinares, alcornocales, robledales y castañares de zonas cálidas. Sale con las tormentas de verano y a principios de otoño.", "cur": "Es el boleto de las zonas bajas y cálidas: el Baix Berguedà es su terreno.", "note": "Sombrero casi negro, poros que NO azulean.", "conf": [{"t": "Sombrero más claro y de lugares más altos. También excelente."}, {"t": "Poros rojos y carne que azulea. Tóxico."}]}, "llenega-blanca": {"nom": "Babosa blanca", "alt": [], "q": "Muy bueno", "f": {"barret": "4–10 cm, blanco crema a amarillento pálido, muy viscoso con la humedad.", "himeni": "Láminas blancas a crema, gruesas, espaciadas y decurrentes.", "peu": "Blanco, viscoso por debajo de un anillo gelatinoso poco marcado.", "carn": "Blanca y firme, sin olor especial.", "espora": "Blanca"}, "hab": "Pinares de pino negral y pino silvestre en suelos calizos, a finales de otoño.", "tox": "Pela la cutícula viscosa antes de cocinarla.", "cur": "Como en la babosa negra, la esporada blanca la separa de los cortinarios viscosos, que la tienen marrón.", "note": "Blanca, viscosa, esporada blanca.", "conf": [{"t": "Sombrero pardo oliva oscuro. También muy buena."}, {"t": "No es viscoso y sale en los prados. Tóxico."}, {"t": "Anillo membranoso, volva en el pie y sombrero seco. Mortal."}]}, "carlet": {"nom": "Higróforo rojizo", "alt": [], "q": "Muy bueno", "f": {"barret": "5–12 cm, carnoso, blanco de joven y pronto manchado de rosa vinoso a rojo púrpura.", "himeni": "Láminas blancas que se manchan de vinoso, bastante apretadas.", "peu": "Grueso y macizo, blanco con manchas vinosas.", "carn": "Blanca y firme. A veces tiene un punto amargo.", "espora": "Blanca"}, "hab": "Encinares y robledales, a menudo en corros y en grupos numerosos.", "cur": "El entoloma lívido lleva su nombre en catalán («fals carlet»). Para separarlos, haz la esporada: blanca en el higróforo y rosa en el entoloma.", "note": "Manchas vinosas. Esporada BLANCA.", "conf": [{"t": "Láminas amarillas que pasan a rosadas y esporada rosa. Tóxico."}, {"t": "Rúsula roja: láminas y carne frágiles, que se rompen como la tiza, y sabor muy picante. Tóxica."}]}, "fredolic-gros": {"nom": "Capuchina", "alt": [], "q": "Muy bueno", "f": {"barret": "5–12 cm, gris oscuro con fibras radiales negras y un mamelón. A menudo tiene reflejos amarillos o violáceos.", "himeni": "Láminas blancas con tonos amarillos.", "peu": "Blanco con tonos amarillos, firme, sin anillo.", "carn": "Blanca, con olor y sabor a harina.", "espora": "Blanca"}, "hab": "Pinares de pino silvestre y pino negral, a finales de otoño.", "cur": "Sale con el frío, como la negrilla, pero es mucho más carnosa.", "note": "Fibras NEGRAS radiales. Láminas con tonos amarillos.", "conf": [{"t": "Escamas grises sobre fondo claro, no fibras negras. Tóxico."}, {"t": "Más pequeña y delgada, sin olor a harina. También muy buena."}, {"t": "Sombrero cónico gris plateado y sabor amargo y picante."}]}, "pollancro": {"nom": "Seta de chopo", "alt": [], "q": "Muy bueno", "f": {"barret": "4–10 cm, pardo avellana de joven, después crema con el centro más oscuro, a menudo agrietado.", "himeni": "Láminas apretadas, blanquecinas y después pardo tabaco.", "peu": "Largo, blanquecino, con un anillo membranoso.", "carn": "Blanca, con olor agradable a harina o a vino.", "espora": "Pardo tabaco"}, "hab": "En grupos sobre tocones y troncos de chopos, álamos y sauces, a la orilla de los ríos.", "tox": "Cocínala siempre.", "cur": "Es una de las pocas setas silvestres que se cultivan fácilmente: basta con un tronco de chopo. Antes se llamaba Agrocybe aegerita.", "note": "Sobre chopo, con anillo.", "conf": [{"t": "Pequeña, sobre madera de coníferas, con un anillo débil. Mortal."}, {"t": "Amarillo azufre, láminas verdosas y esporada oscura. Tóxico."}]}, "girgola-panical": {"nom": "Seta de cardo", "alt": [], "q": "Muy bueno", "f": {"barret": "4–10 cm, pardo grisáceo a pardo claro, convexo y después en forma de embudo.", "himeni": "Láminas blanquecinas a crema, que bajan mucho por el pie.", "peu": "Corto y firme, a menudo lateral, pegado a las raíces del cardo corredor.", "carn": "Blanca y firme, con olor agradable.", "espora": "Blanca"}, "hab": "Prados secos, eriales y lindes con cardo corredor (Eryngium campestre), un cardo que crece en los campos.", "cur": "No crece en ningún sitio sin el cardo corredor: vive de las raíces muertas de este cardo.", "note": "Busca el cardo corredor.", "conf": [{"t": "Blanco y pequeño, y no sale sobre el cardo corredor. Tóxico."}]}, "orellana": {"nom": "Seta de ostra", "alt": [], "q": "Bueno", "f": {"barret": "5–15 cm, en forma de concha o de oreja, gris azulado a pardo, liso.", "himeni": "Láminas blancas que bajan hasta el pie.", "peu": "Muy corto y lateral, o ausente.", "carn": "Blanca y tierna, con olor agradable.", "espora": "Blanca a lila pálido"}, "hab": "En grupos superpuestos sobre troncos y tocones de chopo, olmo o haya, en otoño e invierno.", "cur": "Es la «gírgola» que se vende cultivada en las tiendas.", "note": "Concha gris sobre madera.", "conf": [{"t": "Naranja vivo, en grupos con pie, sobre olivo o encina. Tóxico."}]}, "camperol": {"nom": "Champiñón silvestre", "alt": [], "q": "Bueno", "f": {"barret": "4–10 cm, blanco, sedoso o con pequeñas escamas fibrosas.", "himeni": "Láminas libres, rosa vivo de joven y después pardo chocolate a negro.", "peu": "Blanco y corto, con un anillo fino que desaparece pronto. Sin volva.", "carn": "Blanca, puede enrojecer un poco. Olor agradable a seta.", "espora": "Pardo chocolate oscuro"}, "hab": "Prados y pastos con ganado, después de las lluvias de verano y de otoño.", "tox": "Los ejemplares jóvenes con las láminas todavía blanquecinas se pueden confundir con amanitas blancas mortales: no los recojas.", "cur": "Las láminas pasan de rosa a negro porque en ellas maduran las esporas, que son oscuras.", "note": "Láminas ROSAS o marrones, nunca blancas.", "conf": [{"t": "Láminas BLANCAS siempre y volva en la base. Mortal."}, {"t": "La base del pie se vuelve amarilla al instante y huele a tinta. Tóxico."}, {"t": "Láminas blancas, volva y sombrero verdoso. Mortal."}, {"t": "Más robusto, con anillo doble, en la tierra dura de caminos y calles. Comestible, pero no lo recojas cerca de los coches."}, {"t": "Láminas blancas que nunca se vuelven marrones y esporada blanca. No se recomienda."}]}, "bola-de-neu": {"nom": "Bola de nieve", "alt": [], "q": "Bueno", "f": {"barret": "8–15 cm, blanco, liso, que se mancha de amarillo pálido al frotarlo.", "himeni": "Láminas libres, gris rosadas de jóvenes y después pardo oscuro.", "peu": "Blanco, con un anillo grande y doble, como una rueda dentada por debajo. La base NO se vuelve amarilla.", "carn": "Blanca, con olor a anís o a almendra amarga.", "espora": "Pardo chocolate oscuro"}, "hab": "Prados, lindes y claros de bosque.", "tox": "Cómelas solo jóvenes y bien cocinadas. Puede acumular metales si crece cerca de carreteras.", "cur": "La bola de nieve y el champiñón amarillento se manchan los dos de amarillo en el sombrero. La diferencia está en la base del pie y el olor.", "note": "Olor a ANÍS. Base del pie no amarilla.", "conf": [{"t": "Base del pie amarilla al instante y olor a tinta. Tóxico."}, {"t": "Láminas blancas y volva. Mortal."}]}, "moixerno-blanc": {"nom": "Molinera", "alt": [], "q": "Muy bueno", "f": {"barret": "3–10 cm, blanco grisáceo, con tacto de gamuza y el margen enrollado e irregular.", "himeni": "Láminas decurrentes, blancas, que se vuelven rosadas.", "peu": "Corto, blanco, a menudo desplazado del centro.", "carn": "Blanca y tierna, con fuerte olor a harina fresca.", "espora": "Rosa"}, "hab": "Pinares, robledales y encinares, a menudo cerca de los boletos.", "tox": "Hay que distinguirla con seguridad de los clitocibes blancos, que son tóxicos: haz siempre la esporada.", "cur": "Dicen que donde sale ón puntiagudo. Algo viscoso.", "himeni": "Láminas decurrentes y espaciadas, de color vinoso, que se vuelven casi negras.", "peu": "Anaranjado, con la base amarillo azafrán.", "carn": "Naranja salmón. Se vuelve vinosa al cocinarla.", "espora": "Negra"}, "hab": "Pinares, sobre todo de pino carrasco y pino silvestre.", "cur": "Vive ligado a los boletos granulados: donde hay uno, a menudo está el otro.", "note": "Carne NARANJA, base amarilla, esporada negra.", "conf": [{"t": "Láminas color óxido y esporada marrón óxido. Mortal."}, {"t": "Sombrero gris violáceo muy viscoso."}]}, "bolet-de-tinta": {"nom": "Barbuda", "alt": [], "q": "Muy bueno", "f": {"barret": "5–15 cm de alto, en forma de huevo alargado y después de campana, blanco con escamas lanosas.", "himeni": "Láminas blancas que pasan a rosa y acaban negras y líquidas, como tinta.", "peu": "Largo, blanco y hueco, con un anillo que se mueve.", "carn": "Blanca y tierna.", "espora": "Negra"}, "hab": "Prados, bordes de caminos, jardines y tierras removidas, a menudo en grupos.", "tox": "Recoge solo los ejemplares bien blancos y cerrados, y cocínalos el mismo día: en pocas horas se deshacen en tinta.", "cur": "Antiguamente, la tinta que suelta al deshacerse se usaba para escribir.", "note": "Blanca, lanosa, en forma de huevo largo.", "conf": [{"t": "Más pequeño, gris y sin escamas lanosas. Tóxico con alcohol."}]}, "cogomassa": {"nom": "Oronja primaveral", "alt": [], "q": null, "f": {"barret": "5–10 cm, blanco puro, liso y algo sedoso.", "himeni": "Láminas blancas y libres.", "peu": "Blanco, con un anillo blanco colgante y una volva blanca en forma de saco en la base.", "carn": "Blanca, sin olor especial.", "espora": "Blanca"}, "hab": "Encinares, robledales y pinares de zonas cálidas. Sale en primavera y también en otoño.", "tox": "MORTAL. Tiene las mismas toxinas que la oronja verde: destruyen el hígado. Los síntomas tardan de 6 a 24 horas y puede parecer que se pasan antes del ataque al hígado.", "cur": "Todo blanco, anillo y volva: si ves estos tres rasgos juntos, no la recojas.", "note": "Todo BLANCO + anillo + volva. No la toques.", "conf": [{"t": "Láminas rosadas o marrones y sin volva. Comestible."}, {"t": "Láminas grises a marrones, olor a anís y sin volva. Comestible."}, {"t": "Sin anillo ni volva, y olor a harina. Comestible."}, {"t": "También toda blanca y con anillo, pero sin volva y con la base en forma de maza. Sale en céspedes, jardines e invernaderos. Esporada blanca. No se recomienda."}, {"t": "También tiene volva, pero no tiene anillo y las láminas se vuelven rosa salmón. Esporada rosa."}]}, "bola-de-neu-pudent": {"nom": "Champiñón amarillento", "alt": [], "q": null, "f": {"barret": "6–12 cm, blanco, a menudo con forma de trapecio, se mancha de amarillo vivo al frotarlo.", "himeni": "Láminas libres, blancas a rosadas y después pardo oscuro.", "peu": "Blanco, con un anillo grande. La base, al cortarla o frotarla, se vuelve amarillo cromo al instante.", "carn": "Blanca, con olor desagradable a tinta o fenol, sobre todo al cocinarla.", "espora": "Pardo chocolate oscuro"}, "hab": "Jardines, parques, lindes y bosques claros, a menudo cerca de casas.", "tox": "Síndrome gastrointestinal: vómitos y diarrea pocas horas después de comerlo.", "cur": "La prueba más fiable es cortar la base del pie: si en pocos segundos se vuelve amarillo cromo, es este.", "note": "BASE AMARILLA + olor a tinta.", "conf": [{"t": "Base del pie que no se vuelve amarilla y olor agradable. Comestible."}, {"t": "Olor a anís y base del pie blanca. Comestible."}, {"t": "Anillo doble; la base no amarillea y huele bien. Comestible."}], "re": [{"tissue": "Sombrero", "res": "Amarillo intenso. La bola de nieve también puede amarillear: mira la base del pie."}]}, "bolet-de-femer": {"nom": "Coprino entintado", "alt": [], "q": null, "f": {"barret": "3–7 cm, gris a gris pardo, en forma de huevo y después de campana, con surcos radiales.", "himeni": "Láminas blancas que se ennegrecen y se deshacen en tinta.", "peu": "Blanco y hueco, con una zona de anillo cerca de la base.", "carn": "Blanca y delgada.", "espora": "Negra"}, "hab": "En grupos, en tierra rica, cerca de tocones enterrados, huertos y lindes.", "tox": "Tóxico con alcohol (síndrome coprínico). Si lo comes y bebes alcohol hasta 3 días antes o después, provoca enrojecimiento de la cara, palpitaciones y malestar.", "cur": "Contiene coprina, que actúa como un medicamento contra el alcoholismo.", "note": "Gris, en grupos. Nunca con alcohol.", "conf": [{"t": "Más alta, blanca y con escamas lanosas."}]}, "peu-de-rata-bord": {"nom": "Pie de rata bordo", "alt": [], "q": null, "f": {"barret": "No tiene sombrero: es un ramillete de ramas de 8–20 cm, rosa salmón o naranja rosado, con las puntas amarillas.", "himeni": "Las esporas se forman en la superficie de las ramas.", "peu": "Tronco blanquecino que se mancha de vinoso al tocarlo.", "carn": "Blanca, con sabor amargo.", "espora": "Ocre"}, "hab": "Hayedos y bosques de planifolios.", "tox": "Síndrome gastrointestinal: diarrea y cólicos.", "cur": "Muchos pies de rata no se pueden distinguir sin microscopio. Si no lo tienes claro, no comas ninguno.", "note": "Rosado con puntas amarillas. Amargo.", "conf": [{"t": "Ramillete amarillo yema, sin tonos rosados, y sabor suave."}]}, "groguet": {"nom": "Seta de los caballeros", "alt": [], "q": null, "f": {"barret": "5–12 cm, amarillo verdoso con el centro pardo y escamas finas. Algo viscoso.", "himeni": "Láminas amarillo azufre, apretadas.", "peu": "Amarillo, corto y robusto.", "carn": "Blanca a amarillenta, con olor a harina.", "espora": "Blanca"}, "hab": "Pinares de suelo arenoso, sobre todo de pino piñonero y pino silvestre.", "tox": "Antes se comía y la SCM la incluía entre las muy buenas. Desde 2001 se han descrito intoxicaciones graves, y alguna muerte, por rabdomiólisis (destrucción del músculo) después de comerla en varias comidas seguidas. Desde 2006 no se puede vender en España.", "cur": "Es un ejemplo de por qué las listas de comestibles cambian con el tiempo.", "note": "Ya NO se considera comestible.", "conf": [{"t": "Fuerte olor a gas o a alquitrán."}, {"t": "Sombrero gris con fibras negras, solo con tonos amarillos. Comestible."}]}, "inocibe": {"nom": "Inocybe que enrojece", "alt": [], "q": null, "f": {"barret": "3–8 cm, cónico y después plano con mamelón, blanquecino con fibras radiales y el margen agrietado. Se mancha de rojo teja al tocarlo o con la edad.", "himeni": "Láminas apretadas, blancas y después pardo oliva, con manchas rojizas.", "peu": "Blanco y firme, sin anillo. También enrojece.", "carn": "Blanca, enrojece. Olor afrutado o a tierra.", "espora": "Pardo tabaco"}, "hab": "Robledales, hayedos y parques de suelo calizo, en primavera y a principios de verano.", "tox": "Síndrome muscarínico: sudor, salivación, lágrimas y bajada de tensión entre 15 minutos y 2 horas después. Puede ser grave: ve a urgencias.", "cur": "Sale en la misma época y en los mismos lugares que la seta de San Jorge, y se ha confundido con ella en intoxicaciones graves.", "note": "ENROJECE al tocarlo. Esporada marrón.", "conf": [{"t": "Carnosa, olor a harina, no enrojece y esporada blanca. Comestible."}]}, "bolet-amarg": {"nom": "Boleto amargo", "alt": [], "q": null, "f": {"barret": "6–15 cm, pardo avellana a pardo tabaco, seco y algo aterciopelado.", "himeni": "Poros blancos de joven y después ROSADOS. Se manchan de pardo al tocarlos.", "peu": "Grueso, crema a pardo, con una red OSCURA bien marcada.", "carn": "Blanca, no cambia de color o se vuelve algo rosada. Muy amarga.", "espora": "Rosa pardo"}, "hab": "Bosques de suelo ácido (arenisca, arena), con robles, hayas, castaños o pinos. En Cataluña es raro.", "tox": "No es tóxico, pero un solo ejemplar amarga todo el plato, y la cocción no lo quita.", "cur": "El nombre felleus viene del latín fel, la bilis: es amargo como la hiel.", "note": "Poros ROSADOS + red OSCURA.", "conf": [{"t": "Poros blancos a amarillo verdoso, nunca rosados, y red blanca en  "La Societat Catalana de Micologia también lo llama camagroc, como a C. lutescens (la angula de monte), pero lo considera algo menos bueno.", "note": "Embudo hueco, pliegues GRISES, pie amarillo.", "conf": [{"t": "Himenio casi liso y naranja rosado, y pie naranja vivo. Muy buena."}, {"t": "Láminas finas y naranja vivo, y pie macizo. A rechazar."}, {"t": "Puede salir en los mismos sitios. Tiene láminas verdaderas color óxido, pie macizo y esporada marrón óxido. Mortal."}]}, "apagallums-rogenc": {"nom": "Apagador menor", "alt": [], "q": "Muy bueno", "f": {"barret": "5–15 cm, en forma de huevo y después plano. Centro pardo y liso; el resto, con escamas grandes pardas que se levantan como harapos.", "himeni": "Láminas blancas, libres y apretadas, que enrojecen al tocarlas.", "peu": "Liso y blanquecino, SIN dibujo de piel de serpiente. Tiene un anillo doble que se mueve y la base muy bulbosa.", "carn": "Blanca. Al cortarla se vuelve naranja azafrán y después rojiza.", "espora": "Blanca"}, "hab": "Bosques con mucha hojarasca, sobre todo pinares, y lindes, jardines, compost y lugares ricos en materia orgánica.", "tox": "A algunas personas les causa trastornos digestivos. Come poco la primera vez, solo el sombrero y bien cocinado. No lo recojas en jardines ni compost.", "cur": "El nombre rhacodes viene del griego y significa “harapiento”, por las escamas del sombrero.", "note": "Pie LISO + carne que se vuelve NARANJA.", "conf": [{"t": "Más grande y alto, con dibujo de piel de serpiente en el pie y carne que no enrojece. Muy bueno."}, {"t": "Pequeñas, de menos de 10 cm, con escamas vinosas y un anillo débil. Mortales."}, {"name": "Chlorophyllum brunneum", "t": "Muy parecido, con escamas más oscuras y un bulbo con reborde en la base. Sale en jardines y compost. Se considera tóxico."}, {"t": "Tiene volva con un reborde en la base, verrugas blancas pequeñas y carne que no enrojece. Tóxica."}, {"t": "Muy parecido, pero las láminas viejas se vuelven verde grisáceo y la esporada es verde. Sale en céspedes regados, sobre todo en la costa. Tóxico: vómitos fuertes."}]}, "reig-vinos": {"nom": "Oronja vinosa", "alt": ["amanita rojiza"], "q": "Bueno", "f": {"barret": "5–15 cm, pardo rosado a pardo vinoso, con restos del velo en forma de verrugas grises o rosadas.", "himeni": "Láminas blancas y libres, que se manchan de rosa vinoso.", "peu": "Blanco a rosado, con un anillo ESTRIADO por encima y la base bulbosa, sin un saco de volva.", "carn": "Blanca. Se vuelve rosa vinoso donde la cortas o donde hay agujeros de gusano.", "espora": "Blanca"}, "hab": "Pinares, robledales, hayedos y encinares, en todo tipo de suelos. Muy común en verano y otoño.", "tox": "CRUDA ES TÓXICA: tiene hemolisinas, que destruyen los glóbulos rojos. La cocción las destruye. Además, se confunde fácilmente con la amanita pantera: no la recojas si no eres experto.", "cur": "El nombre rubescens significa “que se vuelve rojo”. Los agujeros que le hacen los gusanos quedan teñidos de color vino.", "note": "Carne que se vuelve VINOSA. Anillo estriado.", "conf": [{"t": "Verrugas BLANCAS, anillo liso sin estrías, volva con un reborde y carne que NO enrojece. Tóxica."}, {"name": "Amanita spissa", "t": "Más robusta, gris parda, y la carne no enrojece. Aceptable."}]}, "kuehneromyces": {"nom": "Foliota cambiante", "alt": [], "q": "Muy bueno", "f": {"barret": "3–8 cm, pardo anaranjado, con un mamelón. Al secarse se aclara desde el centro y queda de dos colores.", "himeni": "Láminas apretadas, crema y después pardo canela.", "peu": "Delgado, con un anillo pequeño. Por encima es liso y claro; por debajo, pardo oscuro y con escamitas.", "carn": "Delgada, blanquecina a parda. Olor agradable.", "espora": "Marrón óxido"}, "hab": "En grupos apretados sobre tocones y troncos muertos, sobre todo de árboles de hoja ancha (haya, abedul, chopo). Rara vez sobre coníferas.", "tox": "MUY PELIGROSA: se confunde con la galerina, que es mortal y puede crecer en el mismo tocón. Para separarlas con seguridad hace falta el microscopio. No la recojas para comer.", "cur": "El nombre mutabilis significa “que cambia”: el sombrero cambia de color al secarse.", "note": "Igual que la galerina, mortal. Solo para mirar.", "conf": [{"t": "Casi igual: pequeña, parda, con anillo y sobre madera. Por debajo del anillo tiene fibras plateadas, no escamitas. Mortal."}, {"t": "Amarillo azufre, sin anillo, con láminas verdosas y esporada pardo púrpura. Tóxico."}, {"t": "Más grande, con escamitas en el sombrero y esporada blanca."}]}, "bolet-de-soca": {"nom": "Armilaria color de miel", "alt": [], "q": "Aceptable", "f": {"barret": "4–12 cm, color miel a pardo amarillento, con escamitas oscuras, sobre todo en el centro.", "himeni": "Láminas blanquecinas a crema, que con la edad se manchan de pardo.", "peu": "Largo y fibroso, con un anillo blanco a amarillento bien visible. Los pies salen unidos en la base, en matas.", "carn": "Blanca, fibrosa en el pie. Sabor amargo en crudo.", "espora": "Blanca a crema"}, "hab": "En grupos grandes sobre tocones, raíces y árboles vivos o muertos: robles, encinas, hayas, pinos y frutales. Es un parásito que puede matar el árbol.", "tox": "CRUDA ES TÓXICA. Come solo sombreros jóvenes, primero hervidos (tira el agua) y después bien cocinados. Algunas personas no la toleran y tienen trastornos digestivos aunque esté bien cocinada.", "cur": "Forma unos cordones negros, como cordones de zapato, que corren bajo la corteza y por el suelo e infectan otros árboles. Es una plaga de los bosques y los frutales.", "note": "En mata sobre tocón, con anillo y esporada BLANCA.", "conf": [{"t": "Mucho más pequeña, sin escamitas en el sombrero y con esporada marrón óxido. Mortal."}, {"t": "Amarillo azufre, sin anillo, con láminas verdosas y esporada pardo púrpura. Tóxico."}, {"t": "Más pequeña, sombrero de dos colores y esporada marrón óxido."}, {"t": "Naranja vivo, sin anillo, con láminas naranjas. Tóxica."}]}, "fredolic-amargant": {"nom": "Negrilla amarga", "alt": [], "q": null, "f": {"barret": "3–8 cm, cónico y después plano con un mamelón PUNTIAGUDO. Gris plateado a gris violáceo, con fibras radiales oscuras. Seco y liso.", "himeni": "Láminas blancas a grisáceas, escotadas, a veces con el borde gris.", "peu": "Blanco, largo y fibroso, sin anillo.", "carn": "Blanca a grisácea. Sabor amargo y picante, que puede tardar en notarse. Olor a tierra.", "espora": "Blanca"}, "hab": "Bosques húmedos de coníferas (pino silvestre, abeto) y, a veces, de árboles de hoja ancha.", "tox": "No es comestible: es amarga y picante, y se considera posiblemente tóxica.", "cur": "Virgatum significa “rayado”, por las fibras oscuras del sombrero.", "note": "Gris, mamelón PUNTIAGUDO y fibras. Picante.", "conf": [{"t": "Más pequeña, con el sombrero afieltrado y escamoso, no liso, y sin sabor picante. Muy buena."}, {"t": "Más carnosa, con tonos amarillos en las láminas y olor a harina. Muy buena."}, {"t": "Grande y carnoso, con escamas oscuras en círculos y olor a harina. Tóxico."}]}, "suillus-luteus": {"nom": "Boleto anillado", "alt": [], "q": "Aceptable", "f": {"barret": "5–12 cm, pardo chocolate a pardo rojizo, muy viscoso y brillante con la humedad.", "himeni": "Poros pequeños y amarillos, que con la edad se vuelven amarillo oliva.", "peu": "Amarillo pálido, con puntitos oscuros arriba y un ANILLO grande, blanco, que por debajo se vuelve violáceo a pardo.", "carn": "Blanca a amarillenta, blanda. No cambia de color.", "espora": "Pardo ocre"}, "hab": "Pinares, sobre todo de pino silvestre y pino negro, y plantaciones jóvenes de pinos. Zonas medias y altas.", "tox": "Quítale la piel viscosa y, si es viejo, también los poros. A algunas personas les provoca diarrea.", "cur": "El nombre catalán “calceta” se refiere al anillo, que envuelve el pie como un calcetín. Vive con los pinos y se ha extendido por medio mundo con las plantaciones.", "note": "Viscoso + ANILLO que se vuelve violáceo.", "conf": [{"t": "Sin anillo, con poros que sueltan gotitas. Aceptable."}, {"t": "Más pequeño, con poros pardo rojizos, sin anillo y con la base del pie amarilla. Muy picante."}]}, "pebreta": {"nom": "Boleto picante", "alt": [], "q": null, "f": {"barret": "3–8 cm, pardo canela a pardo anaranjado, liso, algo viscoso con la humedad.", "himeni": "Poros grandes y angulosos, de color cobre a pardo rojizo. No azulean.", "peu": "Delgado, del color del sombrero, con la base amarillo limón.", "carn": "Amarillenta con tonos rojizos, amarillo vivo en la base del pie. Sabor MUY picante.", "espora": "Pardo canela"}, "hab": "Pinares y bosques con abedules, en suelos pobres y arenosos. A menudo cerca de la amanita matamoscas.", "tox": "No es un tóxico grave, pero es tan picante que estropea cualquier plato. A rechazar.", "cur": "A menudo sale junto a la amanita matamoscas: se cree que vive en parte a costa de su micelio.", "note": "Pequeño, poros color COBRE, base del pie AMARILLA.", "conf": [{"t": "Poros amarillos, no rojizos, y sabor suave. Aceptable."}, {"t": "Sombrero viscoso, poros amarillos y un anillo grande en el pie. Aceptable."}, {"t": "Mucho más grande, con sombrero blanquecino, poros rojos y carne que azulea. Tóxico."}]}, "groguet-pudent": {"nom": "Tricoloma azufrado", "alt": [], "q": null, "f": {"barret": "3–8 cm, amarillo azufre, a veces con tonos pardo rojizos en el centro. Seco y liso.", "himeni": "Láminas amarillo azufre, gruesas, espaciadas y escotadas.", "peu": "Amarillo azufre, con fibras rojizas, sin anillo.", "carn": "Amarillo azufre. Olor MUY FUERTE a gas, a alquitrán o a carbón.", "espora": "Blanca"}, "hab": "Robledales, hayedos y encinares. A veces también con coníferas.", "tox": "Ligeramente tóxico: vómitos y dolor de barriga. El mal olor hace que casi nadie se lo coma.", "cur": "El mal olor viene del escatol, la misma sustancia que da el mal olor a las heces.", "note": "Todo AMARILLO + olor a GAS.", "conf": [{"t": "Láminas apretadas y olor a harina, no a gas. También tóxica."}, {"t": "Sale en grupos sobre madera, con láminas verdosas y esporada oscura. Tóxico."}]}, "gomphidius-glutinosus": {"nom": "Gonfidio viscoso", "alt": [], "q": "Bueno", "f": {"barret": "5–12 cm, gris pardo con tonos violáceos, muy viscoso. Convexo y después plano, a menudo con un pequeño mamelón.", "himeni": "Láminas decurrentes y espaciadas, blanquecinas de jóvenes y después grises, hasta casi negras. Se separan fácilmente de la carne.", "peu": "Blanco arriba y amarillo vivo en la base, cubierto de mucosidad. Tiene una zona de anillo débil que se ennegrece.", "carn": "Blanca, amarilla en la base del pie. Olor y sabor suaves.", "espora": "Pardo negruzco"}, "hab": "Coníferas de montaña en lugares húmedos: pinares de pino silvestre, abetales y plantaciones de pícea, entre el musgo y la hierba.", "tox": "Quita la cutícula viscosa antes de cocinarla. Haz la esporada: debe ser oscura, casi negra, no marrón óxido.", "cur": "Tiene láminas, pero es pariente de las setas con poros, como los boletos granulados. Por eso las láminas se separan tan fácilmente del sombrero.", "note": "Base del pie AMARILLA. Esporada oscura.", "conf": [{"t": "Láminas blancas que no se oscurecen y esporada BLANCA. Muy buena."}, {"t": "Sombrero color cobre, carne naranja y vive bajo pinos. Comestible."}, {"t": "También es viscoso, pero bajo el sombrero tiene poros, no láminas. Comestible."}, {"name": "Cortinarius viscosos", "t": "También son pegajosos, pero tienen cortina, láminas ocre a óxido y esporada marrón óxido. Los hay tóxicos."}]}, "paxil": {"nom": "Paxilo enrollado", "alt": [], "q": null, "f": {"barret": "5–15 cm, pardo ocre a pardo oliva, hundido en el centro. El margen queda muy enrollado hacia dentro, a menudo acanalado. Viscoso con humedad.", "himeni": "Láminas decurrentes y apretadas, amarillo ocre. Se manchan de pardo al tocarlas y se separan fácilmente de la carne.", "peu": "Corto, del color del sombrero, a menudo curvado. Se mancha de pardo al tocarlo.", "carn": "Amarillenta, se oscurece al cortarla. No suelta látex.", "espora": "Pardo óxido"}, "hab": "Bosques húmedos de frondosas y coníferas, sobre todo bajo abedules, robles y hayas, en suelos ácidos.", "tox": "Síndrome paxilínico (hemólisis inmune). Crudo o poco cocinado provoca vómitos y diarrea. El gran peligro es otro: el cuerpo puede crear defensas que destruyen sus propios glóbulos rojos. Puede pasar de repente, incluso a quien lo había comido durante años sin ningún problema, y cocinarlo no lo evita. A las pocas horas aparecen vómitos, dolor de tripa, orina oscura y anemia; después pueden fallar los riñones. Puede ser mortal. Ve a urgencias.", "cur": "Antes se comía en muchos lugares de Europa. En 1944 el micólogo alemán Julius Schäffer murió después de comerlo. El epíteto «involutus» significa enrollado, por el margen del sombrero.", "note": "Margen ENROLLADO y manchas pardas. Nunca.", "conf": [{"t": "El níscalo de sangre suelta látex rojo vino al cortarlo. El paxilo no suelta látex y sus láminas se manchan de pardo."}, {"t": "El níscalo suelta látex naranja y tiene manchas verdes. El paxilo no suelta látex."}]}, "amanita-proxima": {"nom": "Amanita próxima", "alt": [], "q": null, "f": {"barret": "6–15 cm, blanco a crema, liso. El margen no tiene restos harinosos, o tiene muy pocos.", "himeni": "Láminas blancas, libres y apretadas.", "peu": "Blanco a crema, con un anillo membranoso colgante que se mantiene. En la base, una volva en forma de saco de color ocre anaranjado a rojizo.", "carn": "Blanca.", "espora": "Blanca"}, "hab": "Encinares, robledales y pinares mediterráneos, en los mismos lugares que la oronja blanca. Es mucho menos frecuente que ella.", "tox": "Norleucina alénica, un aminoácido tóxico. Síndrome proximiano (nefrotóxico): entre 4 y 14 horas después, vómitos, diarrea y dolor de tripa. En los días siguientes fallan los riñones y a menudo hace falta diálisis. En general los riñones se recuperan en unas semanas. Ve a urgencias y explica qué has comido.", "cur": "El primer caso de intoxicación se describió en 1994. Por su culpa hoy se desaconseja comer oronjas blancas (Amanita ovoidea): las dos especies se confunden fácilmente.", "note": "Volva NARANJA rojiza + anillo que se mantiene.", "conf": [{"t": "Más grande, con el margen harinoso, un anillo cremoso que se deshace y la volva blanca u ocre pálido. Incluso los expertos las confunden: no recojas ninguna."}, {"t": "Toda blanca, también la volva. Mortal."}]}, "farinera": {"nom": "Oronja blanca", "alt": ["amanita ovoide"], "q": "Aceptable", "f": {"barret": "10–25 cm, blanco a crema, macizo. El margen tiene restos blancos del velo, como si fuera harina.", "himeni": "Láminas blancas a crema, libres y apretadas.", "peu": "Robusto, blanco y harinoso, con un anillo cremoso que se deshace pronto. En la base, una volva grande en forma de saco, blanca a ocre pálido.", "carn": "Blanca y firme. Olor fresco, algo a cloro.", "espora": "Blanca"}, "hab": "Encinares y pinares cálidos de suelo calizo, después de las lluvias de otoño. A menudo sale levantando la tierra.", "tox": "La Societat Catalana de Micologia la clasifica como comestible «aceptable», pero hoy muchos micólogos desaconsejan comerla. Se confunde fácilmente con la amanita próxima, que daña los riñones, y con amanitas blancas mortales. Se han descrito intoxicaciones renales después de comer oronjas blancas. Aprende a reconocerla, pero no la recojas para comer.", "cur": "Su nombre catalán, «farinera», viene de la «harina» blanca que le cubre el pie y el margen del sombrero: te deja los dedos blancos.", "note": "Volva BLANCA y margen harinoso. Aun así, no la comas.", "conf": [{"t": "Más pequeña, con la volva ocre anaranjada a rojiza y un anillo que se mantiene. Tóxica para los riñones."}, {"t": "Más pequeña y esbelta, con anillo colgante y volva blanca y fina. Mortal."}, {"t": "Sombrero verde oliva o blanquecino con fibras radiales, sin harina. Mortal."}]}, "amanita-gemmata": {"nom": "Amanita gemmata", "alt": [], "q": null, "f": {"barret": "3–10 cm, amarillo pálido a amarillo ocre, con placas blancas que se desprenden fácilmente. El margen está algo estriado.", "himeni": "Láminas blancas, libres y apretadas.", "peu": "Blanco, con un anillo frágil que a menudo desaparece. La base es algo bulbosa, con una volva corta en forma de collar.", "carn": "Blanca, no cambia de color. Sin olor especial.", "espora": "Blanca"}, "hab": "Pinares y hayedos, a menudo en suelos arenosos. Es de las primeras amanitas del año: sale de la primavera al otoño.", "tox": "Ácido iboténico y muscimol, en cantidad variable. Síndrome panterínico: entre 30 minutos y 3 horas, confusión, agitación, somnolencia y, a veces, alucinaciones. Puede ser grave.", "cur": "Es quizá la amanita que sale más pronto: se puede encontrar en primavera, mucho antes que las oronjas.", "note": "Amarillo pálido + placas blancas + láminas BLANCAS.", "conf": [{"t": "Sombrero naranja, láminas y pie AMARILLOS y una volva grande en forma de saco. Excelente."}, {"t": "La carne y las heridas se vuelven vinosas. Comestible solo bien cocinada."}, {"name": "Amanita citrina (oronja limón)", "t": "Bulbo grande y marginado, anillo que se mantiene y olor a patata cruda. A desechar."}, {"t": "Sombrero pardo con verrugas blancas y el mismo tipo de volva. Tóxica."}]}, "lepiota-cristata": {"nom": "Lepiota crestada", "alt": ["lepiota maloliente"], "q": null, "f": {"barret": "2–6 cm, blanco con un disco central pardo rojizo y pequeñas escamas del mismo color repartidas en círculos.", "himeni": "Láminas blancas, libres y apretadas.", "peu": "Delgado y blanquecino, a menudo rosado en la base, con un anillo frágil que desaparece pronto.", "carn": "Blanca y delgada, con un olor desagradable a goma o a gas.", "espora": "Blanca"}, "hab": "Bordes de caminos, jardines, parques, prados y bosques, en tierra rica o removida. A menudo en grupos.", "tox": "Síndrome gastrointestinal: vómitos y diarrea pocas horas después. Algunas lepiotas pequeñas parecidas tienen amatoxinas y son mortales: no comas ninguna.", "cur": "Es una de las lepiotas pequeñas más comunes. El olor a goma ayuda a reconocerla, pero no la hace menos peligrosa.", "note": "Pequeña, escamas rojizas, PESTE a goma.", "conf": [{"t": "Mucho más grande (más de 10 cm), con un anillo doble que se mueve y olor agradable."}, {"t": "Grande y robusta, con carne que enrojece y un anillo grueso que se mueve."}, {"t": "Sin escamas ni anillo, con olor a almendra amarga y el pie muy tenaz."}, {"t": "Escamas pardo vinoso y pie con bandas vinosas. Mortal."}]}, "escleroderma": {"nom": "Escleroderma amarilla", "alt": [], "q": null, "f": {"barret": "No tiene sombrero: es una bola de 4–10 cm, algo aplanada, amarillo ocre, con una piel gruesa y dura cubierta de escamas como verrugas.", "himeni": "Dentro de la bola. Cortada, es blanquecina solo de muy joven y pronto se vuelve negro púrpura con vetas blancas.", "peu": "Casi no tiene: se sujeta al suelo con unos cordones blancos.", "carn": "Firme y dura, no esponjosa. Olor desagradable, como a gas.", "espora": "Pardo oscuro (el polvo que sale cuando se rompe)"}, "hab": "Bosques de robles, castaños, abedules y pinos en suelos ácidos y arenosos; bordes de caminos y de zanjas.", "tox": "Síndrome gastrointestinal: poco después de comerla, dolor de tripa, vómitos y a veces mareo. Respirar sus esporas puede irritar los ojos y la nariz.", "cur": "Sobre la escleroderma puede crecer una seta pequeña con poros que vive de ella como parásito: Pseudoboletus parasiticus.", "note": "Bola DURA, por dentro NEGRA. No es un pedo de lobo.", "conf": [{"name": "Pedos de lobo (Lycoperdon, Calvatia)", "t": "Son blandos y esponjosos y, cortados, son blancos y uniformes por dentro. Si el interior es oscuro o jaspeado, no es un pedo de lobo."}, {"name": "Tuber melanosporum (trufa negra)", "t": "Crece enterrada, tiene la piel negra con verrugas puntiagudas y un aroma fuerte y agradable. La escleroderma sale en la superficie, es amarilla y huele mal."}, {"t": "Piel más fina, escamas pequeñas y un pie con surcos bien marcado. Tóxica."}, {"t": "Piel muy gruesa que se abre en forma de estrella. Tóxica."}]}, "inocybe-geophylla": {"nom": "Inocibe blanco", "alt": [], "q": null, "f": {"barret": "1,5–4 cm, blanco sedoso, cónico y después plano con un mamelón puntiagudo. Con la edad se vuelve ocre en el centro. Hay una forma lila.", "himeni": "Láminas apretadas, gris crema de jóvenes y después marrón arcilla.", "peu": "Delgado, blanco y sedoso, sin anillo.", "carn": "Blanca, con olor a tierra.", "espora": "Pardo tabaco"}, "hab": "Bordes de caminos, taludes y claros de bosques de frondosas y coníferas, a menudo en grupo.", "tox": "Muscarina. Síndrome muscarínico: entre 15 minutos y 2 horas, sudor, salivación y lágrimas; en dosis altas, vómitos, diarrea y visión borrosa. Peligroso en personas mayores o con problemas de corazón. Ve a urgencias.", "cur": "La forma lila (var. lilacina) hoy a menudo se considera una especie aparte, Inocybe lilacina. Las dos son tóxicas.", "note": "Blanco sedoso, mamelón, esporada MARRÓN.", "conf": [{"t": "Mucho más carnoso, de primavera, con olor a harina, láminas BLANCAS y esporada blanca."}, {"t": "Sombrero de tacto de gamuza sin mamelón, olor fuerte a harina y esporada rosa."}, {"t": "Sale en los prados, tiene el pie muy tenaz y las láminas espaciadas, que no se vuelven marrones."}, {"name": "Laccaria amethystina (lacaria amatista)", "t": "Toda lila intenso, con láminas gruesas y espaciadas. Se puede confundir con la forma lila del inocibe."}]}, "hebeloma": {"nom": "Hebeloma llorón", "alt": [], "q": null, "f": {"barret": "4–10 cm, crema a ocre claro, más oscuro en el centro, algo grasiento con humedad. Convexo y después con un mamelón ancho.", "himeni": "Láminas apretadas, blanquecinas y después marrón arcilla, con el borde blanco. Con humedad sueltan gotitas de agua que, al secarse, dejan manchas pardas.", "peu": "Blanco, sin anillo, harinoso en la parte de arriba.", "carn": "Blanca y gruesa, con olor a rábano y sabor amargo.", "espora": "Pardo óxido"}, "hab": "Bosques de frond
