// ---------- Mapa ----------
const TOWNS=['Berga','Bagà','Gósol','la Pobla de Lillet','Gironella','Puig-reig','Borredà','Saldes'];
function mapSVG(o={}){
  const nb=!!o.nb, hl=o.hl||[], sel=o.sel?+o.sel:0, mini=!!o.mini;
  let g='';
  if(nb) g+=`<defs><pattern id="hatch" width="5" height="5" patternTransform="rotate(40)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="5" stroke="#a3302a" stroke-width="1.6"/></pattern></defs>`;
  // cada zona és la suma dels seus municipis: el contorn del mateix color amaga les juntes de dins
  for(const z of Object.keys(ZONES).map(Number)){
    const on = sel ? z===sel : (hl.length? hl.includes(z) : true);
    const fill = nb ? (on?'url(#hatch)':'none') : `var(--z${z})`;
    const op = nb ? 1 : (on ? (sel||hl.length? .95 : .85) : .28);
    g+=`<path d="${MAP.zones[z]}" fill="${fill}" fill-opacity="${op}" stroke="${nb?'none':`var(--z${z})`}" stroke-opacity="${op}" stroke-width="1.2" stroke-linejoin="round" ${o.pick?`class="zp zpk" data-kzone="${z}" role="button" tabindex="0" aria-label="${ZONES[z].name}" aria-pressed="${z===sel}"`:''}${o.interactive?`class="zp" data-zone="${z}" role="button" tabindex="0" aria-label="${ZONES[z].name}" aria-pressed="${z===sel}"`:''}/>`;
  }
  if(!mini) g+=`<g pointer-events="none">${Object.values(MAP.munis).map(p=>`<path d="${p}" fill="none" stroke="${nb?'#3a2e24':'var(--map-muni)'}" stroke-width="${nb?.7:.5}" opacity="${nb?.6:1}"/>`).join('')}</g>`;
  if(!mini){
    g+=`<g pointer-events="none" font-family="${nb?'var(--f-hand)':'var(--f-ui)'}" font-size="${nb?15:10.5}" fill="${nb?'#24263a':'var(--fg)'}">`;
    for(const t of TOWNS){ const [x,y]=MAP.cent[t]; const end=x>MAP.w-60; g+=`<circle cx="${x}" cy="${y}" r="2.2" fill="${nb?'#24263a':'var(--fg)'}"/><text x="${end?x-4:x+4}" y="${y-3}" text-anchor="${end?'end':'start'}" paint-order="stroke" stroke="${nb?'#efe5c9':'var(--surface)'}" stroke-width="3" stroke-linejoin="round">${t==='la Pobla de Lillet'?'la Pobla':t}</text>`; }
    g+=`</g>`;
  }
  if(o.pt) g+=`<circle cx="${o.pt[0]}" cy="${o.pt[1]}" r="${mini?14:9}" fill="#bb2630" stroke="#fff" stroke-width="${mini?5:3}"/>`;
  const f=nb?' filter="url(#rough)"':'';
  return `<svg class="map ${mini?'mini':''}" viewBox="0 0 ${MAP.w} ${MAP.h}" role="${o.interactive||o.pick?'group':'img'}" aria-label="${tr('Mapa de les zones del Berguedà')}"><g${f}>${g}</g></svg>`;
}
function zoneNames(s){ return s.z.map(z=>ZONES[z].name).join(', '); }
// Cites publicades al Berguedà (GBIF i FungaCAT, vegeu cites_gbif.mjs). Les zones són orientatives: sense cites no vol dir que no hi sigui.
function citesHTML(s, nb){
  if(typeof CITES==='undefined' || !CITES[s.id]) return '';
  const n=Object.values(CITES[s.id]).reduce((a,b)=>a+b,0);
  const t = n ? (n===1?tr('1 cita publicada al Berguedà'):tr('{n} cites publicades al Berguedà',{n})) + ' (GBIF i FungaCAT).'
              : tr('No hem trobat cites publicades al Berguedà (GBIF i FungaCAT). No vol dir que no hi sigui: les zones són orientatives.');
  return `<small class="cites${nb?' nbc':''}">${t}</small>`;
}
function tests(s){
  const g=s.sci.split(' ')[0], out=[{k:tr('Esporada'),reag:'espora',what:tr('Ha de sortir {x}.',{x:s.f.espora.toLowerCase()})}];
  if(g==='Lactarius') out.push({k:tr('Làtex'),what:s.f.carn,note:tr('sense reactiu')});
  if(g==='Boletus'||g==='Rubroboletus'){ out.push({k:tr('Tall de la carn'),what:s.id==='matagent'?tr('La carn blaveja en tallar-la.'):tr('La carn no canvia de color en tallar-la.'),note:tr('sense reactiu')}); out.push({k:tr('KOH i amoníac'),reag:'koh',what:tr('S’usen amb bolets de porus, però no tenim cap reacció contrastada per a aquesta espècie.')}); }
  if(g==='Agaricus') out.push({k:tr('Base del peu'),what:tr('Talla o frega la base del peu: si es torna groc cromo al moment i fa olor de tinta, és la bola de neu pudent (tòxica).'),note:tr('sense reactiu')});
  if(g==='Amanita') out.push({k:tr('Base del peu'),what:tr('Arrenca’l sencer i busca la volva, que sovint queda colgada.'),note:tr('sense reactiu')});
  (s.re||[]).forEach(r=>out.push({k:REAG[r.r].name,reag:r.r,what:`${r.tissue}: ${r.res}`}));
  if(g==='Russula' && !s.re) out.push({k:tr('Sulfat de ferro'),reag:'feso4',what:tr('Útil amb les rússules, però no tenim la reacció contrastada per a aquesta espècie.')});
  return out;
}
function testsHTML(s,nb){
  const t=tests(s);
  if(nb) return `<div class="card-idx"><p><b>${tr('PROVES QUE POTS FER')}</b></p>${t.map(x=>`<p>${esc(x.k)}${x.note?` (${x.note})`:''} → ${esc(x.what)}${x.reag?` <a href="#r-${x.reag}" data-reag="${x.reag}">${tr('com?')}</a>`:''}</p>`).join('')}<p><i>${tr('Cap prova diu si es pot menjar.')}</i></p></div>`;
  return `<section><h2>${tr('Proves que pots fer')}</h2><div class="box tests">${t.map(x=>`<div><b>${esc(x.k)}</b>${x.note?` <small>· ${x.note}</small>`:''}<br>${esc(x.what)}${x.reag?` <a href="#r-${x.reag}" data-reag="${x.reag}">${tr('Com es fa')}</a>`:''}</div>`).join('')}<p class="muted">${tr('Cap prova diu si un bolet es pot menjar.')}</p></div></section>`;
}

// ---------- Ajudants ----------
function season(mes){
  if(mes.length===12) return tr('tot l’any');
  const runs=[]; let s=null,p=null; mes.slice().sort((a,b)=>a-b).forEach(x=>{ if(s===null){s=p=x;} else if(x===p+1){p=x;} else {runs.push([s,p]); s=p=x;} }); runs.push([s,p]);
  return runs.map(([a,b])=>a===b?MESOS[a-1]:tr('{a} a {b}',{a:MESOS[a-1],b:MESOS[b-1]})).join(' '+tr('i')+' ');
}
const pill = sp => `<span class="pill c-${sp.cat}"><i aria-hidden="true">${CATS[sp.cat].icon}</i>${CATS[sp.cat].short}</span>`;
const commons = sp => `https://commons.wikimedia.org/w/index.php?search=${encodeURIComponent(sp.sci)}&title=Special:MediaSearch&type=image`;
const inSeason = sp => sp.mes.includes(NOW);
// Perill de cada categoria. La nota diu «Compte!» només si algun bolet amb què es confon és més perillós que aquest;
// si és un tòxic que es confon amb comestibles, diu «Se sol confondre amb…»; entre comestibles, «També pot ser…».
const RISK = { exc:0, com:0, pre:1, reb:2, tox:3, mor:4 };
function confRisk(s){ return s.conf.some(c=>{ const k = c.id ? BY_ID[c.id].cat : c.cat; return k ? RISK[k]>RISK[s.cat] : RISK[s.cat]<3; }); }
function confHTML(c, nb, s){
  const t = c.id ? BY_ID[c.id] : null;
  const name = t ? `${t.ca}${nb?'':` · ${CATS[t.cat].short}`}` : c.name;
  const cmp = t && s ? `data-cmp="${s.id}" data-cmp-with="${t.id}"` : '';
  if(nb) return `<li>${t?`<a href="#${t.id}" data-open="${t.id}">${esc(t.ca)}</a> <span style="font-family:var(--f-type);font-size:.8rem">(${CATS[t.cat].short.toUpperCase()})</span>`:`<b>${esc(c.name)}</b>`}: ${esc(c.t)}${cmp?` <button class="cmpl" ${cmp}>${tr('→ compara’ls')}</button>`:''}</li>`;
  return t ? `<div class="cf"><a href="#${t.id}" data-open="${t.id}"><b>${esc(name)}</b>${esc(c.t)}</a>${cmp?`<button class="btn cmpb" ${cmp}>${tr('Compara’ls')}</button>`:''}</div>` : `<div><b>${esc(name)}</b>${esc(c.t)}</div>`;
}
const REAG = Object.fromEntries(REAGENTS.map(r=>[r.id,r]));

function goTab(id){

function filtered(){
  const q=state.q.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const found=foundCount();
  return SPECIES.filter(s=>{
    if(state.mine && !found[s.id]) return false;
    if(state.cat==='comestibles' && !['exc','com'].includes(s.cat)) return false;
    if(state.cat!=='tots' && state.cat!=='comestibles' && s.cat!==state.cat) return false;
    if(state.now && !inSeason(s)) return false;
    if(state.hab && !s.arb.includes(state.hab)) return false;
    if(state.soil){ const o=soilOf(s); if(!o || !(o.sol===state.soil || o.sol==='indiferent')) return false; }
    if(state.zone && !s.z.includes(+state.zone)) return false;
    if(q){ const hay=[s.ca,...s.alt,s.sci,s.es].join(' ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); if(!hay.includes(q)) return false; }
    return true; });
}

  return { found, n:ids.length, year, nYear:yearIds.size, zones, months,
    bad:ids.filter(id=>!isFood(BY_ID[id])).length, food:ids.filter(id=>isFood(BY_ID[id])).length,

// ---------- Celebració d'una insígnia nova (pantalla completa) ----------
const SEEN_KEY = KEY+':insignies';
const badgesEarned = () => { const t=myStats(); return BADGES.filter(b=>b.ok(t)).map(b=>b.id); };
function badgesSeen(){ try{ return JSON.parse(localStorage.getItem(SEEN_KEY)||'null'); }catch(e){ return null; } }
function badgesMark(ids){ try{ localStorage.setItem(SEEN_KEY, JSON.stringify([...new Set(ids)])); }catch(e){} }
// celebrate=false: només apunta les guanyades (primer cop, o el que arriba del núvol) sense festa
function badgesCheck(celebrate){
  const now=badgesEarned(), seen=badgesSeen();
  if(!seen || !celebrate){ badgesMark([...(seen||[]), ...now]); return; }
  const fresh=now.filter(id=>!seen.includes(id)); badgesMark([...seen, ...now]);
  if(fresh.length) celebrate_(fresh);
}
const CEL = { queue:[], raf:0, replay:false };
function celebrate_(ids, replay){ CEL.replay=!!replay; CEL.queue.push(...ids); if(!$('#cel')) celShow(); }
function celShow(){
  const id=CEL.queue.shift(), b=BADGES.find(x=>x.id===id); if(!b){ celClose(); return; }
  let el=$('#cel'); const fresh=!el;
  if(fresh){ el=document.createElement('div'); el.id='cel'; el.className='cel'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-labelledby','cel-t'); document.body.appendChild(el); }
  const more=CEL.queue.length;
  el.innerHTML=`<canvas class="cel-conf" aria-hidden="true"></canvas><div class="cel-rays" aria-hidden="true"></div>
   <div class="cel-box"><p class="cel-kick">${CEL.replay?tr('La teva insígnia'):tr('Insígnia nova!')}</p>
    <div class="cel-badge"><span class="cel-spark s1">✦</span><span class="cel-spark s2">✦</span><span class="cel-spark s3">✦</span><span class="cel-spark s4">✦</span><span class="bc">${badgeSVG(b.ic)}</span></div>
    <h2 id="cel-t">${b.name}</h2><p class="cel-desc">${b.desc}</p>
    <button class="btn solid cel-ok" data-cel-ok>${more?tr('Següent ({n} més)',{n:more}):CEL.replay?tr('Tanca'):tr('Genial!')}</button>
    ${more||CEL.replay?'':`<button class="linkbtn cel-all" data-cel-all>${tr('Veure totes les insígnies')}</button>`}</div>`;
  el.classList.remove('in'); void el.offsetWidth; el.classList.add('in');
  document.body.style.overflow='hidden';
  try{ navigator.vibrate && navigator.vibrate([40,60,40,60,90]); }catch(e){}
  setTimeout(()=>el.querySelector('[data-cel-ok]')?.focus({preventScroll:true}),400);
  celConfetti(el.querySelector('.cel-conf'));
}
function celClose(){ cancelAnimationFrame(CEL.raf); const el=$('#cel'); if(el){ el.classList.add('out'); setTimeout(()=>el.remove(),250); } if($('#sheet').hidden) document.body.style.overflow=''; }
function celConfetti(cv){
  cancelAnimationFrame(CEL.raf);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dpr=Math.min(2,devicePixelRatio||1), W=cv.width=innerWidth*dpr, H=cv.height=innerHeight*dpr, g=cv.getContext('2d');
  const cols=['#ffd766','#d9a520','#f4ecd8','#8cc49a','#5d9a6c','#c9743a','#8a5530'];
  const P=[...Array(160)].map((_,i)=>{ const a=-Math.PI/2+(Math.random()-.5)*1.9, v=(9+Math.random()*12)*dpr;
    return { x:W/2, y:H*.42, vx:Math.cos(a)*v, vy:Math.sin(a)*v, r:(3+Math.random()*5)*dpr, c:cols[i%cols.length], rot:Math.random()*6, vr:(Math.random()-.5)*.4, shape:i%3, delay:i<80?0:12+Math.random()*20 }; });
  let t=0;
  const step=()=>{ t++; g.clearRect(0,0,W,H); let alive=0;
    for(const p of P){ if(t<p.delay) { alive++; continue; }
      p.vy+=.32*dpr; p.vx*=.985; p.vy*=.985; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      if(p.y<H+20*dpr){ alive++; g.save(); g.translate(p.x,p.y); g.rotate(p.rot); g.fillStyle=p.c;
        if(p.shape===0) g.fillRect(-p.r,-p.r*.45,p.r*2,p.r*.9);
        else if(p.shape===1){ g.beginPath(); g.arc(0,0,p.r*.6,0,7); g.fill(); }
        else { g.beginPath(); g.ellipse(0,0,p.r*1.1,p.r*.45,0,0,7); g.fill(); }
        g.restore(); } }
    if(alive && t<420) CEL.raf=requestAnimationFrame(step); else g.clearRect(0,0,W,H); };
  CEL.raf=requestAnimationFrame(step);
}

const CMP = { back:'', scroll:0, key:false }; // key: s'ha obert des de la clau guiada
const CMPQ = () => ({ lloc:tr('On creix'), sub:tr('Sota el barret'), col:tr('Color del barret'), hc:tr('Color de làmines o porus'),
  anell:tr('Anell'), volva:tr('Volva'), lat:tr('Làtex'), tinta:tr('Es desfà en tinta'), olor:tr('Olor'), tall:tr('Carn tallada'), esp:tr('Esporada') });
function cmpTraits(s){ const q=KEYQ, out={};
  for(const k of Object.keys(CMPQ())){ const v=tv(s,k); if(v===undefined) continue;
    const opts=(q.find(x=>x.k===k)||{o:[]}).o; out[k]={v:[].concat(v), l:[].concat(v).map(x=>(opts.find(o=>o[0]===x)||[x,x])[1]).join(' · ')}; }
  return out; }
function openCompare(aId, bId){

  const same=k=>ta[k].v.length===tb[k].v.length && ta[k].v.every(x=>tb[k].v.includes(x));
  const differs=k=>!ta[k].v.some(x=>tb[k].v.includes(x));
  const keys=Object.keys(Q).filter(k=>ta[k]&&tb[k]&&!same(k));

  const row=(lb,x,y,cls='')=>`<div class="cmp-tr ${cls}"><span class="lb">${lb}${cls.includes('diff')?` <i>${tr('diferent')}</i>`:''}</span><span class="ca"><b class="who">${esc(A.ca)}</b>${x}</span><span class="cb"><b class="who">${esc(B.ca)}</b>${y}</span></div>`;

  el.innerHTML=`<div class="bar"><button class="back" id="back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>${tr('Tornar')}</button><span class="muted" style="font-size:.85rem">${tr('Comparació')}</span></div>
   <div class="body"><article class="cmp">
    <h1 id="sheet-title">${tr('{a} o {b}?',{a:esc(A.ca),b:esc(B.ca.charAt(0).toLowerCase()+B.ca.slice(1))})}</h1>
    <div class="cmp-hd">${head(A)}${head(B)}</div>
    <div class="cmp-names" aria-hidden="true"><span class="ca">${esc(A.ca)}</span><span class="cb">${esc(B.ca)}</span></div>
    ${c?`<div class="${danger?'danger-line':'warn-line'} cmp-key"><b>${tr('La diferència clau')}</b> ${esc(c.t)}</div>`:''}
    <section><h2>${tr('El que els diferencia')} ${nd?`<small class="muted">${nd===1?tr('1 diferència clara'):tr('{n} diferències clares',{n:nd})}</small>`:''}</h2>
     ${keys.length?`<div class="cmp-t">${keys.map(k=>row(Q[k], esc(ta[k].l), esc(tb[k].l), differs(k)?'diff':'')).join('')}</div>`:''}
     ${nd?'':`<p class="muted">${tr('Amb aquestes preguntes no se separen bé: fixa’t en la descripció i fes-ne l’esporada.')}</p>`}</section>
    <section><h2>${tr('Com són')}</h2><div class="cmp-t">
     ${[[tr('Barret'),A.f.barret,B.f.barret],[tr('Làmines, porus o plecs'),A.f.himeni,B.f.himeni],[tr('Peu'),A.f.peu,B.f.peu],[tr('Carn, olor i làtex'),A.f.carn,B.f.carn],[tr('Esporada'),A.f.espora,B.f.espora],
       [tr('On i quan'),`${A.hab} ${tr('Temporada: {s}',{s:season(A.mes)})}.`,`${B.hab} ${tr('Temporada: {s}',{s:season(B.mes)})}.`]]
       .filter(([,x,y])=>x.trim().toLowerCase()!==y.trim().toLowerCase()).map(([l,x,y])=>row(l,esc(x),esc(y))).join('')}
     ${row(tr('Comestibilitat'),edib(A),edib(B),'edib')}</div></section>
    <p class="danger-line" style="margin:0"><b>${tr('Si tens el més mínim dubte entre tots dos, no el mengis.')}</b> ${tr('Porta’l sencer a una persona experta.')}</p>
   </article></div>`;
  el.dataset.view='cmp'; el.hidden=false; el.scrollTop=0; document.body.style.overflow='hidden';
  $('#back').addEventListener('click',closeSheet); $('#back').focus({preventScroll:true});
  $('.cmp-names').style.top=$('#sheet .bar').offsetHeight+'px'; // els noms queden fixos sota la barra
  NAV.sheetHash=CMP.key?'#identifica':'#'+(CMP.back||aId); navSync();
}

// L'app nova es baixa en segon pla; quan està a punt, la pàgina es recarrega sola (vegeu build_pwa.py).
async function checkUpdate(){
  const m=$('#upd-msg'), say=t=>{ if(m) m.textContent=t; };
  if(!navigator.onLine){ say(tr('Cal connexió per buscar actualitzacions.')); return; }
  say(tr('Buscant…'));
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    if(!reg){ say(tr('Recarrega la pàgina per activar les actualitzacions.')); return; }
    await reg.update();
    const nw=reg.installing||reg.waiting;
    if(nw){ say(tr('Hi ha una versió nova. S’està baixant; l’app es recarregarà sola en uns segons.')); if(reg.waiting) reg.waiting.postMessage('skip'); }
    else say(tr('Ja tens l’última versió.'));
  }catch(e){ say(tr('No s’ha pogut comprovar. Torna-ho a provar amb connexió.')); }
}

// Quan no ets a la pantalla d'inici (Bolets sense cap fitxa oberta) hi ha una entrada «guarda» a l'historial.
// En tirar enrere, l'app puja un nivell (tanca la fitxa, o torna a Bolets) en lloc de sortir.
// El scroll el gestiona l'app: el navegador no l'ha de restaurar pel seu compte en tirar enrere

const NAV = { guard:false, ignore:0, hash:'#bolets', sheetHash:'', timer:null, scroll:{} };
// Torna a pintar sense perdre el punt de scroll
const keepScroll = fn => { const y=window.scrollY; fn(); window.scrollTo(0,y); };
const navRoot = () => $('#sheet').hidden && state.tab==='bolets';
function navSync(){ clearTimeout(NAV.timer); NAV.timer=setTimeout(()=>{
  const want=!navRoot(), url = (!$('#sheet').hidden && NAV.sheetHash) || ('#'+(state.tab==='bergueda'&&state.areaTab==='experts'?'experts':state.tab));
  if(want && !NAV.guard){ history.pushState({boletaire:1},'',url); NAV.guard=true; }
  else if(want) history.replaceState({boletaire:1},'',url);
  else if(NAV.guard){ NAV.guard=false; NAV.ignore++; history.back(); }
  else history.replaceState(null,'','#bolets');
},0); }
addEventListener('popstate',()=>{
  if(NAV.ignore){ NAV.ignore--; return; }
  NAV.guard=false;
  if($('#cel')){ CEL.queue.length=0; celClose(); navSync(); return; }
  const el=$('#sheet');
  if(!el.hidden){ closeSheet(); if(el.hidden && (state.tab==='perfil'||state.tab==='bolets')) keepScroll(render); }
  else if(state.tab!=='bolets'){ NAV.scroll[state.tab]=window.scrollY; state.tab='bolets'; render(); window.scrollTo(0, NAV.scroll.bolets||0); }
  navSync();
});

const IDK = { ans:{}, zone:'', month:String(NOW), photo:null, demo:-1, geo:'', guide:false, mapOpen:false, pt:null };
// --- "Localitza'm": la ubicació del mòbil es converteix a zona. No surt del dispositiu. ---
// Mateixa projecció que build_map.py; límits del Berguedà segons OpenStreetMap (relació 358838).
const GEO = { minx:1.6103518, maxx:2.0710234, miny:41.8974423, maxy:42.3233011, W:360, pad:8 };
function geoToMap(lat,lon){
  const kx=Math.cos((GEO.miny+GEO.maxy)/2*Math.PI/180), sx=GEO.W/((GEO.maxx-GEO.minx)*kx);
  return [(lon-GEO.minx)*kx*sx+GEO.pad, (GEO.maxy-lat)*sx+GEO.pad];
}
const pathRings = d => d.split('Z').filter(Boolean).map(r=>r.replace('M','').split('L').map(p=>p.split(',').map(Number)));
function inPath(d,[x,y]){ let inside=false;
  for(const r of pathRings(d)) for(let i=0,j=r.length-1;i<r.length;j=i++){ const [xi,yi]=r[i],[xj,yj]=r[j];
    if((yi>y)!==(yj>y) && x<(xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside; }
  return inside; }
function zoneAt(lat,lon){
  const p=geoToMap(lat,lon);
  for(const z in MAP.zones) if(inPath(MAP.zones[z],p)) return z;
  for(const z in MAP.zm) if(MAP.zm[z].some(m=>MAP.munis[m]&&inPath(MAP.munis[m],p))) return z;
  // a tocar d'una vora (el mapa està simplificat): la zona més propera a menys d'1 km
  let best=null, bd=1e9;
  for(const z in MAP.zones) for(const r of pathRings(MAP.zones[z])) for(const [x,y] of r){ const dd=Math.hypot(x-p[0],y-p[1]); if(dd<bd){ bd=dd; best=z; } }
  return bd<10 ? best : null;
}
function locateMe(){
  if(!navigator.geolocation){ IDK.geo=tr('Aquest navegador no pot donar la ubicació. Tria la zona a mà.'); openKey(); return; }
  IDK.geo='busy'; openKey();
  navigator.geolocation.getCurrentPosition(pos=>{
    const z=zoneAt(pos.coords.latitude,pos.coords.longitude);
    IDK.pt = z ? geoToMap(pos.coords.latitude,pos.coords.longitude) : null;
    if(z){ IDK.zone=z; IDK.geo=tr('Ets a la zona {z}: {name}. La ubicació no surt del mòbil.',{z,name:ZONES[z].name}); }
    else { IDK.zone=''; IDK.geo=tr('Sembla que no ets al Berguedà. Tria la zona a mà si vols.'); }
    openKey();
  }, err=>{
    IDK.geo = err.code===1 ? tr('No has donat permís per saber la ubicació. Tria la zona a mà.') : tr('No s’ha pogut saber la ubicació. Tria la zona a mà.');
    openKey();
  }, { enableHighAccuracy:false, timeout:15000, maximumAge:600000 });
}

const keyQs = () => KEYQ.filter(q=>q.k!=='sol' || Object.keys(SOIL).length);
function tv(s,k){
  if(k==='sol'){ const o=soilOf(s); if(!o||o.conf==='baixa') return undefined; return o.sol==='calcari'?['calcari']:o.sol==='acid'?['acid']:o.sol==='indiferent'?['calcari','acid']:undefined; }
  const t=TRAITS[s.id]||{}; let v=t[k];
  if(v===undefined){ if(k==='olor') v=['cap']; else if(k==='lat'||k==='anell'||k==='volva'||k==='tinta') v='no'; }
  return v; }
function scoreAll(){
  const res=[];
  for(const s of SPECIES){
    let m=0,x=0,hard=false; const bad=[];
    for(const q of keyQs()){
      const a=IDK.ans[q.k]; if(!a||!a.length) continue;
      const v=tv(s,q.k); if(v===undefined) continue;
      const vs=Array.isArray(v)?v:[v];
      if(a.some(o=>vs.includes(o))) m++; else { x++; bad.push(q); if(q.hard) hard=true; }
    }
    if(IDK.zone){ if(s.z.includes(+IDK.zone)) m++; else { x++; bad.push({q:tr('Zona')}); } }
    if(IDK.month){ if(s.mes.includes(+IDK.month)) m++; else { x++; bad.push({q:tr('Època de l’any')}); } }
    if(!hard) res.push({s,m,x,bad});
  }
  res.sort((p,q)=>p.x-q.x || q.m-p.m);
  return res;
}
function answeredCount(){ return Object.values(IDK.ans).filter(v=>v&&v.length).length + (IDK.zone?1:0) + (IDK.month?1:0); }
function bestNext(cands){
  const top=cands.filter(c=>c.x===0).slice(0,12); if(top.length<2) return null;
  let best=null,bv=1;
  for(const q of keyQs()){ if(IDK.ans[q.k]&&IDK.ans[q.k].length) continue;
    const vals=new Set(top.map(c=>{ const v=tv(c.s,q.k); return v===undefined?'?':[].concat(v).join('|'); }));
    vals.delete('?'); if(vals.size>bv){ bv=vals.size; best=q; } }
  return best;
}

function candHTML(c){

  return `<div class="kcand ${c.x?'off':''}">${ph(s)?`<img src="${ph(s).src}" alt="${esc(s.ca)}">`:sketch(s,false)}
    <div style="min-width:0"><b>${esc(s.ca)}</b> <i class="muted">${esc(s.sci)}</i><br>${pill(s)} <small class="muted">${tr('encaixa en {a} de {b}',{a:c.m,b:total})}</small>
    ${c.x?`<br><small class="miss">${tr('No encaixa:')} ${c.bad.map(b=>SHORTQ[b.k]||b.q).join(' · ')}</small>`:''}
    ${dang.length&&!c.x?`<br><small class="miss">${tr('Compte, es confon amb:')} ${dang.map(d=>`<a href="#${d.id}" data-open="${d.id}" data-fromkey="1">${esc(d.ca)}</a> <button class="cmpk" data-cmp="${s.id}" data-cmp-with="${d.id}">${tr('compara’ls')}</button>`).join(', ')}</small>`:''}

}
function openKey(scrollTo){
  const el=$('#sheet'); const keep = !el.hidden && el.dataset.view==='key' ? el.scrollTop : (!el.hidden && IDK.keyScroll ? IDK.keyScroll : 0);
  el.dataset.view='key';
  el.innerHTML=`<div class="bar"><button class="back" id="back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>${tr('Tornar')}</button><span class="muted" style="font-size:.85rem">${tr('Clau guiada')}</span></div><div class="body">${keyHTML()}</div>`;
  el.hidden=false; document.body.style.overflow='hidden';
  $('#back').addEventListener('click',()=>{ IDK.from=false; closeSheet(); });
  $('#kfile').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ IDK.photo=r.result; openKey(); }; r.readAsDataURL(f); });
  $('#kzone').addEventListener('change',e=>{ IDK.zone=e.target.value; IDK.geo=''; openKey(); });
  $('#kgeo').addEventListener('click',locateMe);
  $('#kguide').addEventListener('toggle',e=>{ IDK.guide=e.target.open; });
  $('#kmonth').addEventListener('change',e=>{ IDK.month=e.target.value; openKey(); });
  el.scrollTop = scrollTo==='res' ? ($('#kres').offsetTop-60) : keep;
  NAV.sheetHash='#identifica'; navSync();
}
document.addEventListener('click',e=>{
  const kb=e.target.closest('[data-kq]'); if(kb){ const q=KEYQ.find(x=>x.k===kb.dataset.kq), v=kb.dataset.kv; let cur=IDK.ans[q.k]||[];
    if(q.multi) cur = cur.includes(v)? cur.filter(x=>x!==v) : [...cur,v]; else cur = cur.includes(v)? [] : [v];
    IDK.ans[q.k]=cur; openKey(); return; }
  if(e.target.closest('[data-filt-clear]')){ e.preventDefault(); Object.assign(state,{now:false,hab:'',soil:'',zone:'',cat:'tots'}); keepScroll(render); return; }
  if(e.target.closest('[data-q-clear]')){ e.preventDefault(); state.q=''; keepScroll(render); return; }
  const kk=e.target.closest('[data-key]'); if(kk){ e.preventDefault(); const a=kk.dataset.key;
    if(a==='open'){ // des del menú lateral es pot obrir amb una troballa a mig fer
      if(findDirty() && !confirm(tr('Encara no has desat aquesta troballa. Vols sortir i perdre-la?'))) return;
      cisStopGps(); IDK.from=false; openKey(); }
    if(a==='reset'){ IDK.ans={}; IDK.zone=''; IDK.month=String(NOW); IDK.photo=null; IDK.geo=''; openKey(); $('#sheet').scrollTop=0; }
    if(a==='results') openKey('res'); return; }
  const pg=e.target.closest('[data-photoguide]'); if(pg){ e.preventDefault(); const g=$('#kguide'); g.open=true; IDK.guide=true; $('#sheet').scrollTop=g.offsetTop-60; return; }
  const dm=e.target.closest('[data-demo]'); if(dm){ IDK.demo = IDK.demo==+dm.dataset.demo ? -1 : +dm.dataset.demo; openKey(); return; }
  const df=e.target.closest('[data-demofill]'); if(df){ const d=AIDEMO[+df.dataset.demofill]; IDK.ans=JSON.parse(JSON.stringify(d.pre)); IDK.photo=PHOTOS[d.sci].src; openKey(); const el=$('#sheet'); el.scrollTop=$('#kphoto').offsetTop-60; return; }
  const fk=e.target.closest('[data-fromkey]'); if(fk){ IDK.from=true; }
},true);

// ---------- La meva llibreta: troballes amb fotos i ubicació precisa ----------
// Tot es guarda en aquest dispositiu (IndexedDB), fotos incloses. Res no s'envia enlloc.
const CIS = { list:[], ready:false, off:false, draft:null, urls:{}, watch:null };
const CIS_MAX=5;
function cisDB(){ return new Promise((ok,ko)=>{ if(!window.indexedDB) return ko(new Error('idb')); const r=indexedDB.open('llibreta-cistella',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('troballes',{keyPath:'id'}); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); }
async function cisTx(mode, fn){ const db=await cisDB(); return new Promise((ok,ko)=>{ const tx=db.transaction('troballes',mode); const req=fn(tx.objectStore('troballes'));
  tx.oncomplete=()=>ok(req?req.result:undefined); tx.onerror=()=>ko(tx.error); }); }
async function cisLoad(){
  try{ CIS.list=(await cisTx('readonly',st=>st.getAll())).filter(r=>!r.deleted).sort((a,b)=>String(b.date).localeCompare(String(a.date))); }catch(e){ CIS.off=true; }
  CIS.ready=true; if(!CIS.off && badgesSeen()===null) badgesCheck(false);
  if(state.tab==='perfil' && $('#cis-list')){ $('#cis-list').innerHTML=cisListHTML(); $('#cis-count').textContent=cisCountText(); } if(state.tab==='bolets' && $('#grid')) cards();
  const mf=$('#sheet .mynb-finds'); if(mf && BY_ID[mf.dataset.sp]) mf.innerHTML=myFindsHTML(BY_ID[mf.dataset.sp]);
}
const cisURL=(e,i)=> CIS.urls[e.id+':'+i] || (CIS.urls[e.id+':'+i]=URL.createObjectURL(e.photos[i]));
function cisForget(id){ for(const k in CIS.urls) if(k.startsWith(id+':')){ URL.revokeObjectURL(CIS.urls[k]); delete CIS.urls[k]; } }
const cisName = e => e.sp && BY_ID[e.sp] ? BY_ID[e.sp].ca : (e.name || tr('Bolet sense identificar'));
const cisWhen = d => { try{ const x=new Date(d); const m=MESOS[x.getMonth()]; if(window.I18N) return tr('{d} de {m} de {y}, {t}',{d:x.getDate(),m,y:x.getFullYear(),t:`${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}`}); return `${x.getDate()} ${/^[aeiou]/.test(m)?'d’':'de '}${m} de ${x.getFullYear()}, ${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}`; }catch(e){ return d; } };
const nowLocal = () => { const d=new Date(); return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16); };

function cisPanel(){
  return `<div class="panel"><div class="aihd"><h2>${tr('La meva llibreta')}</h2><span class="muted" id="cis-count">${cisCountText()}</span></div>
   <p class="muted">${tr('Els bolets que has trobat, amb fins a {n} fotos i el lloc exacte, i els apunts de cada fitxa.',{n:CIS_MAX})} ${tr('Es guarda només en aquest mòbil.')}</p>
   <button class="btn solid" data-find="new">${tr('Registra una troballa')}</button>
   <div id="cis-list">${cisListHTML()}</div></div>`;
}
function cisCountText(){
  if(!CIS.ready) return '';
  const ids=new Set([...CIS.list.filter(e=>e.sp&&BY_ID[e.sp]).map(e=>e.sp), ...SPECIES.filter(x=>getNote(x.id).trim()).map(x=>x.id)]);
  const n=CIS.list.length; return ids.size||n ? `${ids.size} ${ids.size===1?tr('bolet'):tr('bolets')} · ${n} ${n===1?tr('troballa'):tr('troballes')}` : '';
}
function cisRowHTML(e){
  const sp=BY_ID[e.sp], z=e.loc?zoneAt(e.loc.lat,e.loc.lon):null;
  const img = e.photos&&e.photos.length ? `<img src="${cisURL(e,0)}" alt="">` : sp&&ph(sp) ? `<img src="${ph(sp).src}" alt="">` : `<span class="noimg" aria-hidden="true"></span>`;
  return `<button class="cisrow" data-find-open="${e.id}">${img}<span><b>${esc(cisName(e))}</b><small>${cisWhen(e.date)}${z?` · ${ZONES[z].name}`:''}${e.photos&&e.photos.length?` · ${e.photos.length} ${e.photos.length===1?tr('foto'):tr('fotos')}`:''}</small></span></button>`;
}
function cisListHTML(){
  if(CIS.off) return `<p class="warn-line">${tr('Aquest navegador no deixa guardar les troballes. Prova-ho amb l’app instal·lada o amb un altre navegador. Els apunts sí que es guarden.')}</p>`;
  if(!CIS.ready) return '';
  const found=foundCount(), noted=SPECIES.filter(x=>getNote(x.id).trim()).map(x=>x.id);
  const ids=[...new Set([...CIS.list.filter(e=>e.sp&&BY_ID[e.sp]).map(e=>e.sp), ...noted])];
  const last=id=>CIS.list.filter(e=>e.sp===id).map(e=>e.date).sort().pop()||'';
  ids.sort((a,b)=>last(b).localeCompare(last(a)) || BY_ID[a].ca.localeCompare(BY_ID[b].ca,'ca'));
  const loose=CIS.list.filter(e=>!e.sp||!BY_ID[e.sp]);
  if(!ids.length && !loose.length) return `<p class="muted" style="margin:.4rem 0 0">${tr('Encara és buida. Quan trobis un bolet, obre’n la fitxa i toca «L’he trobat: registrar», o escriu-hi un apunt.')}</p>`;
  return `<div class="cis">${ids.map(id=>{ const s=BY_ID[id], mine=CIS.list.filter(e=>e.sp===id), withPh=mine.find(e=>e.photos&&e.photos.length), note=getNote(id).trim();
      const img = withPh ? `<img src="${cisURL(withPh,0)}" alt="">` : ph(s) ? `<img src="${ph(s).src}" alt="">` : `<span class="noimg" aria-hidden="true"></span>`;
      return `<button class="cisrow" data-open="${id}">${img}<span><b>${esc(s.ca)}</b> ${pill(s)}<small>${mine.length?`${mine.length} ${mine.length===1?tr('troballa'):tr('troballes')} · ${tr('darrera')} ${cisWhen(last(id)).replace(/, \d\d:\d\d$/,'')}`:tr('Només apunts')}${note?` · «${esc(note.slice(0,60))}${note.length>60?'…':''}»`:''}</small></span></button>`; }).join('')}
    ${loose.map(cisRowHTML).join('')}</div>`;
}
function locHTML(l){
  const z=zoneAt(l.lat,l.lon), q=l.acc<=10?tr('molt precisa'):l.acc<=25?tr('bona'):tr('poc precisa');
  const ll=`${l.lat.toFixed(6)}, ${l.lon.toFixed(6)}`;
  return `<div class="loc">${z||isInMap(l)?`<div class="locmap">${mapSVG({mini:true, hl:z?[+z]:[], pt:geoToMap(l.lat,l.lon)})}</div>`:''}
   <div style="min-width:0"><span class="n" style="font-size:1.05rem;user-select:all">${ll}</span> <button class="copy" data-copy="${ll}">${tr('Copia')}</button>
   <br><small>${tr('Precisió ±{acc} m ({q})',{acc:l.acc,q})}${l.alt!=null?` · ${tr('altitud {n} m',{n:l.alt})}`:''}${z?` · ${ZONES[z].name}`:''}</small>
   <br><a href="https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lon}" target="_blank" rel="noopener">${tr('Obre al mapa')}</a></div></div>`;
}
function isInMap(l){ const [x,y]=geoToMap(l.lat,l.lon); return x>0&&y>0&&x<MAP.w&&y<MAP.h; }

function cisResize(file){ return new Promise((ok,ko)=>{ const u=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{ const k=Math.min(1,1600/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>b?ok(b):ko(new Error('img')),'image/jpeg',.82); };
  im.onerror=()=>{ URL.revokeObjectURL(u); ko(new Error('img')); }; im.src=u; }); }

// --- GPS precís: escolta el senyal uns segons i es queda la lectura més precisa ---
function cisLocate(){
  const d=CIS.draft; if(!d) return;
  if(!navigator.geolocation){ d.gps={err:tr('Aquest navegador no pot donar la ubicació.')}; paintGps(); return; }
  cisStopGps(); d.gps={busy:true, best:null, start:Date.now()}; paintGps();
  CIS.watch=navigator.geolocation.watchPosition(p=>{
    if(!d.gps.busy) return;
    const c=p.coords, r={lat:c.latitude, lon:c.longitude, acc:Math.round(c.accuracy), alt:c.altitude!=null?Math.round(c.altitude):null, t:p.timestamp};
    if(!d.gps.best || r.acc<=d.gps.best.acc) d.gps.best=r;
    if(d.gps.best.acc<=5 || Date.now()-d.gps.start>90000) cisFixGps(); else paintGps();
  }, err=>{ cisStopGps(); d.gps={err: err.code===1?tr('No has donat permís per saber la ubicació.'):tr('No s’ha pogut saber la ubicació. Prova-ho en un lloc més obert.')}; paintGps(); },
  { enableHighAccuracy:true, maximumAge:0, timeout:90000 });
}
function cisStopGps(){ if(CIS.watch!=null && navigator.geolocation) navigator.geolocation.clearWatch(CIS.watch); CIS.watch=null; }
function cisFixGps(){ const d=CIS.draft; cisStopGps(); if(d && d.gps.best) d.loc=d.gps.best; if(d) d.gps={}; paintGps(); }
function paintGps(){
  const d=CIS.draft, w=$('#f-gps'); if(!w||!d) return; const g=d.gps||{};
  if(g.busy){ const b=g.best;
    w.innerHTML=`<div class="gps busy" role="status"><b>${tr('Buscant el senyal GPS…')}</b>
      ${b?`<span class="acc">±${b.acc} m</span><small>${tr('Espera que el número baixi: com més petit, més precís. Al bosc pot trigar un minut; si pots, surt a una clariana.')}</small>`:`<small>${tr('Si el mòbil et demana permís per saber on ets, accepta’l.')}</small>`}
      <div class="row">${b?`<button type="button" class="btn solid" data-gps-fix>${tr('Desa aquesta posició')}</button>`:''}<button type="button" class="btn" data-gps-stop>${tr('Atura')}</button></div></div>`; return; }
  w.innerHTML = (g.err?`<p class="warn-line">${esc(g.err)}</p>`:'')
    + (d.loc ? locHTML(d.loc)+`<button type="button" class="btn" data-gps>${tr('Torna a agafar la posició')}</button>` : `<button type="button" class="btn solid" data-gps>${tr('Agafa la posició d’ara')}</button><p class="muted" style="font-size:.82rem;margin:.3rem 0 0">${tr('Fes-ho al mateix lloc on l’has trobat. La ubicació no surt del mòbil.')}</p>`);
}

// ---------- Compte i núvol (Firebase) ----------
// Opcional. Sense compte, la llibreta viu només al mòbil. Amb compte, el mòbil continua sent la còpia principal
// i es sincronitza amb Firestore: users/{uid}/troballes/{id}, users/{uid}/fotos/{id}_{i} (foto reduïda) i users/{uid}/apunts/{bolet}.
// Quan hi ha dues versions, guanya la més recent (camp upd).
const FBV='12.19.0', FBU=m=>`https://www.gstatic.com/firebasejs/${FBV}/firebase-${m}.js`;
const CLOUD={ ok:false, fb:null, user:null, busy:false, again:false, last:0, err:'', msg:'', mode:'link', loading:false };
// Només per a proves locals: una pàgina de prova pot posar un Firebase simulat a window.__FAKE_FIREBASE.
const FAKE_FB = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && window.__FAKE_FIREBASE || null;
const cloudConfigured = () => !!FAKE_FB || (typeof FIREBASE_CONFIG!=='undefined' && !!FIREBASE_CONFIG);
const cloudAllowed = () => cloudConfigured() && /^https?:$/.test(location.protocol);
async function cloudInit(){
  if(!cloudAllowed()) return;
  CLOUD.loading=true; paintAccount();
  try{
    const [A,U,F]=FAKE_FB || await Promise.all([import(FBU('app')),import(FBU('auth')),import(FBU('firestore'))]);
    const app=A.initializeApp(FAKE_FB?{}:FIREBASE_CONFIG), auth=U.getAuth(app), db=F.getFirestore(app);
    U.useDeviceLanguage(auth);
    CLOUD.fb={U,F,auth,db}; CLOUD.ok=true;
    if(U.isSignInWithEmailLink(auth, location.href)){
      let email=''; try{ email=localStorage.getItem(KEY+':email-link')||''; }catch(e){}
      if(!email) email=(prompt(tr('Per acabar d’entrar, escriu el correu on has rebut l’enllaç:'))||'').trim();
      if(email){ try{ await U.signInWithEmailLink(auth,email,location.href); try{ localStorage.removeItem(KEY+':email-link'); }catch(e){} }catch(e){ CLOUD.err=authErr(e); } }
      history.replaceState(null,'',location.pathname+'#perfil'); goTab('perfil'); render();
    }
    try{ await U.getRedirectResult(auth); }catch(e){ CLOUD.err=authErr(e); }
    U.onAuthStateChanged(auth, u=>{ CLOUD.user=u; CLOUD.loading=false; paintAccount(); if(u) cloudSync(); });
    addEventListener('online',()=>cloudSync());
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') cloudSync(); });
  }catch(e){ CLOUD.ok=false; }
  CLOUD.loading=false; paintAccount();
}
function authErr(e){
  const m={ 'auth/invalid-email':tr('El correu no és vàlid.'), 'auth/missing-email':tr('Escriu el correu.'),
    'auth/invalid-credential':tr('Correu o contrasenya incorrectes.'), 'auth/wrong-password':tr('Correu o contrasenya incorrectes.'), 'auth/user-not-found':tr('No hi ha cap compte amb aquest correu.'),
    'auth/email-already-in-use':tr('Ja hi ha un compte amb aquest correu. Entra-hi, o recupera la contrasenya.'), 'auth/weak-password':tr('La contrasenya ha de tenir almenys 6 caràcters.'),
    'auth/missing-password':tr('Escriu la contrasenya.'), 'auth/network-request-failed':tr('No hi ha connexió. Torna-ho a provar quan en tinguis.'), 'auth/too-many-requests':tr('Massa intents seguits. Espera una mica.'),
    'auth/unauthorized-domain':tr('Aquest domini no està autoritzat al projecte de Firebase.'), 'auth/operation-not-allowed':tr('Aquesta manera d’entrar no està activada al projecte de Firebase.'),
    'auth/invalid-action-code':tr('L’enllaç ja s’ha fet servir o ha caducat. Demana’n un de nou.'), 'auth/expired-action-code':tr('L’enllaç ha caducat. Demana’n un de nou.'),
    'auth/requires-recent-login':tr('Per seguretat, surt i torna a entrar abans d’esborrar el compte.') };
  return m[e&&e.code] || tr('No s’ha pogut fer ({code}).',{code:e&&e.code||'error'});
}
async function acctDo(a){
  const {U,auth}=CLOUD.fb||{}; const email=($('#ac-email')?.value||'').trim(), pw=$('#ac-pass')?.value||'';
  CLOUD.err=''; CLOUD.msg='';
  try{
    if(a==='google'){ const p=new U.GoogleAuthProvider();
      try{ await U.signInWithPopup(auth,p); }
      catch(e){ if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(e.code)) await U.signInWithRedirect(auth,p); else if(e.code!=='auth/popup-closed-by-user' && e.code!=='auth/cancelled-popup-request') throw e; } }
    if(a==='link'){ if(!email) throw {code:'auth/missing-email'};
      await U.sendSignInLinkToEmail(auth,email,{url:location.origin+location.pathname, handleCodeInApp:true});
      try{ localStorage.setItem(KEY+':email-link',email); }catch(e){}
      CLOUD.msg=`${tr('T’hem enviat un enllaç a {email}.',{email})} ${tr('Obre’l des d’aquest mateix mòbil. Si no el veus, mira el correu brossa.')}`; }
    if(a==='in') await U.signInWithEmailAndPassword(auth,email,pw);
    if(a==='new') await U.createUserWithEmailAndPassword(auth,email,pw);
    if(a==='reset'){ if(!email) throw {code:'auth/missing-email'}; await U.sendPasswordResetEmail(auth,email); CLOUD.msg=tr('T’hem enviat un correu a {email} per canviar la contrasenya.',{email}); }
    if(a==='out'){ await U.signOut(auth); CLOUD.msg=tr('Has sortit. La llibreta continua en aquest mòbil.'); }
    if(a==='sync') await cloudSync();
    if(a==='delete') await cloudDeleteAccount();
  }catch(e){ CLOUD.err=authErr(e); }
  paintAccount();
}

async function cloudSync(){
  if(!CLOUD.user||!CLOUD.ok||!navigator.onLine) return;
  if(CLOUD.busy){ CLOUD.again=true; return; }
  CLOUD.busy=true; paintAccount();
  const {F,db}=CLOUD.fb, uid=CLOUD.user.uid, col=n=>F.collection(db,'users',uid,n), ref=(n,id)=>F.doc(db,'users',uid,n,id);
  const upd=r=>r.upd||Date.parse(r.saved||'')||0;
  try{
    const all=await cisTx('readonly',st=>st.getAll());
    const remote=new Map((await F.getDocs(col('troballes'))).docs.map(d=>[d.id,d.data()]));
    // 1. Puja el que és nou o més recent al mòbil
    for(const r of all){ const rm=remote.get(r.id);
      if(rm && (rm.upd||0)>=upd(r)) continue;
      if(!rm && r.deleted) continue;
      await cloudPush(r, rm?(rm.n||0):0); remote.set(r.id,{upd:upd(r)}); }
    // 2. Baixa el que és nou o més recent al núvol
    const local=new Map(all.map(r=>[r.id,r]));
    for(const [id,rm] of remote){ const l=local.get(id);
      if(l && upd(l)>=(rm.upd||0)) continue;
      if(rm.deleted){ if(l){ await cisTx('readwrite',st=>st.put({id,deleted:true,upd:rm.upd})); cisForget(id); } continue; }
      const photos=[];
      for(let i=0;i<(rm.n||0);i++){ const s=await F.getDoc(ref('fotos',id+'_'+i)); if(s.exists()) photos.push(new Blob([s.data().b.toUint8Array()],{type:'image/jpeg'})); }
      await cisTx('readwrite',st=>st.put({id,sp:rm.sp||'',name:rm.name||'',date:rm.date,loc:rm.loc||null,note:rm.note||'',photos,saved:rm.saved||'',upd:rm.upd}));
      cisForget(id);
    }
    // 3. Apunts de les fitxes
    const ra=new Map((await F.getDocs(col('apunts'))).docs.map(d=>[d.id,d.data()]));
    for(const s of SPECIES){ const lt=getNote(s.id), lu=getNoteUpd(s.id)||(lt?1:0), rm=ra.get(s.id);
      if(rm && (rm.upd||0)>lu) setNote(s.id, rm.t||'', rm.upd);
      else if(lu && (!rm || lu>(rm.upd||0))) await F.setDoc(ref('apunts',s.id),{t:lt,upd:lu}); }
    CLOUD.last=Date.now(); CLOUD.err='';
    try{ await F.deleteDoc(F.doc(db,'ranking',CLOUD.user.uid)); }catch(e){} // rànquing retirat: s'esborra la fila antiga, si n'hi havia
  }catch(e){ CLOUD.err = e&&e.code==='unavailable' ? tr('Sense connexió: es sincronitzarà quan en tornis a tenir.') : tr('No s’ha pogut sincronitzar ({e}).',{e:e&&(e.code||e.message)}); }
  CLOUD.busy=false; await cisLoad(); badgesCheck(false); paintAccount();
  if(CLOUD.again){ CLOUD.again=false; cloudSync(); }
}
async function cloudPush(r, prevN){
  const {F,db}=CLOUD.fb, uid=CLOUD.user.uid, ref=(n,id)=>F.doc(db,'users',uid,n,id);
  const n = r.deleted ? 0 : (r.photos||[]).length;
  for(let i=0;i<n;i++){ const small=await shrinkBlob(r.photos[i],800,.72);
    await F.setDoc(ref('fotos',r.id+'_'+i),{b:F.Bytes.fromUint8Array(new Uint8Array(await small.arrayBuffer()))}); }
  for(let i=n;i<Math.max(prevN,n);i++) await F.deleteDoc(ref('fotos',r.id+'_'+i));
  await F.setDoc(ref('troballes',r.id), r.deleted ? {deleted:true,upd:r.upd}
    : {sp:r.sp||'',name:r.name||'',date:r.date,loc:r.loc||null,note:r.note||'',n,saved:r.saved||'',upd:r.upd||Date.parse(r.saved||'')||Date.now()});
}
function shrinkBlob(b,max,q){ return new Promise((ok,ko)=>{ const u=URL.createObjectURL(b), im=new Image();
  im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(x=>x?ok(x):ko(new Error('img')),'image/jpeg',q); };
  im.onerror=()=>{ URL.revokeObjectURL(u); ko(new Error('img')); }; im.src=u; }); }
const notePending=new Set(); let noteTimer=null;
function notePushLater(id){
  if(!CLOUD.user) return; notePending.add(id); clearTimeout(noteTimer);
  noteTimer=setTimeout(async()=>{ const {F,db}=CLOUD.fb, uid=CLOUD.user&&CLOUD.user.uid; if(!uid) return;
    for(const k of [...notePending]){ notePending.delete(k); try{ await F.setDoc(F.doc(db,'users',uid,'apunts',k),{t:getNote(k),upd:getNoteUpd(k)}); }catch(e){} } }, 2500);
}
async function cloudDeleteAccount(){
  if(!confirm(tr('Vols esborrar el compte i totes les dades del núvol? No es pot desfer. El que hi ha en aquest mòbil es queda.'))) return;
  const {F,U,db}=CLOUD.fb, u=CLOUD.user, uid=u.uid;
  try{ await F.deleteDoc(F.doc(db,'ranking',uid)); }catch(e){}
  for(const n of ['fotos','troballes','apunts']){ const q=await F.getDocs(F.collection(db,'users',uid,n)); for(const d of q.docs) await F.deleteDoc(d.ref); }
  await U.deleteUser(u);
  CLOUD.msg=tr('Compte esborrat. La llibreta continua en aquest mòbil.');
}

document.addEventListener('click',e=>{
  if(e.target.closest('[data-kmap]')){ IDK.mapOpen=!IDK.mapOpen; openKey(); return; }
  const zk=e.target.closest('[data-kzone]'); if(zk){ IDK.zone = IDK.zone===zk.dataset.kzone ? '' : zk.dataset.kzone; IDK.geo=''; openKey(); return; }
  const zp=e.target.closest('.zp,.zchip'); if(zp){ state.areaZone = state.areaZone==zp.dataset.zone ? '' : zp.dataset.zone; paintZone(); return; }
  const zl=e.target.closest('[data-zonelist]'); if(zl){ state.zone=zl.dataset.zonelist; state.tab='bolets'; render(); navSync(); window.scrollTo(0,0); return; }
  const zg=e.target.closest('[data-zonego]'); if(zg){ e.preventDefault(); closeSheet(); state.areaZone=zg.dataset.zonego; goTab('bergueda'); render(); setTimeout(()=>$('#zones-panel')?.scrollIntoView({block:'start'}),30); return; }
  const rg=e.target.closest('[data-reag]'); if(rg){ e.preventDefault(); closeSheet(); goTab('coneixements'); render(); $('#k-reactius').open=true; const d=$('#r-'+rg.dataset.reag); if(d){ d.open=true; setTimeout(()=>d.scrollIntoView({block:'start'}),30); } return; }
  const fn=e.target.closest('[data-find]'); if(fn){ e.preventDefault(); openFind(null, fn.dataset.sp||''); return; }
  const fo=e.target.closest('[data-find-open]'); if(fo){ openFindView(fo.dataset.findOpen); return; }
  const fe=e.target.closest('[data-find-edit]'); if(fe){ openFind(fe.dataset.findEdit); return; }
  const fd=e.target.closest('[data-find-del]'); if(fd){ e.preventDefault(); if(fd.dataset.findDel && CIS.list.some(x=>x.id===fd.dataset.findDel)) cisDelete(fd.dataset.findDel); return; }
  const pd=e.target.closest('[data-ph-del]'); if(pd&&CIS.draft){ CIS.draft.photos.splice(+pd.dataset.phDel,1); paintPhotos(); return; }
  if(e.target.closest('[data-gps]')){ cisLocate(); return; }
  if(e.target.closest('[data-gps-fix]')){ cisFixGps(); return; }
  if(e.target.closest('[data-gps-stop]')){ const d=CIS.draft; cisStopGps(); if(d) d.gps={}; paintGps(); return; }
  const ac=e.target.closest('[data-acct]'); if(ac){ e.preventDefault(); if(CLOUD.ok) acctDo(ac.dataset.acct); return; }
  const am=e.target.closest('[data-acct-mode]'); if(am){ CLOUD.mode=am.dataset.acctMode; CLOUD.err=''; CLOUD.msg=''; paintAccount(); return; }
  if(e.target.closest('[data-cel-ok]')){ CEL.queue.length ? celShow() : celClose(); return; }
  if(e.target.closest('[data-cel-all]')){ celClose(); openBadges(); return; }
  const cr=e.target.closest('[data-cel-replay]'); if(cr){ celebrate_([cr.dataset.celReplay], true); return; }
  const gm=e.target.closest('[data-game]'); if(gm){ openBadges(); return; }
  if(e.target.closest('[data-goto-mine]')){ e.preventDefault(); closeSheet(); state.mine=true; goTab('bolets'); render(); window.scrollTo(0,0); return; }
  if(e.target.closest('[data-update]')){ checkUpdate(); return; }
  const mn=e.target.closest('[data-mine]'); if(mn){ state.mine = mn.dataset.mine==='true'; cards(); return; }
  const kn=e.target.closest('[data-know]'); if(kn){ e.preventDefault(); closeSheet(); goTab('coneixements'); render(); const d=$('#k-'+kn.dataset.know); if(d){ d.open=true; setTimeout(()=>d.scrollIntoView({block:'start'}),30); } return; }
  const ar=e.target.closest('[data-area]'); if(ar){ goTab(ar.dataset.area==='experts'?'experts':'bergueda'); render(); return; }
},true);
document.addEventListener('toggle',e=>{ if(e.target.matches && e.target.matches('[data-aiopen]')) IDK.aiOpen=e.target.open; },true);
document.addEventListener('keydown',e=>{ const zp=e.target.closest&&e.target.closest('.zp'); if(zp && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); zp.dispatchEvent(new MouseEvent('click',{bubbles:true})); } });

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]'); if(t){ e.preventDefault();
    // a la pantalla gran el menú lateral es veu amb una fitxa oberta: es tanca la fitxa (si no hi ha res per desar) i es va a la secció
    const sh=$('#sheet'); if(!sh.hidden){ IDK.from=false; closeSheet(); if(!sh.hidden) return; }
    goTab(t.dataset.tab); render(); window.scrollTo(0,0); return; }
  const cm=e.target.closest('[data-cmp]'); if(cm){ e.preventDefault(); openCompare(cm.dataset.cmp, cm.dataset.cmpWith); return; }
  const o=e.target.closest('[data-open]'); if(o){ e.preventDefault(); if($('#sheet').dataset.view==='cmp'){ if(CMP.key) IDK.from=true; CMP.back=''; CMP.key=false; } openSheet(o.dataset.open); return; }
  const c=e.target.closest('[data-copy]'); if(c){ const v=c.dataset.copy; const done=()=>{ c.textContent=tr('Copiat'); setTimeout(()=>c.textContent=tr('Copia'),1500); };
    try{ navigator.clipboard.writeText(v).then(done).catch(()=>{ c.textContent=v; }); }catch(err){ c.textContent=v; } }
});
document.addEventListener('submit',e=>{
  if(e.target.id==='ac-form'){ e.preventDefault(); if(CLOUD.ok) acctDo(CLOUD.mode==='link'?'link':'in'); } });
document.addEventListener('change',e=>{
  const g=e.target.closest('[data-pref]'); if(g && e.target.name){ prefs[e.target.name]=e.target.value; savePrefs(); if(e.target.name==='lang') location.reload(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#cel')){ CEL.queue.length=0; celClose(); return; } if(e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });

applyPrefs();
const h=location.hash.slice(1);
history.replaceState(null,'','#bolets');
if(TABS.some(t=>t.id===h&&!t.center) || OLD_TABS[h]) goTab(h);
render();
if(BY_ID[h]) openSheet(h);
if(h==='identifica') openKey();
cisLoad().then(cloudInit);
})();
