<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Aprèn a reconèixer els bolets del Berguedà. Funciona sense cobertura.">
<meta name="theme-color" content="#2e5a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Boletaire">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Llibreta Boletaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;700&family=Kalam:wght@300;400;700&family=Special+Elite&display=swap">
<style>
/* Layout: app de mòbil amb barra inferior; la fitxa s'obre a pantalla completa.
   Xassís estàndard (accessible) + dues pells de fitxa: llibreta de camp i estàndard. */
:root{
  --bg:#f2f3ee; --surface:#ffffff; --fg:#1b2119; --muted:#58614f; --line:#d5d9cc; --accent:#2e5a3a; --accent-fg:#ffffff;
  --chip:#e5e8de; --focus:#1f6feb;
  --ok:#2c7a37; --warn:#9a6511; --acrid:#b4561a; --tox:#bb2630; --mortal:#b3121c; --toxcat:#7b3fa6;
  --ok-bg:#e3f1e3; --warn-bg:#fbf0d9; --acrid-bg:#fbe6d6; --tox-bg:#fadfe0; --mortal-bg:#fbdcdc; --toxcat-bg:#f0e5f8;
  --sk-ink:#2a2f27;
  --z1:#6f93a6; --z2:#7fa46b; --z3:#c7a866; --z4:#d08a5c; --map-line:#ffffff; --map-muni:rgba(255,255,255,.55);
  --f-ui:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --f-note:"Kalam", "Segoe Print", "Comic Sans MS", cursive;
  --f-type:"Special Elite", "Courier New", monospace;
  /* Paper de la llibreta: aspecte fix en tots dos temes, escollit expressament */
  --paper:#efe5c9; --paper-2:#e6d9b6; --ink:#24263a; --pencil:#5b5043; --red-ink:#a3302a; --rule:rgba(70,105,150,.22); --margin:rgba(170,50,45,.45); --sticky:#f6e27c; --tape:rgba(214,196,150,.75);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121611; --surface:#1b2019; --fg:#e4e9dc; --muted:#a3ad98; --line:#2f362c; --accent:#8cc49a; --accent-fg:#0f1a12;
  --chip:#252b22; --focus:#79a8ff;
  --ok:#7fcf88; --warn:#e3b45a; --acrid:#ef9a5c; --tox:#f2777e; --mortal:#ff7a7a; --toxcat:#cfa6f2;
  --ok-bg:#1d2e1f; --warn-bg:#33291a; --acrid-bg:#36241a; --tox-bg:#3a1c1f; --mortal-bg:#3d1719; --toxcat-bg:#2b1f38;
  --sk-ink:#dfe4d6; --z1:#5f8ea6; --z2:#6f9a5c; --z3:#b2955a; --z4:#c07a50; --map-line:#121611; --map-muni:rgba(18,22,17,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121611; --surface:#1b2019; --fg:#e4e9dc; --muted:#a3ad98; --line:#2f362c; --accent:#8cc49a; --accent-fg:#0f1a12;
  --chip:#252b22; --focus:#79a8ff;
  --ok:#7fcf88; --warn:#e3b45a; --acrid:#ef9a5c; --tox:#f2777e; --mortal:#ff7a7a; --toxcat:#cfa6f2;
  --ok-bg:#1d2e1f; --warn-bg:#33291a; --acrid-bg:#36241a; --tox-bg:#3a1c1f; --mortal-bg:#3d1719; --toxcat-bg:#2b1f38;
  --sk-ink:#dfe4d6; --z1:#5f8ea6; --z2:#6f9a5c; --z3:#b2955a; --z4:#c07a50; --map-line:#121611; --map-muni:rgba(18,22,17,.5); color-scheme:dark }
html[data-size="gran"]{ font-size:118% }
html,body{ height:100% }
body{ background:var(--bg); color:var(--fg); font-family:var(--f-ui); font-size:1rem; line-height:1.5; -webkit-font-smoothing:antialiased }
*{ box-sizing:border-box }
button,input,select,textarea{ font:inherit; color:inherit }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; border-radius:6px }
a{ color:var(--accent) }
h1,h2,h3{ text-wrap:balance; margin:0 }
.wrap{ max-width:44rem; margin:0 auto; padding-inline:16px; padding-block:0 6.5rem }

/* Capçalera */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); border-bottom:1px solid var(--line) }
.top .in{ max-width:44rem; margin:0 auto; padding:.7rem 16px; display:flex; align-items:baseline; gap:.6rem; justify-content:space-between }
.brand{ font-family:var(--f-hand); font-size:1.75rem; font-weight:700; line-height:1; color:var(--accent) }
.where{ font-size:.82rem; color:var(--muted); letter-spacing:.04em; text-transform:uppercase }

/* Barra inferior */
.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px) }
.tabs .in{ max-width:44rem; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr) }
.tab{ background:none; border:0; padding:.55rem .25rem .6rem; display:flex; flex-direction:column; align-items:center; gap:.15rem; font-size:.78rem; color:var(--muted); cursor:pointer; min-height:3.4rem }
.tab svg{ width:1.45rem; height:1.45rem; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round }
.tab[aria-current="page"]{ color:var(--accent); font-weight:700 }

.view{ padding-top:1rem; display:grid; gap:1rem }
.lead{ color:var(--muted); margin:0 }
.safety{ display:flex; gap:.7rem; align-items:flex-start; background:var(--tox-bg); color:var(--fg); border:1px solid color-mix(in srgb,var(--tox) 35%,transparent); border-radius:12px; padding:.75rem .9rem; font-size:.93rem }
.safety b{ color:var(--tox) }
.safety .ic{ flex:0 0 auto; width:1.6rem; height:1.6rem; border-radius:50%; background:var(--tox); color:var(--surface); display:grid; place-items:center; font-weight:700 }

/* Filtres */
.search{ display:flex; align-items:center; gap:.5rem; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:.15rem .8rem }
.search input{ border:0; background:none; padding:.65rem 0; width:100%; min-width:0; outline:none }
.search svg{ width:1.2rem; height:1.2rem; stroke:var(--muted); fill:none; stroke-width:2 }
.chips{ display:flex; gap:.45rem; overflow-x:auto; padding-bottom:.2rem; scrollbar-width:none }
.chip{ flex:0 0 auto; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:.42rem .8rem; font-size:.9rem; cursor:pointer; white-space:nowrap }
.chip[aria-pressed="true"]{ background:var(--accent); color:var(--accent-fg); border-color:var(--accent) }
.row{ display:flex; gap:.6rem; flex-wrap:wrap; align-items:center }
.row select{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:.45rem .6rem; min-width:0; flex:1 1 9rem }
.toggle{ display:flex; align-items:center; gap:.45rem; font-size:.92rem; cursor:pointer; flex:1 1 9rem }
.toggle input{ width:1.15rem; height:1.15rem; accent-color:var(--accent) }
.count{ font-size:.85rem; color:var(--muted); margin:0 }

/* Llista d'espècies */
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr)); gap:.8rem }
.card{ text-align:left; cursor:pointer; border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:.6rem .6rem .75rem; display:grid; gap:.35rem; min-width:0 }
.card .sk{ width:100%; height:auto; aspect-ratio:200/210; max-width:100% }
.card .nm{ font-weight:700; font-size:1.02rem; line-height:1.2 }
.card .sc{ font-style:italic; font-size:.82rem; color:var(--muted); line-height:1.25 }
.pill{ justify-self:start; display:inline-flex; align-items:center; gap:.3rem; border-radius:999px; padding:.12rem .55rem; font-size:.78rem; font-weight:700 }
.pill i{ font-style:normal }
.c-exc,.c-com{ background:var(--ok-bg); color:var(--ok) } .c-pre{ background:var(--warn-bg); color:var(--warn) }
.c-reb{ background:var(--acrid-bg); color:var(--acrid) } .c-tox{ background:var(--toxcat-bg); color:var(--toxcat) } .c-mor{ background:var(--mortal-bg); color:var(--mortal) }
.empty{ text-align:center; padding:2rem 1rem; color:var(--muted) }

/* Targetes en mode llibreta: etiquetes d'herbari */
body[data-skin="llibreta"] .card{ background:var(--paper); color:var(--ink); border:0; border-radius:3px; box-shadow:0 1px 0 rgba(0,0,0,.08), 0 6px 14px -8px rgba(40,30,10,.45); background-image:radial-gradient(circle at 85% 12%, rgba(150,110,60,.10) 0 18%, transparent 19%) }
body[data-skin="llibreta"] .card:nth-child(3n+1){ transform:rotate(-.6deg) } body[data-skin="llibreta"] .card:nth-child(3n+2){ transform:rotate(.5deg) }
body[data-skin="llibreta"] .card .nm{ font-family:var(--f-hand); font-size:1.5rem; font-weight:700; color:var(--ink) }
body[data-skin="llibreta"] .card .sc{ font-family:var(--f-type); font-style:normal; color:var(--pencil); font-size:.76rem }
body[data-skin="llibreta"] .card .pill{ background:transparent; border:2px solid currentColor; border-radius:3px; font-family:var(--f-type); text-transform:uppercase; letter-spacing:.06em; transform:rotate(-2deg) }
body[data-skin="llibreta"] .card .pill.c-exc,body[data-skin="llibreta"] .card .pill.c-com{ color:#2f6a33 }
body[data-skin="llibreta"] .card .pill.c-pre{ color:#8a5a0c } body[data-skin="llibreta"] .card .pill.c-reb{ color:#a0501a }
body[data-skin="llibreta"] .card .pill.c-tox{ color:#6a2f8f } body[data-skin="llibreta"] .card .pill.c-mor{ color:#a3121c }

/* Fitxa (pantalla completa) */
.sheet{ position:fixed; inset:0; z-index:8; overflow-y:auto; background:var(--bg); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); -webkit-overflow-scrolling:touch }
.sheet .bar{ position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:.5rem; padding:.55rem 12px; background:var(--bg); border-bottom:1px solid var(--line) }
.back{ display:inline-flex; align-items:center; gap:.3rem; background:none; border:0; padding:.45rem .5rem; cursor:pointer; color:var(--accent); font-weight:700 }
.back svg{ width:1.2rem; height:1.2rem; stroke:currentColor; fill:none; stroke-width:2.2 }
.skin-sw{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; font-size:.8rem }
.skin-sw button{ background:var(--surface); border:0; padding:.35rem .7rem; cursor:pointer }
.skin-sw button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-fg) }
.sheet .body{ max-width:44rem; margin:0 auto; padding:1rem 16px 3rem }

/* ---------- Fitxa estàndard ---------- */
.std{ display:grid; gap:1.1rem; font-size:1.0625rem; line-height:1.6 }
.std .banner{ display:flex; align-items:center; gap:.6rem; border-radius:12px; padding:.7rem .9rem; font-weight:700; font-size:1.05rem }
.std .banner .ic{ width:2rem; height:2rem; border-radius:50%; display:grid; place-items:center; background:currentColor }
.std .banner .ic span{ color:var(--surface); font-size:1.05rem }
.std .hd{ display:grid; grid-template-columns:minmax(0,1fr) 8.5rem; gap:1rem; align-items:center }
.std .hd h1{ font-size:1.9rem; line-height:1.15 }
.std .hd .sci{ font-style:italic; color:var(--muted); margin:.1rem 0 0 }
.std .hd .oth{ font-size:.92rem; color:var(--muted); margin:.3rem 0 0 }
.std .hd .sk{ width:100%; height:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px }
.std section{ display:grid; gap:.5rem }
.std h2{ font-size:1.05rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted) }
.std dl{ margin:0; display:grid; gap:.55rem }
.std dt{ font-weight:700 }
.std dd{ margin:0 }
.std .box{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:.8rem .95rem }
.std .alert{ border-left:6px solid var(--tox); background:var(--tox-bg) }
.std .alert.care{ border-left-color:var(--warn); background:var(--warn-bg) }
.std .conf{ display:grid; gap:.55rem }
.std .conf a,.std .conf div{ display:block; text-decoration:none; color:var(--fg); background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:.65rem .85rem }
.std .conf b{ display:block }
.cal{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:3px }
.cal span{ text-align:center; font-size:.78rem; padding:.35rem 0; border-radius:6px; background:var(--chip); color:var(--muted) }
.cal span.on{ background:var(--accent); color:var(--accent-fg); font-weight:700 }
.cal span.now{ outline:2px solid var(--fg); outline-offset:1px }
.std .tags{ display:flex; flex-wrap:wrap; gap:.4rem }
.std .tags span{ background:var(--chip); border-radius:999px; padding:.15rem .6rem; font-size:.88rem }
.std table{ width:100%; border-collapse:collapse; font-size:.95rem }
.std th,.std td{ text-align:left; padding:.45rem .4rem; border-bottom:1px solid var(--line); vertical-align:top }
.std textarea{ width:100%; min-height:6rem; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:.6rem .7rem; resize:vertical }
.links{ display:flex; flex-wrap:wrap; gap:.5rem }
.btn{ display:inline-flex; align-items:center; gap:.4rem; border:1px solid var(--accent); color:var(--accent); background:transparent; border-radius:999px; padding:.45rem .9rem; font-weight:700; text-decoration:none; font-size:.92rem; cursor:pointer }

/* ---------- Fitxa llibreta de camp ---------- */
.nb{ position:relative; background-color:var(--paper); color:var(--ink); font-family:var(--f-note); font-size:1.08rem; line-height:1.9rem;
  background-image:
   radial-gradient(ellipse 120px 110px at 92% 6%, transparent 62%, rgba(120,80,30,.13) 64%, rgba(120,80,30,.06) 70%, transparent 72%),
   radial-gradient(ellipse at 10% 95%, rgba(140,100,40,.10), transparent 40%),
   linear-gradient(to bottom, transparent calc(1.9rem - 1px), var(--rule) 1.9rem);
  background-size:100% 100%, 100% 100%, 100% 1.9rem;
  border-radius:4px 10px 10px 4px; box-shadow:0 1px 0 rgba(0,0,0,.06), 0 18px 40px -22px rgba(40,25,5,.55), inset 14px 0 18px -14px rgba(70,45,10,.35);
  padding:1.9rem 1rem 2rem 2.6rem; overflow:hidden }
.nb::before{ content:""; position:absolute; top:0; bottom:0; left:1.9rem; width:2px; background:var(--margin) }
.nb .holes{ position:absolute; left:.5rem; top:1.2rem; bottom:1.2rem; width:.7rem; background:radial-gradient(circle, rgba(60,40,15,.28) 0 .32rem, transparent .36rem) 0 0/0.7rem 4.2rem repeat-y }
.nb h1{ font-family:var(--f-hand); font-size:2.7rem; line-height:2.2rem; font-weight:700; color:var(--ink); padding-right:5.5rem; margin-top:.2rem; text-decoration:underline wavy var(--red-ink) 2px; text-underline-offset:.45rem }
.nb .label{ display:inline-block; margin:.9rem 0 .2rem; font-family:var(--f-type); font-size:.86rem; line-height:1.3; background:#f8f2e2; color:#2b2b2b; padding:.25rem .55rem; transform:rotate(-1deg); box-shadow:0 1px 2px rgba(0,0,0,.18); position:relative }
.nb .label::after{ content:""; position:absolute; width:2.2rem; height:.8rem; background:var(--tape); top:-.4rem; left:40%; transform:rotate(4deg) }
.nb .oth{ font-family:var(--f-hand); font-size:1.35rem; color:var(--pencil); margin:0 }
.stamp{ position:absolute; top:1.5rem; right:.7rem; z-index:1; font-family:var(--f-type); text-transform:uppercase; letter-spacing:.03em; font-size:.8rem; line-height:1.15; text-align:center; padding:.35rem .45rem; border:3px double currentColor; border-radius:6px; transform:rotate(9deg); opacity:.85; max-width:7.4rem; mix-blend-mode:multiply;
  -webkit-mask-image:radial-gradient(circle at 30% 40%, #000 55%, rgba(0,0,0,.65) 56%, #000 70%); mask-image:radial-gradient(circle at 30% 40%, #000 55%, rgba(0,0,0,.65) 56%, #000 70%) }
.stamp.s-exc,.stamp.s-com{ color:#2f6a33 } .stamp.s-pre{ color:#8a5a0c } .stamp.s-reb{ color:#a0501a } .stamp.s-tox{ color:#6a2f8f } .stamp.s-mor{ color:#a3121c; font-size:1.05rem; border-width:4px }
.nb .plate{ position:relative; margin:1.3rem auto .6rem; width:min(15rem,82%); background:#faf5e8; padding:.6rem .6rem 1.9rem; box-shadow:0 2px 6px rgba(0,0,0,.18); transform:rotate(-2deg) }
.nb .plate::before,.nb .plate::after{ content:""; position:absolute; width:4rem; height:1.2rem; background:var(--tape); top:-.55rem }
.nb .plate::before{ left:-.8rem; transform:rotate(-28deg) } .nb .plate::after{ right:-.8rem; transform:rotate(26deg) }
.nb .plate .sk{ width:100%; height:auto; display:block }
.nb .plate figcaption{ position:absolute; bottom:.25rem; left:0; right:0; text-align:center; font-family:var(--f-hand); font-size:1.15rem; color:var(--pencil); line-height:1.5rem }
.nb .margin-note{ font-family:var(--f-hand); font-size:1.45rem; line-height:1.6rem; color:var(--red-ink); transform:rotate(-2.5deg); margin:.5rem 0 1rem .2rem; display:flex; gap:.4rem; align-items:flex-start }
.nb .margin-note svg{ flex:0 0 auto; width:2rem; height:1.6rem; stroke:var(--red-ink); fill:none; stroke-width:2; stroke-linecap:round }
.nb h2{ font-family:var(--f-hand); font-size:1.75rem; line-height:1.9rem; color:var(--red-ink); font-weight:700; margin-top:1.9rem }
.nb dl{ margin:0 }
.nb dt{ display:inline; font-family:var(--f-hand); font-size:1.35rem; color:var(--red-ink); font-weight:700 }
.nb dt::after{ content:" —" }
.nb dd{ display:inline; margin:0 } .nb dd::after{ content:""; display:block }
.nb .ncal{ display:flex; flex-wrap:wrap; gap:.15rem .35rem; font-family:var(--f-hand); font-size:1.4rem; line-height:1.9rem }
.nb .ncal span{ width:1.75rem; text-align:center; color:rgba(36,38,58,.45) }
.nb .ncal span.on{ color:var(--ink); font-weight:700; border:2px solid var(--red-ink); border-radius:52% 45% 55% 48% / 48% 55% 45% 52%; transform:rotate(-6deg) }
.nb .ncal span.now{ text-decoration:underline 2px var(--ink); text-underline-offset:3px }
.nb .sticky{ position:relative; background:var(--sticky); color:#2a2618; padding:1rem 1rem 1.1rem; margin:1.6rem .2rem 1rem; transform:rotate(-1.2deg); box-shadow:0 10px 18px -12px rgba(60,40,0,.55); line-height:1.6rem }
.nb .sticky h3{ font-family:var(--f-hand); font-size:1.6rem; line-height:1.8rem; margin-bottom:.4rem }
.nb .sticky ul{ margin:0; padding-left:1.1rem } .nb .sticky li{ margin:.35rem 0 }
.nb .sticky a{ color:#2a2618; font-weight:700; text-decoration:underline 1.5px; text-underline-offset:3px }
.nb .danger{ border:2.5px solid var(--red-ink); border-radius:12px 4px 14px 6px / 6px 14px 4px 12px; padding:.6rem .8rem; margin:1.2rem 0; color:#5c1a14; line-height:1.65rem; background:rgba(163,48,42,.05) }
.nb .danger b{ font-family:var(--f-type); text-transform:uppercase; letter-spacing:.08em; color:var(--red-ink); display:block; font-size:.95rem }
.nb .care{ border-color:#8a5a0c; color:#4f3507; background:rgba(160,110,20,.06) } .nb .care b{ color:#8a5a0c }
.nb .pencil{ color:var(--pencil); font-family:var(--f-hand); font-size:1.4rem; line-height:1.9rem }
.nb .card-idx{ background:#fbf8ef; color:#2b2b2b; font-family:var(--f-type); font-size:.86rem; line-height:1.45; padding:.7rem .8rem; margin:.8rem 0; border-top:3px solid #c76a6a; box-shadow:0 2px 5px rgba(0,0,0,.15) }
.nb .card-idx p{ margin:.25rem 0 }
.nb textarea{ width:100%; min-height:7.6rem; border:0; resize:vertical; background:linear-gradient(to bottom, transparent calc(1.9rem - 1px), var(--rule) 1.9rem) 0 0/100% 1.9rem; font-family:var(--f-hand); font-size:1.45rem; line-height:1.9rem; color:#1d3a8a; padding:0 }
.nb a{ color:#1d3a8a }
.nb .nlinks{ display:flex; flex-wrap:wrap; gap:.4rem 1rem; font-family:var(--f-hand); font-size:1.35rem }

/* Seccions informatives */
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:1rem; display:grid; gap:.6rem; min-width:0 }
.panel h2{ font-size:1.15rem }
.panel p{ margin:0 }
.panel ul{ margin:0; padding-left:1.15rem; display:grid; gap:.35rem }
/* Telèfons d'urgència: etiqueta a sobre i número sencer a sota, perquè no es parteixi al mòbil */
.kv{ display:grid; gap:.7rem }
.kv .tel{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.1rem .8rem; align-items:center }
.kv .lb{ grid-column:1/-1; font-size:.9rem; color:var(--muted) }
.kv .n{ font-size:1.35rem; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.02em; white-space:nowrap; color:var(--fg); text-decoration:none }
.copy{ border:1px solid var(--line); background:var(--chip); border-radius:8px; padding:.3rem .6rem; font-size:.85rem; cursor:pointer }
details.rg{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:.2rem 1rem }

    s+=`<rect x="${cx-nw/2-2}" y="${top}" width="${nw+4}" height="10" rx="2" fill="#1f1b18"/>`;

  }
  return s+`</svg>`;
})();

    <dt>Esporada</dt><dd>La pols d’espores que deixa caure el barret si el poses unes hores sobre un paper. El seu color separa grups sencers.</dd>
    <dt>Himeni</dt><dd>La part on es fan les espores: les làmines, els porus, els plecs o les agulles.</dd>
    <dt>Cutícula</dt><dd>La pell del barret. En alguns bolets es pela fàcilment, com a les llenegues.</dd>
    <dt>Làmines lliures, enganxades o decurrents</dt><dd>Lliures si no toquen el peu, enganxades si s’hi uneixen, i decurrents si baixen pel peu.</dd>
    <dt>Anell</dt><dd>Una mena de faldilla al peu: és el que queda del vel que tapava les làmines del bolet jove.</dd>
    <dt>Volva</dt><dd>Un sac o uns anells a la base del peu, restes del vel que embolicava tot el bolet jove. Sovint queda colgada: per això cal arrencar el bolet sencer. Moltes amanites mortals en tenen.</dd>
    <dt>Cortina</dt><dd>Fils com de teranyina entre el marge del barret i el peu. És típica dels cortinaris.</dd>
    <dt>Mamelló</dt><dd>Un bony al centre del barret.</dd>
    <dt>Escrobícules</dt><dd>Clotets de color més fosc al peu, com els del rovelló.</dd>
    <dt>Viscós</dt><dd>Enganxós quan és humit, com les llenegues i els mollerics.</dd>
    <dt>Micorriza</dt><dd>La unió entre el fong i les arrels d’un arbre. Per això cada bolet surt amb uns arbres concrets.</dd>
    <dt>Sapròfit</dt><dd>Un fong que s’alimenta de matèria morta: fusta, fullaraca o fems.</dd>
    <dt>Rotllana</dt><dd>Bolets que surten en cercle perquè el micel·li creix cap a fora des d’un punt. També en diuen cercle de bruixa.</dd>
   </dl>` },

<script>
(function(){
const MESOS = ['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
const INIT = ['G','F','M','A','M','J','J','A','S','O','N','D'];
const NOW = new Date().getMonth()+1;
const BY_ID = Object.fromEntries(SPECIES.map(s=>[s.id,s]));
const $ = (s,el=document)=>el.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- Preferències (només en aquest dispositiu) ----------
const KEY='llibreta-boletaire-v1';
let prefs = { skin:'llibreta', size:'normal', theme:'sistema' };
try{ Object.assign(prefs, JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
function savePrefs(){ try{ localStorage.setItem(KEY, JSON.stringify(prefs)); }catch(e){} applyPrefs(); }
function applyPrefs(){
  document.body.dataset.skin = prefs.skin;
  document.documentElement.dataset.size = prefs.size;
  if(prefs.theme==='sistema') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = prefs.theme==='fosc'?'dark':'light';
}
function getNote(id){ try{ return localStorage.getItem(KEY+':nota:'+id)||''; }catch(e){ return ''; } }
function setNote(id,v){ try{ localStorage.setItem(KEY+':nota:'+id,v); }catch(e){} }

// ---------- Esbossos ----------
function rng(seed){ let h=2166136261; for(const c of seed) h=Math.imul(h^c.charCodeAt(0),16777619); return ()=>{ h+=0x6D2B79F5; let t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
function sketch(sp, nb){
  const m=sp.m, R=rng(sp.id);
  const ink = nb ? '#3a2e24' : 'var(--sk-ink)';
  const sw = nb ? 1.7 : 1.3;
  const fo = nb ? 0.86 : 1;
  const P=(d,fill,extra='')=>{
    let s=`<path d="${d}" fill="${fill||'none'}" fill-opacity="${fill?fo:0}" stroke="${ink}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
    if(nb) s+=`<path d="${d}" fill="none" stroke="${ink}" stroke-width=".7" opacity=".45" transform="translate(1.1 .8)"/>`;
    return s; };
  const L=(d,c=ink,w=1,o=.6)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" opacity="${o}" stroke-linecap="round"/>`;
  let g='';
  // terra
  g += nb ? L('M22,197 C60,194 90,199 120,196 C150,194 170,198 182,196',ink,1.2,.55)+L('M40,197 l-3,-6 M48,197 l2,-7 M150,197 l-2,-6 M160,196 l3,-6 M70,198 l-1,-5',ink,1,.45)
          : `<ellipse cx="100" cy="197" rx="62" ry="5" fill="${ink}" opacity=".12"/>`;
  const capSpots=(cx,cw,rim,h,n,fn)=>{ let s=''; for(let i=0;i<n;i++){ const x=cx-cw/2+12+R()*(cw-24); const k=1-Math.pow((x-cx)/(cw/2),2); const yTop=rim-h*0.72*Math.sqrt(Math.max(k,0))+7; const y=yTop+R()*Math.max(rim-6-yTop,1); s+=fn(x,y,R()); } return s; };

  function gilled(o){
    const cx=o.cx||100, base=o.base||196, w=o.sw||20, st=o.st||106, cw=o.cw||128, ch=o.ch||56;
    const l=cx-cw/2, r=cx+cw/2, rim=st-4;
    let s='';
    // peu
    s+=P(`M${cx-w/2},${base} C${cx-w/2-2},${base-30} ${cx-w/2+2},${st+20} ${cx-w/2+2},${st} L${cx+w/2-2},${st} C${cx+w/2-2},${st+20} ${cx+w/2+2},${base-30} ${cx+w/2},${base} Z`, m.stem);
    if(nb) for(let i=0;i<5;i++){ const y=st+16+i*((base-st-24)/5); s+=L(`M${cx-w/2+2},${y+5} l5,-6`,ink,.8,.4); }
    if(o.ring) s+=P(`M${cx-w/2-3},${st+18} Q${cx},${st+24} ${cx+w/2+3},${st+18} L${cx+w/2+6},${st+28} Q${cx},${st+34} ${cx-w/2-6},${st+28} Z`, o.ringColor||m.stem);
    if(o.cortina) s+=L(`M${l+16},${rim+6} Q${cx-w/2-6},${st+22} ${cx-w/2},${st+30} M${r-16},${rim+6} Q${cx+w/2+6},${st+22} ${cx+w/2},${st+30}`,ink,.8,.5)+L(`M${cx-w/2},${st+30} q${w/2},4 ${w},0`,'#a0582b',1.4,.7);
    // làmines
    s+=P(`M${l},${rim} Q${cx},${rim-6} ${r},${rim} Q${cx},${rim+16} ${l},${rim} Z`, m.gill);
    for(let i=1;i<14;i++){ const x=l+i*(cw/14); const yy=rim+ (1-Math.pow((x-cx)/(cw/2),2))*7; s+=L(`M${x},${rim-1+ (1-Math.pow((x-cx)/(cw/2),2))*-3} L${cx+(x-cx)*.18},${yy+2}`,ink,.7,.45); }
    // barret
    let top;
    if(o.dep) top=`M${l},${rim} C${l+4},${rim-ch*.5} ${cx-cw*.28},${rim-ch*.62} ${cx},${rim-ch*.36} C${cx+cw*.28},${rim-ch*.62} ${r-4},${rim-ch*.5} ${r},${rim}`;
    else if(o.umbo) top=`M${l},${rim} C${l+4},${rim-ch*.82} ${cx-cw*.2},${rim-ch*.8} ${cx-11},${rim-ch*.82} Q${cx},${rim-ch*1.08} ${cx+11},${rim-ch*.82} C${cx+cw*.2},${rim-ch*.8} ${r-4},${rim-ch*.82} ${r},${rim}`;
    else top=`M${l},${rim} C${l+6},${rim-ch} ${r-6},${rim-ch} ${r},${rim}`;
    s+=P(top+` Q${cx},${rim-6} ${l},${rim} Z`, m.cap);
    if(o.dep) s+=P(`M${cx-cw*.3},${rim-ch*.5} Q${cx},${rim-ch*.28} ${cx+cw*.3},${rim-ch*.5}`,null);
    // detalls
    if(m.zones) for(let k=1;k<=3;k++){ const f=k/4; s+=L(`M${cx-cw/2*(1-f)+2},${rim-ch*.18*(1-f)-2} Q${cx},${rim-ch*(.42+f*.08)+8*f} ${cx+cw/2*(1-f)-2},${rim-ch*.18*(1-f)-2}`,ink,1.1,.35); }
    if(m.fibers||o.fibers) for(let i=0;i<12;i++){ const a=i/11; const x=l+10+a*(cw-20); s+=L(`M${cx+(x-cx)*.15},${rim-ch*.62} L${x},${rim-3}`,ink,.6,.35); }
    if(m.slimy) s+=L(`M${l+18},${rim-ch*.35} Q${cx-10},${rim-ch*.78} ${cx+20},${rim-ch*.74}`,'#ffffff',3,.55);
    if(m.stains) s+=capSpots(cx,cw,rim,ch,5,(x,y,q)=>`<ellipse cx="${x}" cy="${y}" rx="${4+q*5}" ry="${2+q*2}" fill="${m.stains}" opacity=".55"/>`);
    if(m.mottle) s+=capSpots(cx,cw,rim,ch,6,(x,y,q)=>`<ellipse cx="${x}" cy="${y}" rx="${6+q*8}" ry="${3+q*3}" fill="${m.mottle}" opacity=".5"/>`);
    if(m.cracked) s+=capSpots(cx,cw,rim,ch,16,(x,y,q)=>L(`M${x-4},${y} l3,-3 l4,1 l1,4 l-4,2 z`,ink,.7,.45));
    if(m.scales) s+=capSpots(cx,cw,rim,ch,o.small?10:18,(x,y,q)=>L(`M${x-3},${y-1} l3,3 l3,-3`,m.scales,1.6,.85));
    if(m.warts) s+=capSpots(cx,cw,rim,ch,15,(x,y,q)=>`<circle cx="${x}" cy="${y}" r="${2+q*2.4}" fill="#fbf8f0" stroke="${ink}" stroke-width=".6"/>`);
    if(m.hairy) for(let i=0;i<16;i++){ const x=l+4+i*(cw-8)/15; s+=L(`M${x},${rim+1} l${-1+R()*2},5`,ink,.8,.6); }
    if(m.funnel) s+=P(`M${cx-cw*.3},${rim-ch*.55} Q${cx},${rim-ch*.3} ${cx+cw*.3},${rim-ch*.55}`,null);
    return s;
  }
  function amanitaBase(){
    let s='';
    if(m.volva==='sac') s+=P('M80,196 C70,178 74,164 86,166 L90,176 L96,168 L104,176 L110,167 L114,175 C126,164 130,178 120,196 Z','#f7f4ec');
    else s+=P('M80,196 C72,180 82,166 100,166 C118,166 128,180 120,196 Z', m.stem)+ (m.volva==='rings' ? L('M80,182 Q100,188 120,182 M83,174 Q100,180 117,174',ink,1.1,.6) : L('M82,174 Q100,182 118,174',ink,2,.8));
    return s;
  }
  switch(m.t){
    case 'lam': g+=`<g transform="translate(100 196) scale(${m.scale||1}) translate(-100 -196)">`+gilled({sw:m.thick?28:20, ch:m.thick?50:56, umbo:m.umbo, fibers:m.fibers, cortina:m.cortina, ring:m.ring, ringColor:m.stem})+`</g>`; break;
    case 'ple': {
      // gírgoles: barret de costat i làmines que baixen pel peu
      const shell=(tx,ty,sc,rot)=>`<g transform="translate(${tx} ${ty}) rotate(${rot}) scale(${sc}) translate(-150 -100)">`
        +P('M150,96 C122,74 52,76 34,104 C46,124 112,126 150,110 Z', m.gill)
        +[0,1,2,3,4,5,6].map(i=>L(`M148,102 Q${110-i*6},${104+i*.5} ${46+i*9},${108+i*1.6}`,ink,.7,.45)).join('')
        +P('M150,96 C124,62 46,60 34,104 C72,90 124,88 150,96 Z', m.cap)+`</g>`;
      if(m.wood){
        g+=P('M152,30 C160,80 160,150 154,196 L188,196 C192,140 192,80 186,30 Z','#8b6a48');
        g+=L('M164,50 q4,30 0,60 M174,90 q3,30 -1,70',ink,.8,.4);
        g+=shell(156,70,.95,4)+shell(158,118,1.05,-2)+shell(156,162,.8,6);
      } else {
        g+=P('M100,196 C98,176 102,152 112,132 L126,136 C118,154 114,176 116,196 Z', m.stem);
        g+=P('M34,112 C40,96 168,88 176,104 Q150,128 120,132 Q72,136 34,112 Z', m.gill);
        for(let i=0;i<9;i++) g+=L(`M${50+i*14},${110+(i%2)} Q${100+i*3},${124} ${114+i*.8},${140+i}`,ink,.7,.45);
        g+=P('M34,112 C44,74 160,66 176,104 Q112,92 34,112 Z', m.cap);
        g+=P('M70,98 Q110,86 150,96',null);
      }
      break; }
    case 'cor': {
      // peus de rata: tronc blanc i ram de branques
      g+=P('M80,196 C76,178 82,160 90,150 L110,150 C118,160 124,178 120,196 Z', m.stem);
      const br=(x,y,a,len,d)=>{ if(d>3) return; const x2=x+Math.cos(a)*len, y2=y-Math.sin(a)*len; const w=10-d*2.2;
        g+=`<path d="M${x},${y} L${x2},${y2}" stroke="${ink}" stroke-width="${w+2}" stroke-linecap="round" opacity=".8"/><path d="M${x},${y} L${x2},${y2}" stroke="${m.cap}" stroke-width="${w}" stroke-linecap="round"/>`;
        if(d===3) g+=`<circle cx="${x2}" cy="${y2}" r="2.6" fill="${m.tips||m.cap}" stroke="${ink}" stroke-width=".5"/>`;
        br(x2,y2,a+.32+R()*.12,len*.74,d+1); br(x2,y2,a-.32-R()*.12,len*.74,d+1); };
      for(const [x,a] of [[88,2.05],[96,1.75],[104,1.4],[112,1.1]]) br(x,152,a,34,0);
      break; }
    case 'cop': {
      // bolets de tinta: barret alt en forma de campana que es desfà per baix
      g+=P('M93,196 C92,170 94,140 95,118 L105,118 C106,140 108,170 107,196 Z', m.stem);
      if(!m.short) g+=P('M92,150 Q100,154 108,150 L109,156 Q100,160 91,156 Z', m.stem);
      const cap = m.short ? 'M62,128 C56,92 70,60 100,58 C130,60 144,92 138,128 Q100,136 62,128 Z' : 'M68,130 C60,82 72,32 100,28 C128,32 140,82 132,130 Q100,138 68,130 Z';
      g+=P(cap, m.cap);
      g+=L(m.short?'M62,128 Q100,136 138,128':'M68,130 Q100,138 132,130','#1f1d1b',4,.8);
      if(m.scales) g+=capSpots(100,64,118,96,22,(x,y,q)=>L(`M${x-3},${y-2} q3,5 6,0`,m.scales,1.5,.85));
      if(m.short) for(let i=0;i<7;i++) g+=L(`M${72+i*9.5},${120} Q${76+i*8},${90} ${88+i*4},${66}`,ink,.8,.45);
      break; }
    case 'dep': g+=gilled({dep:true, sw:26, st:112, cw:132, ch:44}); break;
    case 'ama': g+=gilled({sw:20, st:100, cw:132, ch:54, ring:true, ringColor:m.ring, fibers:m.fibers})+amanitaBase(); break;
    case 'sml': g+=gilled({sw:10, st:128, cw:80, ch:34, umbo:m.umbo, ring:m.ring, ringColor:m.stem, small:true, dep:m.funnel}); break;
    case 'hyd': { let s=gilled({sw:24, st:108, cw:130, ch:46}); for(let i=0;i<22;i++){ const x=40+i*5.6; s+=L(`M${x},${104+ (1-Math.pow((x-100)/65,2))*4} l0,${5+R()*4}`,ink,1.2,.7);} g+=s; break; }
    case 'bol': {
      g+=P('M76,120 C56,150 60,190 78,196 L122,196 C140,190 144,150 124,120 Z', m.stem);
      if(m.net) for(let i=0;i<7;i++){ g+=L(`M${80+i*6},124 l6,8 l-5,8 l6,8`, m.netColor||ink, m.netColor?1.3:.8, m.netColor?.9:.4); }
      if(nb) for(let i=0;i<6;i++) g+=L(`M${70+i*3},${150+i*7} l7,-7`,ink,.8,.35);
      g+=P('M24,110 Q100,100 176,110 Q100,130 24,110 Z', m.gill);
      for(let i=0;i<26;i++){ const x=34+R()*132; const y=112+R()*7*(1-Math.pow((x-100)/76,2)); g+=`<circle cx="${x}" cy="${y}" r=".9" fill="${ink}" opacity=".45"/>`; }
      g+=P('M24,110 C26,34 174,34 176,110 Q100,100 24,110 Z', m.cap);
      if(m.rim) g+=L('M28,104 Q100,96 172,104',m.rim,4,.8);
      if(m.t==='bol') g+=L('M44,74 Q80,50 120,52',nb?'#ffffff':'#ffffff',3,.25);
      break; }
    case 'can': {
      g+=P('M40,80 Q100,94 160,80 C150,112 114,128 110,196 L90,196 C86,128 50,112 40,80 Z', m.gill);
      for(let i=0;i<9;i++){ const x=48+i*13; g+=L(`M${x},${84+ (i>0&&i<8?6:2)} Q${100+(x-100)*.45},120 ${100+(x-100)*.12},${168}`,ink,.9,.5); }
      g+=P('M40,80 Q48,70 60,76 Q72,66 86,73 Q100,64 114,72 Q128,65 140,75 Q152,70 160,80 Q100,94 40,80 Z', m.cap);
      g+=L('M66,78 Q100,70 134,78',ink,1,.4); break; }
    case 'tru': {
      const nar=m.thin?0.7:1;
      g+=P(`M58,60 Q100,76 142,60 C130,92 ${100+12*nar},124 ${100+10*nar},196 L${100-10*nar},196 C${100-12*nar},124 70,92 58,60 Z`, m.gill);
      if(m.stem!==m.gill) g+=P(`M${100-11*nar},138 C${100-11*nar},160 ${100-10*nar},180 ${100-10*nar},196 L${100+10*nar},196 C${100+10*nar},180 ${100+11*nar},160 ${100+11*nar},138 Q100,142 ${100-11*nar},138 Z`, m.stem);
      for(let i=0;i<6;i++) g+=L(`M${70+i*12},${70+i%2*2} Q${96+i*1.5},110 ${98+i*.8},${150}`,ink,.8,.35);
      g+=P('M58,60 Q66,50 78,56 Q90,46 102,54 Q116,46 126,55 Q136,50 142,60 Q100,76 58,60 Z', m.cap);
      g+=`<ellipse cx="100" cy="61" rx="26" ry="5" fill="${ink}" opacity=".55"/>`; break; }
    case 'mor': {
      g+=P('M76,132 C74,160 72,186 76,196 L124,196 C128,186 126,160 124,132 Z', m.stem);
      g+=P('M68,134 C56,96 72,50 100,30 C128,50 144,96 132,134 Q100,142 68,134 Z', m.cap);
      for(let r=0;r<6;r++){ const y=46+r*15; const hw=12+r*6.2; for(let c=0;c<4;c++){ const x=100-hw+ (c+.5)*(hw*2/4) + (r%2?3:-3); g+=`<ellipse cx="${x}" cy="${y+R()*3}" rx="${hw/5}" ry="5.5" fill="#4a3216" opacity=".45"/>`; } }
      g+=L('M100,32 C96,70 98,110 100,138 M84,46 C76,80 76,110 80,136 M116,46 C124,80 124,110 120,136',ink,1,.55); break; }
    case 'gyr': {
      g+=P('M82,122 C80,160 78,186 82,196 L118,196 C122,186 120,160 118,122 Z', m.stem);
      g+=P('M54,122 C38,92 58,62 80,66 C86,44 116,44 122,62 C146,58 164,90 148,122 Q100,134 54,122 Z', m.cap);
      g+=L('M64,104 q8,-14 18,-4 q10,10 18,-6 q10,-14 20,0 q8,12 18,2 M70,86 q10,-10 20,0 q12,8 22,-6 q8,-8 16,2 M86,70 q8,-8 14,0 q6,8 14,0',ink,1.2,.6); break; }
    case 'par': {
      g+=P('M95,196 C94,170 96,130 97,92 L103,92 C104,130 106,170 105,196 Z', m.stem);
      for(let y=130;y<190;y+=9) g+=L(`M95,${y} l5,3 l5,-3`, m.scales, 1.3, .8);
      g+=P('M88,118 Q100,122 112,118 L114,127 Q100,132 86,127 Z', '#f4efe4');
      g+=P('M10,94 Q100,86 190,94 Q100,108 10,94 Z', m.gill);
      g+=P('M10,94 C24,66 70,58 88,56 Q100,42 112,56 C130,58 176,66 190,94 Q100,86 10,94 Z', m.cap);
      g+=`<ellipse cx="100" cy="52" rx="10" ry="6" fill="${m.scales}" opacity=".9"/>`;
      g+=capSpots(100,170,90,48,34,(x,y,q)=>L(`M${x-3},${y-1} l3,3 l3,-3`,m.scales,1.6,.85)); break; }
    case 'clu': {
      g+=P('M38,196 L46,150 Q100,140 154,150 L162,196 Z','#8b6a48');
      g+=P('M46,150 Q100,140 154,150 Q100,160 46,150 Z','#b89468');
      g+=L('M70,151 Q100,146 130,151 M86,151 Q100,149 114,151',ink,.8,.5);
      const mini=(x,y,rot,sc)=>`<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc}) translate(-100 -196)">`+gilled({sw:12, st:120, cw:84, ch:34, dep:m.cap==='#e2742a', ring:m.ring, ringColor:m.stem})+`</g>`;
      g+=mini(76,150,-14,.62)+mini(124,150,12,.66)+mini(100,148,0,.78); break; }
  }
  const f = nb ? ' filter="url(#rough)"' : '';

function photoImg(s, cls){ const p=ph(s); return p ? `<img class="${cls}" src="${p.src}" alt="Foto de ${esc(s.ca)} (${esc(s.sci)})" loading="lazy">` : sketch(s, prefs.skin==='llibreta'); }

// ---------- Mapa ----------
const TOWNS=['Berga','Bagà','Gósol','la Pobla de Lillet','Gironella','Puig-reig','Borredà','Saldes'];
function mapSVG(o={}){
  const nb=!!o.nb, hl=o.hl||[], sel=o.sel?+o.sel:0, mini=!!o.mini;
  let g='';
  if(nb) g+=`<defs><pattern id="hatch" width="5" height="5" patternTransform="rotate(40)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="5" stroke="#a3302a" stroke-width="1.6"/></pattern></defs>`;
  for(const z of [1,2,3,4]){
    const on = sel ? z===sel : (hl.length? hl.includes(z) : true);
    const fill = nb ? (on?'url(#hatch)':'none') : `var(--z${z})`;
    const op = nb ? 1 : (on ? (sel||hl.length? .95 : .8) : .3);
    g+=`<path d="${MAP.zones[z]}" fill="${fill}" fill-opacity="${op}" stroke="${nb?'#3a2e24':'var(--map-line)'}" stroke-width="${nb?1.4:1}" stroke-linejoin="round" ${o.interactive?`class="zp" data-zone="${z}" role="button" tabindex="0" aria-label="${ZONES[z].name}" aria-pressed="${z===sel}"`:''}/>`;
  }
  if(!mini && !nb) g+=`<g pointer-events="none">${Object.values(MAP.munis).map(p=>`<path d="${p}" fill="none" stroke="var(--map-muni)" stroke-width=".5"/>`).join('')}</g>`;
  if(!mini){
    g+=`<g pointer-events="none" font-family="${nb?'var(--f-hand)':'var(--f-ui)'}" font-size="${nb?15:10.5}" fill="${nb?'#24263a':'var(--fg)'}">`;
    for(const t of TOWNS){ const [x,y]=MAP.cent[t]; const end=x>MAP.w-60; g+=`<circle cx="${x}" cy="${y}" r="2.2" fill="${nb?'#24263a':'var(--fg)'}"/><text x="${end?x-4:x+4}" y="${y-3}" text-anchor="${end?'end':'start'}" paint-order="stroke" stroke="${nb?'#efe5c9':'var(--surface)'}" stroke-width="3" stroke-linejoin="round">${t==='la Pobla de Lillet'?'la Pobla':t}</text>`; }
    g+=`</g>`;
  }
  if(o.pt) g+=`<circle cx="${o.pt[0]}" cy="${o.pt[1]}" r="${mini?14:9}" fill="#bb2630" stroke="#fff" stroke-width="${mini?5:3}"/>`;
  const f=nb?' filter="url(#rough)"':'';
  return `<svg class="map ${mini?'mini':''}" viewBox="0 0 ${MAP.w} ${MAP.h}" role="${o.interactive?'group':'img'}" aria-label="Mapa de les zones del Berguedà"><g${f}>${g}</g></svg>`;
}
function zoneNames(s){ return s.z.map(z=>ZONES[z].name).join(', '); }
function tests(s){
  const g=s.sci.split(' ')[0], out=[{k:'Esporada',reag:'espora',what:`Ha de sortir ${s.f.espora.toLowerCase()}.`}];
  if(g==='Lactarius') out.push({k:'Làtex',what:s.f.carn,note:'sense reactiu'});
  if(g==='Boletus'||g==='Rubroboletus'){ out.push({k:'Tall de la carn',what:s.id==='matagent'?'La carn blaveja en tallar-la.':'La carn no canvia de color en tallar-la.',note:'sense reactiu'}); out.push({k:'KOH i amoníac',reag:'koh',what:'S’usen amb bolets de porus, però no tenim cap reacció contrastada per a aquesta espècie.'}); }
  if(g==='Agaricus') out.push({k:'Base del peu',what:'Talla o frega la base del peu: si es torna groc cromo al moment i fa olor de tinta, és la bola de neu pudent (tòxica).',note:'sense reactiu'});
  if(g==='Amanita') out.push({k:'Base del peu',what:'Arrenca’l sencer i busca la volva, que sovint queda colgada.',note:'sense reactiu'});
  (s.re||[]).forEach(r=>out.push({k:REAG[r.r].name,reag:r.r,what:`${r.tissue}: ${r.res}`}));
  if(g==='Russula' && !s.re) out.push({k:'Sulfat de ferro',reag:'feso4',what:'Útil amb les rússules, però no tenim la reacció contrastada per a aquesta espècie.'});
  return out;
}
function testsHTML(s,nb){
  const t=tests(s);
  if(nb) return `<div class="card-idx"><p><b>PROVES QUE POTS FER</b></p>${t.map(x=>`<p>${esc(x.k)}${x.note?` (${x.note})`:''} → ${esc(x.what)}${x.reag?` <a href="#r-${x.reag}" data-reag="${x.reag}">com?</a>`:''}</p>`).join('')}<p><i>Cap prova diu si es pot menjar.</i></p></div>`;
  return `<section><h2>Proves que pots fer</h2><div class="box tests">${t.map(x=>`<div><b>${esc(x.k)}</b>${x.note?` <small>· ${x.note}</small>`:''}<br>${esc(x.what)}${x.reag?` <a href="#r-${x.reag}" data-reag="${x.reag}">Com es fa</a>`:''}</div>`).join('')}<p class="muted">Cap prova diu si un bolet es pot menjar.</p></div></section>`;
}

// ---------- Ajudants ----------
function season(mes){
  if(mes.length===12) return 'tot l’any';
  const runs=[]; let s=null,p=null; mes.slice().sort((a,b)=>a-b).forEach(x=>{ if(s===null){s=p=x;} else if(x===p+1){p=x;} else {runs.push([s,p]); s=p=x;} }); runs.push([s,p]);
  return runs.map(([a,b])=>a===b?MESOS[a-1]:`${MESOS[a-1]} a ${MESOS[b-1]}`).join(' i ');
}
const pill = sp => `<span class="pill c-${sp.cat}"><i aria-hidden="true">${CATS[sp.cat].icon}</i>${CATS[sp.cat].short}</span>`;
const commons = sp => `https://commons.wikimedia.org/w/index.php?search=${encodeURIComponent(sp.sci)}&title=Special:MediaSearch&type=image`;
const inSeason = sp => sp.mes.includes(NOW);
// Perill de cada categoria. La nota diu «Compte!» només si algun bolet amb què es confon és més perillós que aquest;
// si és un tòxic que es confon amb comestibles, diu «Se sol confondre amb…»; entre comestibles, «També pot ser…».
const RISK = { exc:0, com:0, pre:1, reb:2, tox:3, mor:4 };
function confRisk(s){ return s.conf.some(c=>{ const k = c.id ? BY_ID[c.id].cat : c.cat; return k ? RISK[k]>RISK[s.cat] : RISK[s.cat]<3; }); }
function confHTML(c, nb){
  const t = c.id ? BY_ID[c.id] : null;
  const name = t ? `${t.ca}${nb?'':` · ${CATS[t.cat].short}`}` : c.name;
  if(nb) return `<li>${t?`<a href="#${t.id}" data-open="${t.id}">${esc(t.ca)}</a> <span style="font-family:var(--f-type);font-size:.8rem">(${CATS[t.cat].short.toUpperCase()})</span>`:`<b>${esc(c.name)}</b>`}: ${esc(c.t)}</li>`;
  return t ? `<a href="#${t.id}" data-open="${t.id}"><b>${esc(name)}</b>${esc(c.t)}</a>` : `<div><b>${esc(name)}</b>${esc(c.t)}</div>`;
}
const REAG = Object.fromEntries(REAGENTS.map(r=>[r.id,r]));

function filtered(){
  const q=state.q.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  return SPECIES.filter(s=>{
    if(state.cat==='comestibles' && !['exc','com'].includes(s.cat)) return false;
    if(state.cat!=='tots' && state.cat!=='comestibles' && s.cat!==state.cat) return false;

    if(state.hab && !s.arb.includes(state.hab)) return false;
    if(state.zone && !s.z.includes(+state.zone)) return false;

const IDK = { ans:{}, zone:'', month:String(NOW), photo:null, demo:-1, geo:'', guide:false };
// --- "Localitza'm": la ubicació del mòbil es converteix a zona. No surt del dispositiu. ---
// Mateixa projecció que build_map.py; límits del Berguedà segons OpenStreetMap (relació 358838).
const GEO = { minx:1.6103518, maxx:2.0710234, miny:41.8974423, maxy:42.3233011, W:360, pad:8 };
function geoToMap(lat,lon){
  const kx=Math.cos((GEO.miny+GEO.maxy)/2*Math.PI/180), sx=GEO.W/((GEO.maxx-GEO.minx)*kx);
  return [(lon-GEO.minx)*kx*sx+GEO.pad, (GEO.maxy-lat)*sx+GEO.pad];
}
const pathRings = d => d.split('Z').filter(Boolean).map(r=>r.replace('M','').split('L').map(p=>p.split(',').map(Number)));
function inPath(d,[x,y]){ let inside=false;
  for(const r of pathRings(d)) for(let i=0,j=r.length-1;i<r.length;j=i++){ const [xi,yi]=r[i],[xj,yj]=r[j];
    if((yi>y)!==(yj>y) && x<(xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside; }
  return inside; }
function zoneAt(lat,lon){
  const p=geoToMap(lat,lon);
  for(const z in MAP.zones) if(inPath(MAP.zones[z],p)) return z;
  for(const z in MAP.zm) if(MAP.zm[z].some(m=>MAP.munis[m]&&inPath(MAP.munis[m],p))) return z;
  // a tocar d'una vora (el mapa està simplificat): la zona més propera a menys d'1 km
  let best=null, bd=1e9;
  for(const z in MAP.zones) for(const r of pathRings(MAP.zones[z])) for(const [x,y] of r){ const dd=Math.hypot(x-p[0],y-p[1]); if(dd<bd){ bd=dd; best=z; } }
  return bd<10 ? best : null;
}
function locateMe(){
  if(!navigator.geolocation){ IDK.geo='Aquest navegador no pot donar la ubicació. Tria la zona a mà.'; openKey(); return; }
  IDK.geo='busy'; openKey();
  navigator.geolocation.getCurrentPosition(pos=>{
    const z=zoneAt(pos.coords.latitude,pos.coords.longitude);
    if(z){ IDK.zone=z; IDK.geo=`Ets a la zona ${z}. La ubicació no surt del mòbil.`; }
    else { IDK.zone=''; IDK.geo='Sembla que no ets al Berguedà. Tria la zona a mà si vols.'; }
    openKey();
  }, err=>{
    IDK.geo = err.code===1 ? 'No has donat permís per saber la ubicació. Tria la zona a mà.' : 'No s’ha pogut saber la ubicació. Tria la zona a mà.';
    openKey();
  }, { enableHighAccuracy:false, timeout:15000, maximumAge:600000 });
}

Regles: com a màxim 3 candidats, ordenats de més a menys probable; inclou sempre un candidat tòxic o mortal si s'hi pot confondre. No diguis mai si es pot menjar. A "pre" posa només el que es veu clarament, amb aquests valors: sub = lam|por|plecs|agulles|trompeta|alveols|cervell|coral; col i hc = blanc|groc|taronja|vermell|bru|gris|verd|lila|rosa|rovell; anell i volva = si|no. Si la foto no és d'un bolet o no s'assembla a cap espècie de la llista, explica-ho a "outside" i deixa "cands" buit.`;
  aiAbort=new AbortController();
  try{
    const r=await SAMPLE.json(prompt,{images:[img.blob], signal:aiAbort.signal});
    aiUse();
    const okLvl=['alta','mitjana','baixa','molt baixa'];
    const cands=(Array.isArray(r.cands)?r.cands:[]).filter(c=>c&&BY_ID[c.id]).slice(0,3).map(c=>[c.id, okLvl.includes(c.conf)?c.conf:'baixa', String(c.why||'')]);
    const allow={sub:['lam','por','plecs','agulles','trompeta','alveols','cervell','coral'],col:['blanc','groc','taronja','vermell','bru','gris','verd','lila'],hc:['blanc','groc','taronja','rosa','vermell','lila','rovell','verd','gris'],anell:['si','no'],volva:['si','no']};
    const pre={}; for(const k in allow){ const v=(r.pre&&r.pre[k])||[]; const f=[].concat(v).filter(x=>allow[k].includes(x)); if(f.length) pre[k]=k==='sub'||k==='anell'||k==='volva'?f.slice(0,1):f; }
    LIVE.res={seen:[].concat(r.seen||[]).map(String).slice(0,4), cands, missing:[].concat(r.missing||[]).map(String).slice(0,3), pre, outside:r.outside?String(r.outside):''};
    LIVE.state='done';
  }catch(e){
    LIVE.state='err';
    LIVE.err = e&&e.code==='not_granted' ? 'Cal donar permís perquè la IA miri la foto.' : e&&e.code==='cancelled' ? 'Consulta aturada.' : e&&e.code==='rate_limited' ? 'Massa consultes seguides. Espera una mica.' : 'La IA no ha pogut respondre. Torna-ho a provar més tard.';
  }
  aiAbort=null; openKey();
}
function tv(s,k){ const t=TRAITS[s.id]||{}; let v=t[k];
  if(v===undefined){ if(k==='olor') v=['cap']; else if(k==='lat'||k==='anell'||k==='volva') v='no'; }
  return v; }
function scoreAll(){
  const res=[];
  for(const s of SPECIES){
    let m=0,x=0,hard=false; const bad=[];
    for(const q of KEYQ){
      const a=IDK.ans[q.k]; if(!a||!a.length) continue;
      const v=tv(s,q.k); if(v===undefined) continue;
      const vs=Array.isArray(v)?v:[v];
      if(a.some(o=>vs.includes(o))) m++; else { x++; bad.push(q); if(q.hard) hard=true; }
    }
    if(IDK.zone){ if(s.z.includes(+IDK.zone)) m++; else { x++; bad.push({q:'Zona'}); } }
    if(IDK.month){ if(s.mes.includes(+IDK.month)) m++; else { x++; bad.push({q:'Època de l’any'}); } }
    if(!hard) res.push({s,m,x,bad});
  }
  res.sort((p,q)=>p.x-q.x || q.m-p.m);
  return res;
}
function answeredCount(){ return Object.values(IDK.ans).filter(v=>v&&v.length).length + (IDK.zone?1:0) + (IDK.month?1:0); }
function bestNext(cands){
  const top=cands.filter(c=>c.x===0).slice(0,12); if(top.length<2) return null;
  let best=null,bv=1;
  for(const q of KEYQ){ if(IDK.ans[q.k]&&IDK.ans[q.k].length) continue;
    const vals=new Set(top.map(c=>{ const v=tv(c.s,q.k); return v===undefined?'?':[].concat(v).join('|'); }));
    vals.delete('?'); if(vals.size>bv){ bv=vals.size; best=q; } }
  return best;
}

// Tot es guarda en aquest dispositiu (IndexedDB), fotos incloses. Res no s'envia enlloc.
const CIS = { list:[], ready:false, off:false, draft:null, urls:{}, watch:null };
const CIS_MAX=5;
function cisDB(){ return new Promise((ok,ko)=>{ if(!window.indexedDB) return ko(new Error('idb')); const r=indexedDB.open('llibreta-cistella',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('troballes',{keyPath:'id'}); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); }
async function cisTx(mode, fn){ const db=await cisDB(); return new Promise((ok,ko)=>{ const tx=db.transaction('troballes',mode); const req=fn(tx.objectStore('troballes'));
  tx.oncomplete=()=>ok(req?req.result:undefined); tx.onerror=()=>ko(tx.error); }); }
async function cisLoad(){
  try{ CIS.list=(await cisTx('readonly',st=>st.getAll())).sort((a,b)=>String(b.date).localeCompare(String(a.date))); }catch(e){ CIS.off=true; }
  CIS.ready=true; if(state.tab==='perfil' && $('#cis-list')) $('#cis-list').innerHTML=cisListHTML();
}
const cisURL=(e,i)=> CIS.urls[e.id+':'+i] || (CIS.urls[e.id+':'+i]=URL.createObjectURL(e.photos[i]));
function cisForget(id){ for(const k in CIS.urls) if(k.startsWith(id+':')){ URL.revokeObjectURL(CIS.urls[k]); delete CIS.urls[k]; } }
const cisName = e => e.sp && BY_ID[e.sp] ? BY_ID[e.sp].ca : (e.name || 'Bolet sense identificar');

function locHTML(l){
  const z=zoneAt(l.lat,l.lon), q=l.acc<=10?'molt precisa':l.acc<=25?'bona':'poc precisa';
  const ll=`${l.lat.toFixed(6)}, ${l.lon.toFixed(6)}`;
  return `<div class="loc">${z||isInMap(l)?`<div class="locmap">${mapSVG({mini:true, hl:z?[+z]:[], pt:geoToMap(l.lat,l.lon)})}</div>`:''}
   <div style="min-width:0"><span class="n" style="font-size:1.05rem;user-select:all">${ll}</span> <button class="copy" data-copy="${ll}">Copia</button>
   <br><small>Precisió ±${l.acc} m (${q})${l.alt!=null?` · altitud ${l.alt} m`:''}${z?` · ${ZONES[z].name}`:''}</small>
   <br><a href="https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lon}" target="_blank" rel="noopener">Obre al mapa</a></div></div>`;
}
function isInMap(l){ const [x,y]=geoToMap(l.lat,l.lon); return x>0&&y>0&&x<MAP.w&&y<MAP.h; }

function draftURL(b){ return b._u || (b._u=URL.createObjectURL(b)); }
function paintPhotos(){
  const d=CIS.draft, w=$('#f-photos'); if(!w) return;
  w.innerHTML=`<div class="fphotos">${d.photos.map((b,i)=>`<figure><img src="${draftURL(b)}" alt="Foto ${i+1}"><button type="button" class="phdel" data-ph-del="${i}" aria-label="Treu la foto ${i+1}">×</button></figure>`).join('')}
   ${d.photos.length<CIS_MAX?`<label class="phadd" for="f-file"><span aria-hidden="true">+</span>Foto</label>`:''}</div>
   <input type="file" id="f-file" accept="image/*" multiple hidden>
   <p class="muted" style="font-size:.82rem;margin:.3rem 0 0">Mira «Com fer la foto» a Coneixements: de costat, per sota, la base i tallat.</p>`;
  const f=$('#f-file'); if(f) f.addEventListener('change',async ev=>{ const files=[...ev.target.files].slice(0,CIS_MAX-d.photos.length);
    for(const file of files){ try{ d.photos.push(await cisResize(file)); }catch(err){} } paintPhotos(); });
}
function cisResize(file){ return new Promise((ok,ko)=>{ const u=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{ const k=Math.min(1,1600/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>b?ok(b):ko(new Error('img')),'image/jpeg',.82); };
  im.onerror=()=>{ URL.revokeObjectURL(u); ko(new Error('img')); }; im.src=u; }); }

// --- GPS precís: escolta el senyal uns segons i es queda la lectura més precisa ---
function cisLocate(){
  const d=CIS.draft; if(!d) return;
  if(!navigator.geolocation){ d.gps={err:'Aquest navegador no pot donar la ubicació.'}; paintGps(); return; }
  cisStopGps(); d.gps={busy:true, best:null, start:Date.now()}; paintGps();
  CIS.watch=navigator.geolocation.watchPosition(p=>{
    if(!d.gps.busy) return;
    const c=p.coords, r={lat:c.latitude, lon:c.longitude, acc:Math.round(c.accuracy), alt:c.altitude!=null?Math.round(c.altitude):null, t:p.timestamp};
    if(!d.gps.best || r.acc<=d.gps.best.acc) d.gps.best=r;
    if(d.gps.best.acc<=5 || Date.now()-d.gps.start>90000) cisFixGps(); else paintGps();
  }, err=>{ cisStopGps(); d.gps={err: err.code===1?'No has donat permís per saber la ubicació.':'No s’ha pogut saber la ubicació. Prova-ho en un lloc més obert.'}; paintGps(); },
  { enableHighAccuracy:true, maximumAge:0, timeout:90000 });
}
function cisStopGps(){ if(CIS.watch!=null && navigator.geolocation) navigator.geolocation.clearWatch(CIS.watch); CIS.watch=null; }
function cisFixGps(){ const d=CIS.draft; cisStopGps(); if(d && d.gps.best) d.loc=d.gps.best; if(d) d.gps={}; paintGps(); }
function paintGps(){
  const d=CIS.draft, w=$('#f-gps'); if(!w||!d) return; const g=d.gps||{};
  if(g.busy){ const b=g.best;
    w.innerHTML=`<div class="gps busy" role="status"><b>Buscant el senyal GPS…</b>
      ${b?`<span class="acc">±${b.acc} m</span><small>Espera que el número baixi: com més petit, més precís. Al bosc pot trigar un minut; si pots, surt a una clariana.</small>`:`<small>Si el mòbil et demana permís per saber on ets, accepta’l.</small>`}
      <div class="row">${b?`<button type="button" class="btn solid" data-gps-fix>Desa aquesta posició</button>`:''}<button type="button" class="btn" data-gps-stop>Atura</button></div></div>`; return; }
  w.innerHTML = (g.err?`<p class="warn-line">${esc(g.err)}</p>`:'')
    + (d.loc ? locHTML(d.loc)+`<button type="button" class="btn" data-gps>Torna a agafar la posició</button>` : `<button type="button" class="btn solid" data-gps>Agafa la posició d’ara</button><p class="muted" style="font-size:.82rem;margin:.3rem 0 0">Fes-ho al mateix lloc on l’has trobat. La ubicació no surt del mòbil.</p>`);
}
async function cisSave(){
  const d=CIS.draft, msg=$('#f-msg');
  if(!d.sp && !d.name.trim() && !d.photos.length){ msg.textContent='Tria el bolet, posa-hi un nom o afegeix-hi una foto.'; return; }
  if(d.gps.busy) cisFixGps();
  const rec={ id:d.id||('t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)), sp:d.sp, name:d.sp?'':d.name.trim(), date:d.date||nowLocal(), photos:d.photos, loc:d.loc, note:d.note.trim(), saved:new Date().toISOString() };
  try{ await cisTx('readwrite',st=>st.put(rec)); }catch(e){ msg.textContent='No s’ha pogut desar. Pot ser que el mòbil no tingui espai.'; return; }
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  cisForget(rec.id); await cisLoad(); openFindView(rec.id);
}
async function cisDelete(id){
  if(!confirm('Vols esborrar aquesta troballa i les seves fotos? No es pot desfer.')) return;
  try{ await cisTx('readwrite',st=>st.delete(id)); }catch(e){}
  cisForget(id); await cisLoad(); closeSheet(); if(state.tab==='perfil') render();
}

    <section><h2>On l’has trobat</h2>${e.loc?locHTML(e.loc):`<p class="muted">No vas desar la ubicació.</p>`}</section>

// ---------- Experts (dades compartides, només amb consentiment) ----------
const CONSENT_V = 'v1 · 3 d’octubre de 2026';
const CONSENT_TEXT = [
  'Només es publica el que escriguis aquí: nom, entitat, zona, especialitat, una sola manera de contacte i disponibilitat.',
  'No es publica cap altra dada teva ni es cedeix a ningú.',
  'Respons quan puguis i vulguis. L’app diu sempre que la decisió de menjar un bolet és de qui el cull.',
  'Et pots retirar quan vulguis amb el botó «Retira’m de la llista», o escrivint al projecte.'
];
const EX = { db:null, user:null, uid:null, owner:false, ready:false, off:false,
  experts:[], aprovats:[], aprovatsVer:false, sol:[], mine:null, msg:'' };
const CT = { correu:'Correu', telefon:'Telèfon', web:'Web' };

async function initExperts(){
  try{
    if(!window.claude || !window.claude.use){ EX.off=true; EX.ready=true; paintExperts(); return; }
    const [db,user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db){ EX.off=true; EX.ready=true; paintExperts(); return; }
    EX.db=db; EX.user=user;
    if(user){ EX.owner = await user.isOwner(); EX.uid = await user.id(); }
    db.collection('experts').onSnapshot(s=>{ EX.experts=s.docs.map(d=>({id:d.id,...d.data()})); EX.ready=true; paintExperts(); }, ()=>{ EX.off=true; EX.ready=true; paintExperts(); });
    db.doc('config/aprovats').onSnapshot(s=>{ EX.aprovats = s.exists ? (s.data().ids||[]) : []; EX.aprovatsVer=s.exists; paintExperts(); });
    if(EX.owner) db.collection('solicituds').onSnapshot(s=>{ EX.sol=s.docs.map(d=>({id:d.id,...d.data()})); paintExperts(); });
    else if(EX.uid) db.doc('solicituds/'+EX.uid).onSnapshot(s=>{ EX.mine = s.exists ? {id:s.id,...s.data()} : null; paintExperts(); });
  }catch(e){ EX.off=true; EX.ready=true; paintExperts(); }
}
function visibleExperts(){ return EX.experts.filter(e=>EX.aprovats.includes(e.id)).sort((a,b)=>String(a.nom).localeCompare(String(b.nom),'ca')); }
function expertCard(e, admin){
  const contact = e.contacteTipus==='web'
    ? `<a href="${esc(/^https?:\/\//.test(e.contacte)?e.contacte:'https://'+e.contacte)}" target="_blank" rel="noopener">${esc(e.contacte)}</a>`
    : `<span class="n" style="font-size:1rem;user-select:all">${esc(e.contacte)}</span> <button class="copy" data-copy="${esc(e.contacte)}">Copia</button>`;
  return `<article class="xcard"><div class="xhd"><span class="av" aria-hidden="true">${esc(String(e.nom||'?').trim().charAt(0).toUpperCase())}</span><div style="min-width:0"><h3>${esc(e.nom)}</h3>${e.entitat?`<p class="xent">${esc(e.entitat)}</p>`:''}</div></div>
    <dl class="xdl"><dt>Zona</dt><dd>${esc(e.zona)}</dd>${e.especialitat?`<dt>Especialitat</dt><dd>${esc(e.especialitat)}</dd>`:''}${e.disponibilitat?`<dt>Disponible</dt><dd>${esc(e.disponibilitat)}</dd>`:''}<dt>${CT[e.contacteTipus]||'Contacte'}</dt><dd>${contact}</dd></dl>
    ${admin?`<button class="btn danger" data-xremove="${esc(e.id)}">Treu de la llista</button>`:''}${(!admin && EX.uid && e.id===EX.uid)?`<button class="btn danger" data-xwithdraw>Retira’m de la llista</button>`:''}</article>`;
}
function formHTML(prefix, ownerMode){
  return `<form class="xform" id="${prefix}-form" novalidate>
   <label for="${prefix}-nom">Nom, o com vols que et diguin *</label><input id="${prefix}-nom" required maxlength="80">
   <label for="${prefix}-entitat">Entitat</label><input id="${prefix}-entitat" maxlength="100" placeholder="p. ex. Agrupació Micològica Berguedana">
   <label for="${prefix}-zona">Zona on pots ajudar *</label><input id="${prefix}-zona" required maxlength="100" placeholder="p. ex. Berga i Alt Berguedà">
   <label for="${prefix}-esp">Especialitat</label><input id="${prefix}-esp" maxlength="120" placeholder="p. ex. rússules, bolets de primavera">
   <label for="${prefix}-ctipus">Manera de contacte que es pot publicar *</label>
   <div class="row"><select id="${prefix}-ctipus" style="flex:0 0 7.5rem"><option value="correu">Correu</option><option value="telefon">Telèfon</option><option value="web">Web</option></select><input id="${prefix}-contacte" required maxlength="120" style="flex:1 1 10rem;min-width:0"></div>
   <label for="${prefix}-disp">Quan estàs disponible</label><input id="${prefix}-disp" maxlength="100" placeholder="p. ex. caps de setmana de tardor">
   <div class="consent"><b>Consentiment (${CONSENT_V})</b><ul>${CONSENT_TEXT.map(t=>`<li>${t}</li>`).join('')}</ul>
   <label class="toggle" for="${prefix}-ok"><input type="checkbox" id="${prefix}-ok"> ${ownerMode?'Tinc el consentiment signat d’aquesta persona amb aquestes dades':'He llegit el text i accepto aparèixer a l’app amb aquestes dades'}</label></div>
   <p class="xmsg" id="${prefix}-msg" role="status"></p>
   <button class="btn solid" type="submit">${ownerMode?'Afegeix a la llista':'Envia la sol·licitud'}</button></form>`;

function readForm(p){
  const v=id=>($('#'+p+'-'+id)?.value||'').trim();
  return { nom:v('nom'), entitat:v('entitat'), zona:v('zona'), especialitat:v('esp'), contacteTipus:v('ctipus'), contacte:v('contacte'), disponibilitat:v('disp'), ok:$('#'+p+'-ok')?.checked };
}
function viewExperts(){
  return `<p class="lead">Persones de la zona que han acceptat que les contactis per consultar un bolet. Porta-hi sempre el bolet sencer, amb la base.</p>
   <div id="x-list"></div><div id="x-mine"></div><div id="x-admin"></div><div id="x-join"></div>`;
}
function paintExperts(){
  if(state.tab!=='bergueda' || state.areaTab!=='experts' || !$('#x-list')) return;
  const keep = ['x-join','x-admin'].map(id=>document.activeElement && $('#'+id)?.contains(document.activeElement));
  const list = visibleExperts();
  $('#x-list').innerHTML = !EX.ready ? `<p class="empty">Carregant la llista…</p>`
    : EX.off ? `<div class="panel"><p>${window.claude?'Ara no es pot carregar la llista d’experts.':'La llista d’experts arribarà en una propera versió.'} Mentrestant, a les fires boletaires del Berguedà hi ha exposicions on et poden identificar els bolets.</p></div>`
    : list.length ? `<div class="xgrid">${list.map(e=>expertCard(e,false)).join('')}</div>`
    : `<div class="panel xempty"><h2>Encara no hi ha cap expert a la llista</h2><p>Hi apareixeran les persones que acceptin sortir-hi per escrit. Si en coneixes alguna, explica-li l’app.</p></div>`;
  // la meva sol·licitud
  const m = EX.mine;
  $('#x-mine').innerHTML = (!EX.owner && m) ? `<div class="panel"><h2>La teva sol·licitud</h2><p>${m.estat==='aprovada'?'Ja surts a la llista.':'Està pendent de revisió.'}</p><button class="btn danger" data-xwithdraw>${m.estat==='aprovada'?'Retira’m de la llista':'Retira la sol·licitud'}</button></div>` : '';
  // admin
  if(EX.owner && !keep[1]){
    const pend = EX.sol.filter(s=>s.estat!=='aprovada');
    $('#x-admin').innerHTML = `<div class="panel admin"><h2>Gestió (només tu ho veus)</h2>
      <p><b>${pend.length}</b> ${pend.length===1?'sol·licitud pendent':'sol·licituds pendents'} · <b>${list.length}</b> a la llista</p>
      ${pend.map(s=>`<div class="sol"><b>${esc(s.nom)}</b>${s.entitat?` · ${esc(s.entitat)}`:''}<br><small>${esc(s.zona)} · ${CT[s.contacteTipus]||''}: ${esc(s.contacte)} · consentiment ${esc(s.consentiment?.versio||'?')}, ${esc((s.consentiment?.data||'').slice(0,10))}</small>
        <div class="row" style="margin-top:.4rem"><button class="btn solid" data-xapprove="${esc(s.id)}">Aprova</button><button class="btn danger" data-xreject="${esc(s.id)}">Rebutja</button></div></div>`).join('')}
      ${list.length?`<h3 style="margin-top:.6rem">A la llista</h3>${list.map(e=>`<div class="sol"><b>${esc(e.nom)}</b> <button class="btn danger" data-xremove="${esc(e.id)}" style="float:right">Treu</button><br><small>${esc(e.zona)} · ${e.origen==='manual'?'afegit per tu amb consentiment signat':'apuntat des de l’app'}</small></div>`).join('')}`:''}
      <details class="rg" style="margin-top:.4rem"><summary><span><b>Afegeix un expert</b><small>Quan tinguis el consentiment signat</small></span></summary><div class="in">${formHTML('xa',true)}</div></details></div>`;
  } else if(!EX.owner) $('#x-admin').innerHTML='';
  // apuntar-s'hi
  if(!keep[0]){
    const canJoin = EX.db && EX.uid && !EX.owner && !m;
    $('#x-join').innerHTML = EX.owner ? '' : `<div class="panel"><h2>Ets expert i vols sortir-hi?</h2>
      ${canJoin ? formHTML('xj',false)
        : m ? '' : (window.claude?`<p>Per apuntar-t’hi des d’aquí cal obrir l’app amb un compte de Claude amb permís de col·laborador. També pots signar el document de consentiment i enviar-lo al projecte.</p>`:`<p>Per apuntar-t’hi, signa el document de consentiment i envia’l al projecte.</p>`)}</div>`;
  }
}
async function submitJoin(){
  const f=readForm('xj'), msg=$('#xj-msg');
  if(!f.nom||!f.zona||!f.contacte){ msg.textContent='Omple el nom, la zona i el contacte.'; return; }
  if(!f.ok){ msg.textContent='Cal que marquis la casella de consentiment.'; return; }
  try{
    msg.textContent='Enviant…';
    const {ok,...d}=f;
    await EX.db.doc('solicituds/'+EX.uid).set({...d, estat:'pendent', consentiment:{versio:CONSENT_V, data:new Date().toISOString()}});
    msg.textContent='Sol·licitud enviada. Sortiràs a la llista quan es revisi.';
  }catch(e){ msg.textContent='No s’ha pogut enviar. Pot ser que el teu accés només sigui de lectura: demana permís de col·laborador o envia el consentiment signat.'; }
}
async function setAprovats(ids){ await EX.db.doc('config/aprovats').set({ids}); }
async function ownerAdd(){
  const f=readForm('xa'), msg=$('#xa-msg');
  if(!f.nom||!f.zona||!f.contacte){ msg.textContent='Omple el nom, la zona i el contacte.'; return; }
  if(!f.ok){ msg.textContent='Marca la casella quan tinguis el consentiment signat.'; return; }
  try{
    const id='m-'+Date.now().toString(36); const {ok,...d}=f;
    await EX.db.doc('experts/'+id).set({...d, origen:'manual', consentiment:{versio:CONSENT_V, data:new Date().toISOString()}});
    await setAprovats([...EX.aprovats.filter(x=>x!==id), id]);
    $('#xa-form').reset(); msg.textContent='Afegit a la llista.';
  }catch(e){ msg.textContent='No s’ha pogut desar. Torna-ho a provar.'; }
}
async function approve(id){
  const s=EX.sol.find(x=>x.id===id); if(!s) return;
  const pub={nom:s.nom, entitat:s.entitat||'', zona:s.zona, especialitat:s.especialitat||'', contacteTipus:s.contacteTipus, contacte:s.contacte, disponibilitat:s.disponibilitat||'', origen:'app', consentiment:s.consentiment||{}};
  try{ await EX.db.doc('experts/'+id).set(pub); await setAprovats([...EX.aprovats.filter(x=>x!==id), id]); await EX.db.doc('solicituds/'+id).update({estat:'aprovada'}); }catch(e){}
}
async function removeExpert(id){
  try{ await setAprovats(EX.aprovats.filter(x=>x!==id)); await EX.db.doc('experts/'+id).delete(); const s=EX.sol.find(x=>x.id===id); if(s) await EX.db.doc('solicituds/'+id).delete(); }catch(e){}
}
async function withdraw(){
  try{ await EX.db.doc('experts/'+EX.uid).delete(); }catch(e){}
  try{ await EX.db.doc('solicituds/'+EX.uid).delete(); }catch(e){}
}
document.addEventListener('submit',e=>{ if(e.target.id==='xj-form'){ e.preventDefault(); submitJoin(); } if(e.target.id==='xa-form'){ e.preventDefault(); ownerAdd(); } });
const twoStep = new Set();
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-xapprove],[data-xreject],[data-xremove],[data-xwithdraw]'); if(!b) return;
  const key=b.dataset.xapprove||b.dataset.xreject||b.dataset.xremove||'me';
  const kind=b.hasAttribute('data-xapprove')?'a':b.hasAttribute('data-xreject')?'r':b.hasAttribute('data-xremove')?'x':'w';
  if(kind!=='a' && !twoStep.has(kind+key)){ twoStep.add(kind+key); b.textContent='Toca per confirmar'; return; }
  twoStep.delete(kind+key);
  if(kind==='a') approve(key); else if(kind==='r') EX.db.doc('solicituds/'+key).delete().catch(()=>{}); else if(kind==='x') removeExpert(key); else withdraw();
});

document.addEventListener('click',e=>{
  const zp=e.target.closest('.zp,.zchip'); if(zp){ state.areaZone = state.areaZone==zp.dataset.zone ? '' : zp.dataset.zone; paintZone(); return; }
  const zl=e.target.closest('[data-zonelist]'); if(zl){ state.zone=zl.dataset.zonelist; state.tab='bolets'; history.replaceState(null,'','#bolets'); render(); window.scrollTo(0,0); return; }
  const zg=e.target.closest('[data-zonego]'); if(zg){ e.preventDefault(); closeSheet(); state.areaZone=zg.dataset.zonego; goTab('bergueda'); render(); setTimeout(()=>$('#zones-panel')?.scrollIntoView({block:'start'}),30); return; }
  const rg=e.target.closest('[data-reag]'); if(rg){ e.preventDefault(); closeSheet(); goTab('coneixements'); render(); $('#k-reactius').open=true; const d=$('#r-'+rg.dataset.reag); if(d){ d.open=true; setTimeout(()=>d.scrollIntoView({block:'start'}),30); } return; }
  const fn=e.target.closest('[data-find]'); if(fn){ e.preventDefault(); openFind(null, fn.dataset.sp||''); return; }
  const fo=e.target.closest('[data-find-open]'); if(fo){ openFindView(fo.dataset.findOpen); return; }
  const fe=e.target.closest('[data-find-edit]'); if(fe){ openFind(fe.dataset.findEdit); return; }
  const fd=e.target.closest('[data-find-del]'); if(fd){ e.preventDefault(); if(fd.dataset.findDel && CIS.list.some(x=>x.id===fd.dataset.findDel)) cisDelete(fd.dataset.findDel); return; }
  const pd=e.target.closest('[data-ph-del]'); if(pd&&CIS.draft){ CIS.draft.photos.splice(+pd.dataset.phDel,1); paintPhotos(); return; }
  if(e.target.closest('[data-gps]')){ cisLocate(); return; }
  if(e.target.closest('[data-gps-fix]')){ cisFixGps(); return; }
  if(e.target.closest('[data-gps-stop]')){ const d=CIS.draft; cisStopGps(); if(d) d.gps={}; paintGps(); return; }
  const ar=e.target.closest('[data-area]'); if(ar){ goTab(ar.dataset.area==='experts'?'experts':'bergueda'); render(); return; }
},true);
document.addEventListener('keydown',e=>{ const zp=e.target.closest&&e.target.closest('.zp'); if(zp && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); zp.dispatchEvent(new MouseEvent('click',{bubbles:true})); } });

// ---------- Esdeveniments ----------
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]'); if(t){ e.preventDefault(); goTab(t.dataset.tab); if(!$('#sheet').hidden) closeSheet(); render(); window.scrollTo(0,0); return; }
  const o=e.target.closest('[data-open]'); if(o){ e.preventDefault(); openSheet(o.dataset.open); return; }
  const c=e.target.closest('[data-copy]'); if(c){ const v=c.dataset.copy; const done=()=>{ c.textContent='Copiat'; setTimeout(()=>c.textContent='Copia',1500); };
    try{ navigator.clipboard.writeText(v).then(done).catch(()=>{ c.textContent=v; }); }catch(err){ c.textContent=v; } }
});
document.addEventListener('change',e=>{
  const g=e.target.closest('[data-pref]'); if(g && e.target.name){ prefs[e.target.name]=e.target.value; savePrefs(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });

applyPrefs();
const h=location.hash.slice(1);
if(TABS.some(t=>t.id===h&&!t.center) || OLD_TABS[h]) goTab(h);
render();
if(BY_ID[h]) openSheet(h);
if(h==='identifica') openKey();
initSample();
initExperts();
cisLoad();
})();

</script>
<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  const hadSW = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(hadSW && !reloaded){ reloaded = true; location.reload(); } });
  addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').then(reg=>{
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') reg.update().catch(()=>{}); });
  }).catch(()=>{}));
}
</script>
